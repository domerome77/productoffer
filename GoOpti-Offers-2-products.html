<script>
// Details — Streamline, New flow 06.10.2026: Flow 13 one-way 1496:79390 / 79465 (filled) / 79540 (invoice open),
// round trip 1504:4492. Labels sit inside the fields (placeholders), each field also has a hidden <label>.
// Copy follows the round-trip frames (newer): "Your ticket and receipt go here.". The invoice moved to Extras (20.10.2026).
(function () {
  const u = GO.u;
  const { esc } = u;
  const ic = GO.icon;
  const B = GO.booking;

  // Phone prefix: Slovenia first (half of the users), then Italy, Croatia, neighbours and the usual tourists
  const COUNTRIES = [
    ['si', 'Slovenia', '386'], ['it', 'Italy', '39'], ['hr', 'Croatia', '385'], ['at', 'Austria', '43'],
    ['de', 'Germany', '49'], ['ch', 'Switzerland', '41'], ['hu', 'Hungary', '36'], ['ba', 'Bosnia and Herzegovina', '387'],
    ['mk', 'North Macedonia', '389'], ['cz', 'Czechia', '420'], ['sk', 'Slovakia', '421'], ['pl', 'Poland', '48'],
    ['fr', 'France', '33'], ['be', 'Belgium', '32'], ['nl', 'Netherlands', '31'], ['ie', 'Ireland', '353'],
    ['gb', 'United Kingdom', '44'], ['us', 'United States', '1'],
  ];
  GO.COUNTRY_CODES = Object.fromEntries(COUNTRIES.map(c => [c[0], c[2]]));
  const country = code => COUNTRIES.find(c => c[0] === code) || COUNTRIES[0];

  const EMPTY = { first: '', last: '', email: '', cc: 'si', phone: '' };
  function contact() { return Object.assign({}, EMPTY, GO.store.get().contact); }
  function setContact(patch) { GO.store.set({ contact: Object.assign(contact(), patch) }); }

  // ---------- validation ----------
  // Errors appear after Continue, or when a touched field is left; typing a valid value clears them on the spot.
  let errors = {};
  let tried = false;

  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  function check(c, key) {
    const v = (c[key] || '').trim();
    switch (key) {
      case 'first': return v ? '' : 'Enter your first name.';
      case 'last': return v ? '' : 'Enter your last name.';
      case 'email': return !v ? 'Enter your email.' : EMAIL.test(v) ? '' : 'Check the email, it should look like name@example.com.';
      case 'phone': {
        const d = v.replace(/\D/g, '').replace(/^0+/, '');
        return !d ? 'Enter your mobile number.' : d.length < 6 || d.length > 12 ? 'Check the number, it looks too ' + (d.length < 6 ? 'short.' : 'long.') : '';
      }
      default: return '';
    }
  }
  const KEYS = ['first', 'last', 'email', 'phone'];

  // ---------- pieces ----------
  function errText(key) {
    return errors[key] ? '<p id="' + key + '-err" class="t-body-sm field-error">' + ic('error-circle', 16) + esc(errors[key]) + '</p>' : '';
  }
  function describedBy(key, helper) {
    const ids = [errors[key] ? key + '-err' : '', helper ? key + '-help' : ''].filter(Boolean).join(' ');
    return ids ? ' aria-describedby="' + ids + '"' : '';
  }

  function input(key, label, c, attrs, helper) {
    return '<div class="form-field">' +
      '<label class="sr-only" for="f-' + key + '">' + label + '</label>' +
      '<div class="field' + (errors[key] ? ' field--error' : '') + '">' +
        '<input id="f-' + key + '" name="' + key + '" placeholder="' + label + '" value="' + esc(c[key]) + '" ' + attrs +
        (errors[key] ? ' aria-invalid="true"' : '') + describedBy(key, helper) + '>' +
      '</div>' +
      errText(key) +
      (helper ? '<p id="' + key + '-help" class="t-body-sm c-secondary">' + helper + '</p>' : '') +
    '</div>';
  }

  // First and last name in one block with a divider; each half keeps its own hidden label and error
  function names(c) {
    const half = (key, label, ac) => '<label class="sr-only" for="f-' + key + '">' + label + '</label>' +
      '<input id="f-' + key + '" name="' + key + '" placeholder="' + label + '" value="' + esc(c[key]) + '" autocomplete="' + ac + '" autocapitalize="words" enterkeyhint="next"' +
      (errors[key] ? ' aria-invalid="true"' : '') + describedBy(key) + '>';
    return '<div class="form-field">' +
      '<div class="field field--names' + (errors.first || errors.last ? ' field--error' : '') + '">' +
        half('first', 'First name', 'given-name') + '<span class="field__divider" aria-hidden="true"></span>' + half('last', 'Last name', 'family-name') +
      '</div>' + errText('first') + errText('last') +
    '</div>';
  }

  function phone(c) {
    const cur = country(c.cc);
    return '<div class="form-field">' +
      '<div class="field field--phone' + (errors.phone ? ' field--error' : '') + '">' +
        '<span class="phone-cc">' +
          '<span class="phone-cc__flag" data-flag>' + GO.FLAGS[cur[0]] + '</span>' + ic('chevron-down', 16) +
          '<select id="f-cc" name="cc" aria-label="Country code" autocomplete="tel-country-code">' +
            COUNTRIES.map(k => '<option value="' + k[0] + '"' + (k[0] === cur[0] ? ' selected' : '') + '>' + esc(k[1]) + ' +' + k[2] + '</option>').join('') +
          '</select>' +
        '</span>' +
        '<label class="sr-only" for="f-phone">Mobile number</label>' +
        '<input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" enterkeyhint="next" placeholder="041 234 567" value="' + esc(c.phone) + '"' +
          (errors.phone ? ' aria-invalid="true"' : '') + describedBy('phone', true) + '>' +
      '</div>' +
      errText('phone') +
      '<p id="phone-help" class="t-body-sm c-secondary">The day before, we text you the exact pick-up time.</p>' +
    '</div>';
  }

  function account() {
    return '<section class="account" aria-labelledby="acc-title">' +
      '<div class="ex-card account__social">' +
        '<h2 id="acc-title" class="t-label-lg">Or continue with</h2>' +
        '<div class="account__row">' +
          '<button class="btn btn--secondary btn--social" data-act="social" data-p="Google">' + GO.LOGO_GOOGLE + 'Google</button>' +
          '<button class="btn btn--secondary btn--social" data-act="social" data-p="Facebook">' + GO.LOGO_FACEBOOK + 'Facebook</button>' +
        '</div>' +
        '<p class="t-body-sm c-secondary">Log in or create an account.</p>' +
      '</div>' +
      '<button class="account__email" data-act="login">' + ic('mail', 20) + '<span class="t-label-lg">Continue with email</span></button>' +
    '</section>';
  }

  // Logged-in card (Log in - Flixbus 2604:8427): an existing account fills the form, a new one only knows the email
  function accountCard(a) {
    return '<div class="ex-card account-card" role="status">' +
      '<div class="account-card__title"><span class="t-label-lg">' + (a.created ? 'Account created' : 'Logged in as ' + esc(a.name)) + '</span>' +
      '<button type="button" class="account-card__out t-label-lg" data-act="logout">Log out</button></div>' +
      '<p class="t-body-sm c-secondary">' + (a.created
        ? 'You’re logged in as ' + esc(a.email) + '. Add your name and phone once, next time we fill them in.'
        : 'We filled in your details from your account.') + '</p></div>';
  }

  // Other passengers (2308:18785): with more than one traveller a link opens the sheet; once saved it reads "Edit other passengers data"
  function otherLink(s) {
    if (others(s).length === 0) return '';
    const done = othersDone(s);
    return '<div class="others"><button type="button" class="link t-label-lg others__link" data-act="others">' +
      ic(done ? 'users' : 'plus', 20) + '<span>' + (done ? 'Edit other passengers data' : 'Add other passengers') + '</span></button></div>';
  }

  function bar(s, T, L) {
    const e = B.ex();
    const note = (L.length > 1 ? L.length + ' rides, ' : '') + B.paxLabel(s) + (e.voucher ? ', after discount' : '') + ', incl. fees';
    return '<div class="cta-bar cta-bar--total">' +
      '<div class="total-row">' +
        '<div class="total-row__text">' +
          '<div class="total-row__label"><span class="t-label-lg">Total</span><button class="link t-caption" data-act="total">Show details</button></div>' +
          '<div class="t-caption c-tertiary">' + esc(note) + '</div>' +
        '</div>' +
        '<div class="t-h2 nowrap">' + B.money2(T.total) + '</div>' +
      '</div>' +
      '<button class="btn btn--primary" data-act="pay">Continue to payment</button>' +
    '</div>';
  }

  // ---------- screen ----------
  GO.screens.details = {
    render(s) {
      const head = '<header class="page-header"><button class="icon-btn" data-act="back" aria-label="Back">' + ic('chevron-left', 24) + '</button><h1 class="t-h2">Enter passenger info</h1></header>';
      const L = B.legs(s);
      if (!L.length || L.some(l => !l.o)) {
        return head + GO.noRide(s);
      }
      const c = contact();
      const T = B.totals(s, B.ex(), L);
      return head +
        '<main class="details">' +
          (c.account ? accountCard(c.account) : '') +
          '<form class="details__form" data-details-form novalidate>' +
            '<section class="contact" aria-labelledby="contact-title">' +
              (c.account
                ? '<h2 id="contact-title" class="sr-only">Contact details</h2>'
                : '<h2 id="contact-title" class="t-label-lg">Book without creating an account.</h2>') +
              names(c) +
              input('email', 'Your email', c, 'type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" enterkeyhint="next"', 'Your ticket and receipt go here.') +
              phone(c) +
            '</section>' +
            otherLink(s) +
          '</form>' +
          (c.account ? '' : account()) +
        '</main>' +
        bar(s, T, L);
    },
    mount(root) {
      const form = root.querySelector('[data-details-form]');
      if (!form) return;
      // Values go to the store as they are typed; an error disappears as soon as the value is fine
      form.addEventListener('input', ev => {
        const t = ev.target;
        if (!t.name || t.name === 'cc') return;
        setContact({ [t.name]: t.value });
        if (errors[t.name] && !check(contact(), t.name)) clearError(t);
      });
      form.addEventListener('change', ev => {
        if (ev.target.name !== 'cc') return;
        setContact({ cc: ev.target.value });
        root.querySelector('[data-flag]').innerHTML = GO.FLAGS[ev.target.value];
      });
      // Leaving a field that already had text (or after a failed Continue) shows its error.
      // The DOM is patched in place: a re-render here would swallow the tap that moved the focus.
      form.addEventListener('focusout', ev => {
        const t = ev.target;
        if (!t.name || !KEYS.includes(t.name)) return;
        const c = contact();
        if (!tried && !(c[t.name] || '').trim()) return;
        showError(t.name, check(c, t.name));
      });
      // Enter (the "next" key on the phone keyboard) moves to the next field, on the last one it submits
      form.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT') return;
        ev.preventDefault();
        const list = Array.from(form.querySelectorAll('input'));
        const next = list[list.indexOf(ev.target) + 1];
        if (next) next.focus(); else GO.screens.details.actions.pay();
      });
    },
    actions: {
      back: () => GO.router.back(),
      'to-offers': () => GO.router.go('/offers', { replace: true }),
      'see-booking': () => GO.router.go('/booked', { replace: true }),
      'new-ride': () => GO.router.go('/', { replace: true }),
      social: el => el.dataset.p === 'Google' ? GO.router.go('/details/google') : u.toast('Sign-in with Facebook comes in a later build'),
      logout() {
        setContact({ account: null });
        GO.router.refresh();
        u.toast('You’re logged out. Your details stay in the form.');
        const el = document.getElementById('f-first'); if (el) el.focus({ preventScroll: true });
      },
      login: () => GO.router.go('/details/email'),
      others: () => GO.router.go('/details/passengers'),
      total: () => GO.router.go('/details/total'),
      pay() {
        tried = true;
        const c = contact();
        KEYS.forEach(k => showError(k, check(c, k)));
        const first = KEYS.find(k => errors[k]);
        if (first) {
          const el = document.getElementById('f-' + first);
          el.focus({ preventScroll: true });
          el.closest('.form-field').scrollIntoView({ block: 'center', behavior: 'smooth' });
          return;
        }
        GO.router.go('/payment');
      },
    },
  };

  // Show or clear one field's error without re-rendering the screen
  function showError(key, msg) {
    const t = document.getElementById('f-' + key);
    if (!t) { delete errors[key]; return; }
    if (msg) errors[key] = msg; else delete errors[key];
    const f = t.closest('.form-field');
    const box = f.querySelector('.field');
    box.classList.toggle('field--error', !!msg || Array.from(box.querySelectorAll('input')).some(i => i !== t && errors[i.name]));
    let p = f.querySelector('#' + key + '-err');
    if (!msg) { if (p) p.remove(); t.removeAttribute('aria-invalid'); }
    else {
      if (!p || p.id !== key + '-err') { p = f.querySelector('#' + key + '-err'); }
      if (!p) { p = document.createElement('p'); p.id = key + '-err'; p.className = 't-body-sm field-error'; (key === 'last' && f.querySelector('#first-err') || box).after(p); }
      p.innerHTML = ic('error-circle', 16) + esc(msg);
      t.setAttribute('aria-invalid', 'true');
    }
    const ids = [msg ? key + '-err' : '', f.querySelector('#' + key + '-help') ? key + '-help' : ''].filter(Boolean).join(' ');
    if (ids) t.setAttribute('aria-describedby', ids); else t.removeAttribute('aria-describedby');
  }
  function clearError(t) { showError(t.name, ''); }

  // ---------- sheet: Continue with Google (simulated) ----------
  // The real button opens Google's own window and returns with the name and email. The prototype has no Google keys,
  // so a sheet of test accounts stands in for it: a GoOpti customer (profile with a phone) and someone new.
  const TEST_ACCOUNTS = [
    { name: 'Maja Novak', first: 'Maja', last: 'Novak', email: 'maja.novak@gmail.com', cc: 'si', phone: '41 555 218', note: 'Booked with GoOpti before, phone saved' },
    { name: 'Luca Rossi', first: 'Luca', last: 'Rossi', email: 'luca.rossi@gmail.com', note: 'New to GoOpti, no phone yet' },
  ];
  let signing = -1;

  GO.screens['details-google'] = {
    overlay: true, base: 'details', sheetClass: 'sheet--bottom',
    render() {
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Continue with Google</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body sheet__body--gap16">' +
          '<p class="t-body-sm c-secondary">Prototype: on the real site Google’s own window opens here. Pick a test account, nothing is sent anywhere.</p>' +
          '<ul class="place-list" aria-label="Test accounts">' + TEST_ACCOUNTS.map((a, i) =>
            '<li><button class="place-option" data-act="google-pick" data-i="' + i + '"' + (signing === i ? ' aria-busy="true"' : '') + (signing >= 0 ? ' disabled' : '') + '>' +
              '<span class="place-option__icon avatar" aria-hidden="true">' + a.first[0] + '</span>' +
              '<span class="place-option__text"><span class="place-option__name">' + esc(a.name) + '</span>' +
              '<span class="place-option__detail">' + esc(a.email + ', ' + a.note) + '</span></span>' +
              (signing === i ? '<span class="spinner" aria-hidden="true"></span>' : '') +
            '</button></li>').join('') + '</ul>' +
        '</div>';
    },
    actions: {
      close: () => GO.router.back(),
      async 'google-pick'(el) {
        if (signing >= 0) return;
        signing = +el.dataset.i;
        GO.router.refresh(); // base re-render is harmless; redraw the sheet with the spinner
        const sheet = document.querySelector('.sheet');
        if (sheet) { sheet.innerHTML = GO.screens['details-google'].render(); }
        await u.sleep(700);
        const a = TEST_ACCOUNTS[signing];
        signing = -1;
        // the profile fills the form; a phone comes only from a GoOpti profile (Google doesn't share it)
        const patch = { account: { name: a.name, email: a.email }, first: a.first, last: a.last, email: a.email };
        if (a.phone) Object.assign(patch, { cc: a.cc, phone: a.phone });
        setContact(patch);
        ['first', 'last', 'email'].concat(a.phone ? ['phone'] : []).forEach(k => delete errors[k]);
        GO.router.back();
        setTimeout(() => {
          const next = !a.phone && document.getElementById('f-phone');
          if (next) { next.focus({ preventScroll: true }); next.closest('.form-field').scrollIntoView({ block: 'center' }); }
        }, 50);
      },
    },
  };

  // ---------- sheets: log in or sign up with a code from the email (Log in - Flixbus 2604:8427) ----------
  // Email → 6-digit code → done; one path for logging in and signing up. No real email goes out: any 6 digits pass,
  // 000000 shows the wrong-code error (listed in ⚙). maja.novak@gmail.com is an existing account, any other email gets a new one.
  let loginEmail = '';
  let loginErr = '';
  let codeErr = '';
  const known = email => TEST_ACCOUNTS.find(a => a.email === email.toLowerCase());
  // the same two sheets open from Details and from the profile icon on home (#/login, user 20.10.2026)
  const fromHome = () => location.hash.startsWith('#/login');
  const emailRoute = () => fromHome() ? '/login' : '/details/email';
  const codeRoute = () => fromHome() ? '/login/code' : '/details/code';

  function sheetHead(title) {
    return '<div class="sheet-handle" aria-hidden="true"></div>' +
      '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">' + title + '</h2></div>' +
      '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>';
  }
  function loginField(id, err, attrs, value) {
    return '<div class="form-field"><div class="field' + (err ? ' field--error' : '') + '">' +
      '<input id="' + id + '" value="' + esc(value) + '" ' + attrs + (err ? ' aria-invalid="true" aria-describedby="' + id + '-err"' : '') + '></div>' +
      (err ? '<p id="' + id + '-err" class="t-body-sm field-error" role="alert">' + ic('error-circle', 16) + esc(err) + '</p>' : '') + '</div>';
  }
  // Errors are patched in place, like on Details: a re-render would drop the keyboard
  function setFieldError(input, msg) {
    const f = input.closest('.form-field');
    f.querySelector('.field').classList.toggle('field--error', !!msg);
    let p = f.querySelector('.field-error');
    if (!msg) { if (p) p.remove(); input.removeAttribute('aria-invalid'); input.removeAttribute('aria-describedby'); return; }
    if (!p) { p = document.createElement('p'); p.id = input.id + '-err'; p.className = 't-body-sm field-error'; p.setAttribute('role', 'alert'); f.querySelector('.field').after(p); }
    p.innerHTML = ic('error-circle', 16) + esc(msg);
    input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', p.id);
  }
  function busy(btn, label) {
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    btn.innerHTML = '<span class="sr-only">' + label + '</span><span class="btn__label">Continue</span>';
  }
  const emailError = v => !v ? 'Enter your email.' : EMAIL.test(v) ? '' : 'Check the email, it should look like name@example.com.';

  GO.screens['details-email'] = {
    overlay: true, base: 'details', sheetClass: 'sheet--bottom',
    render() {
      const value = loginEmail || contact().email;
      return sheetHead('Log in or sign up') +
        '<form class="sheet__body login-sheet" data-login-form novalidate>' +
          '<p class="t-body c-secondary">Enter your email and we’ll send you a code. No password needed. If you’re new, we’ll create your account.</p>' +
          '<div class="login-sheet__form">' +
            '<label class="sr-only" for="login-email">Your email</label>' +
            loginField('login-email', loginErr, 'type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="Your email"', value) +
            '<button class="btn btn--primary" data-act="send-code"><span class="btn__label">Continue</span></button>' +
          '</div>' +
          // legal line in caption, paler and smaller than the text above (user, 20.10.2026)
          '<p class="t-caption c-tertiary">By continuing, you agree to the <button type="button" class="link link--inline login-sheet__legal" data-act="terms">Terms and conditions</button> and <button type="button" class="link link--inline login-sheet__legal" data-act="terms">Privacy policy</button>.</p>' +
        '</form>';
    },
    mount(root) {
      const form = root.querySelector('[data-login-form]');
      if (!form) return;
      const input = form.querySelector('#login-email');
      form.addEventListener('submit', ev => { ev.preventDefault(); GO.screens['details-email'].actions['send-code'](); });
      input.addEventListener('input', () => { if (loginErr && !emailError(input.value.trim())) { loginErr = ''; setFieldError(input, ''); } });
      input.addEventListener('focusout', () => { const v = input.value.trim(); if (v) { loginErr = emailError(v); setFieldError(input, loginErr); } });
    },
    actions: {
      close: () => GO.router.back(),
      terms: () => u.toast('Terms open in a new tab on the real site'),
      async 'send-code'() {
        const input = document.getElementById('login-email');
        const btn = document.querySelector('[data-act=send-code]');
        if (!input || btn.disabled) return;
        const v = input.value.trim();
        loginErr = emailError(v);
        setFieldError(input, loginErr);
        if (loginErr) { input.focus(); return; }
        busy(btn, 'Sending the code…');
        await u.sleep(700);
        loginEmail = v; codeErr = '';
        // replace: the cross on the code step closes the whole sheet, "Change email" comes back here
        GO.router.go(codeRoute(), { replace: true });
      },
    },
  };

  GO.screens['details-code'] = {
    overlay: true, base: 'details', sheetClass: 'sheet--bottom',
    render() {
      return sheetHead('Check your email') +
        '<form class="sheet__body login-sheet" data-code-form novalidate>' +
          '<p class="t-body c-secondary">Enter the 6-digit code we sent to ' + esc(loginEmail) + '. <button type="button" class="link link--inline" data-act="change-email">Change email</button></p>' +
          '<div class="login-sheet__form">' +
            '<label class="sr-only" for="login-code">6-digit code</label>' +
            loginField('login-code', codeErr, 'inputmode="numeric" autocomplete="one-time-code" maxlength="6" enterkeyhint="go" placeholder="6-digit code"', '') +
            '<p class="t-body-sm">Didn’t get it? Check spam or <button type="button" class="link link--inline" data-act="resend">send a new code</button></p>' +
            '<button class="btn btn--primary" data-act="verify"><span class="btn__label">Continue</span></button>' +
          '</div>' +
        '</form>';
    },
    mount(root) {
      const form = root.querySelector('[data-code-form]');
      if (!form) return;
      // opened by a link or after a reload: the email step was not passed in this tab
      if (!loginEmail) { GO.router.go(emailRoute(), { replace: true }); return; }
      const input = form.querySelector('#login-code');
      form.addEventListener('submit', ev => { ev.preventDefault(); GO.screens['details-code'].actions.verify(); });
      input.addEventListener('input', () => {
        const d = input.value.replace(/\D/g, '').slice(0, 6);
        if (d !== input.value) input.value = d;
        if (codeErr) { codeErr = ''; setFieldError(input, ''); }
      });
      setTimeout(() => input.focus({ preventScroll: true }), 300);
    },
    actions: {
      close: () => GO.router.back(),
      'change-email': () => GO.router.go(emailRoute(), { replace: true }),
      resend() {
        const input = document.getElementById('login-code');
        codeErr = '';
        if (input) { input.value = ''; setFieldError(input, ''); input.focus(); }
        u.toast('We sent a new code to ' + loginEmail);
      },
      async verify() {
        const input = document.getElementById('login-code');
        const btn = document.querySelector('[data-act=verify]');
        if (!input || btn.disabled) return;
        const d = input.value;
        codeErr = d.length < 6 ? 'Enter the 6-digit code.' : d === '000000' ? 'Wrong code. Check it or get a new one.' : '';
        if (codeErr) { setFieldError(input, codeErr); input.focus(); return; }
        busy(btn, 'Checking the code…');
        await u.sleep(700);
        const a = known(loginEmail);
        // an existing profile fills everything; a new account only knows the email, a typed name and phone stay
        const patch = a
          ? { account: { name: a.name, email: a.email }, first: a.first, last: a.last, email: a.email, cc: a.cc, phone: a.phone }
          : { account: { name: '', email: loginEmail, created: true }, email: loginEmail };
        setContact(patch);
        Object.keys(patch).forEach(k => delete errors[k]);
        loginEmail = '';
        if (fromHome()) { GO.router.back(); u.toast(a ? 'Logged in as ' + a.name : 'Your account is ready'); return; }
        GO.router.back();
        setTimeout(() => {
          const c = contact();
          const next = !a && ['first', 'last', 'phone'].map(k => !(c[k] || '').trim() && document.getElementById('f-' + k)).find(Boolean);
          if (next) { next.focus({ preventScroll: true }); next.closest('.form-field').scrollIntoView({ block: 'center' }); }
        }, 50);
      },
    },
  };

  GO.screens['login-email'] = Object.assign({}, GO.screens['details-email'], { base: 'home' });
  GO.screens['login-code'] = Object.assign({}, GO.screens['details-code'], { base: 'home' });

  // ---------- sheet: other passengers (Flow 13 - Details - 3 adults - sheet - Other passengers, 2308:18992 / 2308:128602) ----------
  // Numbered by type, the contact person is Adult 1: "Adult 2", "Child 1". Adults: name, email, phone; children: name only (our call,
  // the layout shows adults only). Save is active once every name is filled; email and phone are optional, a typed email must be valid.
  function others(s) {
    const list = [];
    for (let i = 2; i <= s.adults; i++) list.push({ id: 'a' + i, label: 'Adult ' + i, child: false });
    for (let i = 1; i <= s.children; i++) list.push({ id: 'c' + i, label: 'Child ' + i, child: true });
    return list;
  }
  const PAX_EMPTY = { first: '', last: '', email: '', cc: 'si', phone: '' };
  const named = p => !!(p && p.first.trim() && p.last.trim());
  function othersDone(s) { const saved = s.passengers || {}; return others(s).every(o => named(saved[o.id])); }

  let draft = {};
  let paxErr = {};
  function paxForm(o) {
    const p = draft[o.id], id = k => 'p-' + o.id + '-' + k;
    const err = k => paxErr[o.id + k] ? '<p id="' + id(k) + '-err" class="t-body-sm field-error">' + ic('error-circle', 16) + esc(paxErr[o.id + k]) + '</p>' : '';
    const inp = (k, label, attrs, ph) => '<label class="sr-only" for="' + id(k) + '">' + o.label + ', ' + label.toLowerCase() + '</label>' +
      '<input id="' + id(k) + '" data-pax="' + o.id + '" name="' + k + '" placeholder="' + (ph || label) + '" value="' + esc(p[k]) + '" ' + attrs +
      (paxErr[o.id + k] ? ' aria-invalid="true" aria-describedby="' + id(k) + '-err"' : '') + '>';
    const cur = country(p.cc);
    return '<fieldset class="pax-form"><legend class="t-label-lg">' + o.label + '</legend>' +
      '<div class="field field--names">' +
        inp('first', 'First name', 'autocomplete="off" autocapitalize="words" enterkeyhint="next"') + '<span class="field__divider" aria-hidden="true"></span>' +
        inp('last', 'Last name', 'autocomplete="off" autocapitalize="words" enterkeyhint="next"') +
      '</div>' +
      (o.child ? '' :
        '<div class="form-field"><div class="field' + (paxErr[o.id + 'email'] ? ' field--error' : '') + '">' +
          inp('email', 'Your email', 'type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next"') + '</div>' + err('email') + '</div>' +
        '<div class="field field--phone"><span class="phone-cc">' +
          '<span class="phone-cc__flag" data-flag="' + o.id + '">' + GO.FLAGS[cur[0]] + '</span>' + ic('chevron-down', 16) +
          '<select data-pax="' + o.id + '" name="cc" aria-label="' + o.label + ', country code">' +
            COUNTRIES.map(k => '<option value="' + k[0] + '"' + (k[0] === cur[0] ? ' selected' : '') + '>' + esc(k[1]) + ' +' + k[2] + '</option>').join('') +
          '</select></span>' +
          inp('phone', 'Mobile number', 'type="tel" inputmode="tel" autocomplete="off" enterkeyhint="next"', '041 234 567') +
        '</div>') +
    '</fieldset>';
  }
  const draftReady = s => others(s).every(o => named(draft[o.id]));

  GO.screens['details-passengers'] = {
    overlay: true, base: 'details', sheetClass: 'sheet--bottom',
    render(s) {
      const saved = s.passengers || {};
      draft = {}; paxErr = {};
      others(s).forEach(o => { draft[o.id] = Object.assign({}, PAX_EMPTY, saved[o.id]); });
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Add other passengers</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<form class="sheet__body pax-sheet" data-pax-form novalidate>' +
          '<p class="t-body-sm c-secondary">Enter the details of everyone travelling with you.</p>' +
          others(s).map(paxForm).join('') +
        '</form>' +
        '<div class="cta-bar"><button class="btn btn--primary" data-act="pax-save"' + (draftReady(s) ? '' : ' disabled') + '>Save passengers</button></div>';
    },
    mount(root) {
      const form = root.querySelector('[data-pax-form]');
      const save = root.querySelector('[data-act=pax-save]');
      form.addEventListener('input', ev => {
        const t = ev.target;
        if (!t.dataset.pax) return;
        draft[t.dataset.pax][t.name] = t.value;
        save.disabled = !draftReady(GO.store.get());
        if (t.name === 'email' && paxErr[t.dataset.pax + 'email'] && EMAIL.test(t.value.trim())) paxEmailError(t, '');
      });
      form.addEventListener('change', ev => {
        const t = ev.target;
        if (t.name !== 'cc') return;
        draft[t.dataset.pax].cc = t.value;
        root.querySelector('[data-flag="' + t.dataset.pax + '"]').innerHTML = GO.FLAGS[t.value];
      });
      form.addEventListener('focusout', ev => {
        const t = ev.target;
        if (t.name === 'email' && t.value.trim() && !EMAIL.test(t.value.trim())) paxEmailError(t, 'Check the email, it should look like name@example.com.');
      });
      form.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT') return;
        ev.preventDefault();
        const list = Array.from(form.querySelectorAll('input'));
        const next = list[list.indexOf(ev.target) + 1];
        if (next) next.focus(); else if (!save.disabled) save.click();
      });
    },
    actions: {
      close: () => GO.router.back(),
      'pax-save'() {
        const bad = Array.from(document.querySelectorAll('.pax-sheet input[name=email]')).filter(i => i.value.trim() && !EMAIL.test(i.value.trim()));
        bad.forEach(i => paxEmailError(i, 'Check the email, it should look like name@example.com.'));
        if (bad.length) { bad[0].focus(); return; }
        const s = GO.store.get();
        const passengers = {};
        others(s).forEach(o => { const p = draft[o.id]; passengers[o.id] = o.child ? { first: p.first.trim(), last: p.last.trim() } : Object.assign({}, p, { first: p.first.trim(), last: p.last.trim(), email: p.email.trim() }); });
        GO.store.set({ passengers: Object.assign({}, s.passengers, passengers) });
        GO.router.back();
        setTimeout(() => { const l = document.querySelector('[data-act=others]'); if (l) l.focus({ preventScroll: true }); }, 50);
      },
    },
  };
  function paxEmailError(t, msg) {
    const key = t.dataset.pax + 'email';
    if (msg) paxErr[key] = msg; else delete paxErr[key];
    const f = t.closest('.form-field');
    f.querySelector('.field').classList.toggle('field--error', !!msg);
    let p = f.querySelector('.field-error');
    if (!msg) { if (p) p.remove(); t.removeAttribute('aria-invalid'); t.removeAttribute('aria-describedby'); return; }
    if (!p) { p = document.createElement('p'); p.id = t.id + '-err'; p.className = 't-body-sm field-error'; f.querySelector('.field').after(p); }
    p.innerHTML = ic('error-circle', 16) + esc(msg);
    t.setAttribute('aria-invalid', 'true'); t.setAttribute('aria-describedby', p.id);
  }

  // ---------- sheet: price details (the Extras breakdown) ----------
  GO.screens['details-total'] = {
    overlay: true, base: 'details', sheetClass: 'sheet--bottom',
    render(s) {
      const L = B.legs(s);
      const T = L.length && !L.some(l => !l.o) ? B.totals(s, B.ex(), L) : { lines: [], total: 0 };
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Price details</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body">' +
          '<dl class="price-lines">' + T.lines.map(l =>
            '<div class="price-line"><dt class="t-body">' + esc(l.label) + '</dt><dd class="t-body">' + (l.value < 0 ? '−' : '') + B.money2(Math.abs(l.value)) + '</dd></div>').join('') +
            '<div class="price-line price-line--total"><dt class="t-label-lg">Total</dt><dd class="t-h3">' + B.money2(T.total) + '</dd></div>' +
          '</dl>' +
        '</div>' +
        '<div class="cta-bar"><button class="btn btn--secondary" data-act="close">Got it</button></div>';
    },
    actions: { close: () => GO.router.back() },
  };
})();
</script>
<script>
// Payment — Streamline, New flow 06.10.2026: Flow 14 (1496:79619). Kit: Form/Method tile, Content/Card fields.
// A separate step, not a sheet: room for the payment error, which keeps the card data (screens/payment.md).
// In production the card fields are the Revolut Checkout widget; here they check the format and the Luhn sum.
(function () {
  const u = GO.u;
  const { esc } = u;
  const ic = GO.icon;
  const B = GO.booking;

  // Android shows Google Pay instead of Apple Pay
  const ANDROID = /Android/i.test(navigator.userAgent);
  const WALLET = ANDROID ? { id: 'google', label: 'Google Pay', mark: () => GO.MARK_GOOGLE } : { id: 'apple', label: 'Apple Pay', mark: () => GO.MARK_APPLE };
  const METHODS = [
    { id: 'card', label: 'Card', mark: () => ic('card', 24) },
    { id: 'revolut', label: 'Revolut Pay', mark: () => GO.MARK_REVOLUT },
    WALLET,
  ];
  const DECLINED = '4000000000000002'; // test card that the fake bank turns down

  let pay = { method: 'card', number: '', exp: '', cvc: '' };
  let errors = {};
  let failed = false, busy = false;

  // ---------- card format ----------
  function digits(s) { return (s || '').replace(/\D/g, ''); }
  function brand(n) {
    if (/^4/.test(n)) return 'Visa';
    if (/^(5[1-5]|2[2-7])/.test(n)) return 'Mastercard';
    if (/^3[47]/.test(n)) return 'American Express';
    return null;
  }
  function fmtNumber(n) {
    n = n.slice(0, brand(n) === 'American Express' ? 15 : 19);
    if (brand(n) === 'American Express') return [n.slice(0, 4), n.slice(4, 10), n.slice(10)].filter(Boolean).join(' ');
    return n.replace(/(\d{4})(?=\d)/g, '$1 ');
  }
  function fmtExp(d, deleting) {
    d = d.slice(0, 4);
    if (d.length === 1 && d > '1') d = '0' + d; // "4" -> "04 / "
    if (d.length < 2) return d;
    return d.slice(0, 2) + (d.length > 2 || !deleting ? ' / ' : '') + d.slice(2);
  }
  function luhn(n) {
    let sum = 0;
    for (let i = 0; i < n.length; i++) {
      let x = +n[n.length - 1 - i];
      if (i % 2) { x *= 2; if (x > 9) x -= 9; }
      sum += x;
    }
    return sum % 10 === 0;
  }
  function check(key) {
    const n = digits(pay.number);
    if (key === 'number') {
      if (!n) return 'Enter the card number.';
      if (n.length >= 4 && !brand(n)) return 'We take Visa, Mastercard and American Express.';
      return n.length < 13 || !luhn(n) ? 'Check the card number, it isn’t complete or has a typo.' : '';
    }
    if (key === 'exp') {
      const d = digits(pay.exp);
      if (!d) return 'Enter the expiry date.';
      const m = +d.slice(0, 2), y = 2000 + +d.slice(2, 4);
      if (d.length < 4 || m < 1 || m > 12) return 'Enter the date as on the card, MM / YY.';
      const t = u.today().split('-').map(Number);
      return y < t[0] || (y === t[0] && m < t[1]) ? 'This card has expired.' : '';
    }
    if (key === 'cvc') {
      const need = brand(n) === 'American Express' ? 4 : 3;
      const d = digits(pay.cvc);
      return !d ? 'Enter the security code.' : d.length !== need ? 'Enter the ' + need + ' digits on the ' + (need === 4 ? 'front' : 'back') + ' of the card.' : '';
    }
    return '';
  }

  // ---------- pieces ----------
  function tiles() {
    return '<fieldset class="methods"><legend class="t-h3">Pay with</legend><div class="methods__row">' + METHODS.map(m =>
      '<label class="method-tile">' +
        '<input type="radio" name="method" value="' + m.id + '"' + (pay.method === m.id ? ' checked' : '') + '>' +
        '<span class="method-tile__mark">' + m.mark() + '</span><span class="t-label">' + m.label + '</span>' +
      '</label>').join('') + '</div></fieldset>';
  }

  function field(key, label, attrs, helper) {
    const err = errors[key];
    const ids = [err ? key + '-err' : '', helper ? key + '-help' : ''].filter(Boolean).join(' ');
    return '<div class="form-field">' +
      '<label class="t-label" for="p-' + key + '">' + label + '</label>' +
      '<div class="field' + (err ? ' field--error' : '') + '"><input id="p-' + key + '" name="' + key + '" value="' + esc(pay[key]) + '" ' + attrs +
        (err ? ' aria-invalid="true"' : '') + (ids ? ' aria-describedby="' + ids + '"' : '') + '></div>' +
      (err ? '<p id="' + key + '-err" class="t-body-sm field-error">' + ic('error-circle', 16) + esc(err) + '</p>' : '') +
      (helper ? '<p id="' + key + '-help" class="t-body-sm c-tertiary"' + (err ? ' hidden' : '') + '>' + helper + '</p>' : '') +
    '</div>';
  }

  function cardFields() {
    const amex = brand(digits(pay.number)) === 'American Express';
    return '<div class="card-fields">' +
      field('number', 'Card number', 'inputmode="numeric" autocomplete="cc-number" enterkeyhint="next" placeholder="1234 5678 9012 3456"', 'Visa, Mastercard, American Express') +
      '<div class="card-fields__row">' +
        field('exp', 'Expiry date', 'inputmode="numeric" autocomplete="cc-exp" enterkeyhint="next" placeholder="MM / YY"') +
        field('cvc', 'Security code', 'type="password" inputmode="numeric" autocomplete="cc-csc" enterkeyhint="done" placeholder="' + (amex ? '4 digits' : '3 digits') + '"') +
      '</div></div>';
  }

  function methodBody() {
    if (pay.method === 'card') return cardFields();
    const text = pay.method === 'revolut'
      ? 'Revolut opens after you tap Pay. Confirm the payment in the app or with your Revolut login.'
      : 'Confirm the payment with ' + (pay.method === 'apple' ? 'Face ID, Touch ID or your passcode.' : 'your screen lock or fingerprint.');
    return '<p class="t-body-sm c-secondary method-note">' + text + '</p>';
  }

  function failAlert() {
    if (!failed) return '';
    return '<div class="alert alert--error" role="alert" tabindex="-1" id="pay-failed"><span class="alert__icon">' + ic('error-circle', 24, 'icon--error') + '</span>' +
      '<span class="alert__body"><span class="alert__title">Payment didn’t go through</span>' +
      '<span class="alert__text">Your card wasn’t charged. Check the card details or choose another way to pay.</span></span></div>';
  }

  // ---------- screen ----------
  GO.screens.payment = {
    render(s) {
      const head = '<header class="page-header"><button class="icon-btn" data-act="back" aria-label="Back">' + ic('chevron-left', 24) + '</button><h1 class="t-h2">Payment</h1></header>';
      const L = B.legs(s);
      if (!L.length || L.some(l => !l.o)) {
        return head + GO.noRide(s);
      }
      const T = B.totals(s, B.ex(), L);
      return head +
        '<main class="payment">' +
          failAlert() +
          '<form class="payment__form" data-pay-form novalidate>' +
            tiles() + methodBody() +
          '</form>' +
          '<p class="pay-note t-body-sm c-secondary">' + ic('lock', 18) + '<span>Payment is processed by Revolut.<br>We don’t see or store your card details.</span></p>' +
          '<p class="pay-note t-body-sm c-secondary">' + ic('shield-lock', 18) + '<span>By paying, you accept the GoOpti <button class="link link--inline" data-act="terms">Terms and Conditions</button> and <button class="link link--inline" data-act="terms">Privacy Policy</button>.</span></p>' +
          '<button class="btn btn--primary" data-act="pay"' + (busy ? ' aria-busy="true" disabled' : '') + '>' + (busy ? '<span class="sr-only">Paying…</span>' : '') + '<span class="btn__label">Pay ' + B.money2(T.total) + '</span></button>' +
        '</main>';
    },
    mount(root) {
      const form = root.querySelector('[data-pay-form]');
      if (!form) return;
      form.addEventListener('change', ev => {
        if (ev.target.name !== 'method') return;
        pay.method = ev.target.value; errors = {};
        GO.router.refresh();
        document.querySelector('input[name=method][value=' + pay.method + ']').focus({ preventScroll: true });
      });
      form.addEventListener('input', ev => {
        const t = ev.target, key = t.name;
        if (!['number', 'exp', 'cvc'].includes(key)) return;
        const deleting = ev.inputType && ev.inputType.startsWith('delete');
        // reformat and keep the caret after the same number of digits
        let before = digits(t.value.slice(0, t.selectionStart)).length;
        if (key === 'exp' && digits(t.value).length === 1 && digits(t.value) > '1') before = 2; // "8" became "08 / "
        let v = key === 'number' ? fmtNumber(digits(t.value)) : key === 'exp' ? fmtExp(digits(t.value), deleting) : digits(t.value).slice(0, 4);
        t.value = v;
        let pos = 0, seen = 0;
        while (pos < v.length && seen < before) { if (/\d/.test(v[pos])) seen++; pos++; }
        if (key === 'exp' && !deleting && pos === 2 && v.length > 2) pos = v.length;
        try { t.setSelectionRange(pos, pos); } catch (e) {}
        pay[key] = v;
        if (key === 'number') failed = false;
        if (errors[key] && !check(key)) showError(key, '');
        // a full card number moves on to the expiry date
        const n = digits(pay.number);
        if (key === 'number' && !deleting && n.length === (brand(n) === 'American Express' ? 15 : 16) && luhn(n)) document.getElementById('p-exp').focus();
        if (key === 'exp' && !deleting && digits(v).length === 4) document.getElementById('p-cvc').focus();
      });
      form.addEventListener('focusout', ev => {
        const key = ev.target.name;
        if (!['number', 'exp', 'cvc'].includes(key) || !pay[key]) return;
        showError(key, check(key));
      });
      form.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT' || ev.target.type === 'radio') return;
        ev.preventDefault();
        const next = { number: 'p-exp', exp: 'p-cvc' }[ev.target.name];
        if (next) document.getElementById(next).focus(); else GO.screens.payment.actions.pay();
      });
      if (failed) { const a = root.querySelector('#pay-failed'); if (a) a.focus({ preventScroll: true }); }
    },
    actions: {
      back: () => GO.router.back(),
      'to-offers': () => GO.router.go('/offers', { replace: true }),
      'see-booking': () => GO.router.go('/booked', { replace: true }),
      'new-ride': () => GO.router.go('/', { replace: true }),
      terms: () => u.toast('Terms open in a new tab on the real site'),
      async pay() {
        if (busy) return;
        if (pay.method === 'card') {
          ['number', 'exp', 'cvc'].forEach(k => showError(k, check(k)));
          const first = ['number', 'exp', 'cvc'].find(k => errors[k]);
          if (first) { const el = document.getElementById('p-' + first); el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
        }
        busy = true; failed = false; GO.router.refresh();
        await u.sleep(pay.method === 'card' ? 1400 : 1800);
        busy = false;
        if (pay.method === 'card' && digits(pay.number) === DECLINED) {
          failed = true; GO.router.refresh(); window.scrollTo(0, 0);
          const a = document.getElementById('pay-failed'); if (a) a.focus({ preventScroll: true });
          return;
        }
        book();
      },
    },
  };

  function showError(key, msg) {
    if (msg) errors[key] = msg; else delete errors[key];
    const t = document.getElementById('p-' + key);
    if (!t) return;
    const f = t.closest('.form-field');
    f.querySelector('.field').classList.toggle('field--error', !!msg);
    let p = f.querySelector('.field-error');
    const help = f.querySelector('#' + key + '-help');
    if (!msg) { if (p) p.remove(); t.removeAttribute('aria-invalid'); }
    else {
      if (!p) { p = document.createElement('p'); p.id = key + '-err'; p.className = 't-body-sm field-error'; f.querySelector('.field').after(p); }
      p.innerHTML = ic('error-circle', 16) + esc(msg);
      t.setAttribute('aria-invalid', 'true');
    }
    if (help) help.hidden = !!msg; // the error replaces the helper (Form/Input)
    const ids = [msg ? key + '-err' : '', help && !msg ? help.id : ''].filter(Boolean).join(' ');
    if (ids) t.setAttribute('aria-describedby', ids); else t.removeAttribute('aria-describedby');
  }

  // ---------- booked: a snapshot for Confirmation, then the trip is cleared ----------
  function book() {
    const s = GO.store.get();
    const e = B.ex();
    const L = B.legs(s);
    const T = B.totals(s, e, L);
    const c = Object.assign({ cc: 'si', phone: '', email: '' }, s.contact);
    const cc = GO.COUNTRY_CODES ? GO.COUNTRY_CODES[c.cc] : '386';
    const n = digits(pay.number);
    const items = [L.length + (L.length > 1 ? ' transfers' : ' transfer')];
    if (GO.store.get().refund) items.push('100% Money refund');
    if (e.nw) items.push('No Worries package');
    const LUG_SHORT = { trolley: 'trolley', s20: '20 kg suitcase', s32: '32 kg suitcase', special: 'special item' };
    GO.api.LUGGAGE.forEach(i => { const k = e.lug[i.id]; if (k) items.push(k + ' ' + LUG_SHORT[i.id] + (k > 1 ? 's' : '')); });
    if (e.voucher) items.push('promo code ' + e.voucher.code);
    const booked = {
      ref: 'GO-' + String(400000 + Math.floor(Math.random() * 99999)),
      email: c.email.trim(),
      phone: '+' + cc + ' ' + digits(c.phone).replace(/^0+/, '').replace(/(\d{2})(\d{3})(\d+)/, '$1 $2 $3'),
      pax: B.paxLabel(s),
      paidWith: pay.method === 'card' ? brand(n) + ' •••• ' + n.slice(-4) : pay.method === 'revolut' ? 'Revolut Pay' : WALLET.label,
      items: items.join(', '),
      lines: T.lines.map(l => ({ label: l.label, value: l.value })),
      total: T.total,
      legs: L.map(l => ({
        leg: l.leg, date: l.q.date, from: l.q.from, to: l.q.to,
        kind: l.o.kind, window: l.o.window || 0, pickFrom: l.o.pickFrom, pickTo: l.o.pickTo, arrival: l.o.arrival, dur: l.o.dur, total: l.o.total,
      })),
    };
    pay = { method: 'card', number: '', exp: '', cvc: '' }; errors = {};
    // the trip is done: the next search starts clean, contact details stay for the next booking
    const contact = s.contact;
    GO.store.reset();
    GO.store.set({ booked, contact, bookedFresh: true });
    GO.router.go('/booked', { replace: true });
  }
})();
</script>
<script>
// Confirmation — Streamline, New flow 06.10.2026: Flow 15 (1493:40822). Rendered from the snapshot saved at payment
// (state.booked), so it survives a reload and a new search. No back button and no "Done": the logo leads home.
(function () {
  const u = GO.u;
  const { esc, fmtDay, fromMin, fmtDur, addDays } = u;
  const ic = GO.icon;
  const api = GO.api;

  function money(n) { return (Number.isInteger(n) ? n : n.toFixed(2)) + ' €'; }
  function rideTitle(l) {
    if (l.kind === 'private') return 'Private transfer, no other passengers';
    return l.kind === 'flex' ? 'Shared transfer, ' + fmtDur(l.window) + ' window' : 'Shared transfer, exact pick-up time';
  }
  const pick = l => l.kind === 'flex' ? fromMin(l.pickFrom) + '–' + fromMin(l.pickTo) : fromMin(l.pickFrom);
  // pick-up and drop-off can fall on the next day after midnight
  const dayOf = (l, min) => min >= 1440 ? addDays(l.date, 1) : min < 0 ? addDays(l.date, -1) : l.date;
  // to the airport and back home the time is the latest drop-off (Flow 15 round trip 1504:4675)
  const toLabel = l => l.to.type === 'airport' ? 'At the airport by' : 'Latest drop-off';

  function tripCard(b, l, round) {
    return '<article class="trip-card" aria-label="' + (round ? (l.leg === 'out' ? 'Departure' : 'Return') : 'Your ride') + '">' +
      '<div class="trip-card__head">' +
        // round trip: "Departure, Thu 15 Oct" in one line, as in 1504:4675
        '<h3 class="t-label-lg">' + (round ? (l.leg === 'out' ? 'Departure, ' : 'Return, ') : '') + fmtDay(dayOf(l, l.pickFrom)) + '</h3>' +
        '<p class="t-body-sm c-secondary">' + esc(rideTitle(l)) + '</p>' +
      '</div>' +
      '<ol class="trip-route">' +
        '<li class="trip-route__stop">' +
          '<span class="trip-route__rail">' + ic('map-pin', 20, 'icon--brand') + '<span class="trip-route__line"></span></span>' +
          '<div class="trip-route__text"><span class="t-caption c-tertiary">' + (l.kind === 'flex' ? 'Pick-up window' : 'Pick-up') + '</span>' +
            '<span class="t-h2">' + pick(l) + '</span><span class="t-body-sm c-secondary">' + esc(l.from.name) + '</span></div></li>' +
        '<li class="trip-route__stop">' +
          '<span class="trip-route__rail"><span class="trip-route__line trip-route__line--dashed"></span></span>' +
          '<div class="trip-route__text"><span class="t-caption c-tertiary">On the way</span>' +
            '<span class="t-body-sm c-secondary">' + fmtDur(l.dur) + (l.kind === 'private' ? ', straight there' : ', a few short stops') + '</span></div></li>' +
        '<li class="trip-route__stop">' +
          '<span class="trip-route__rail">' + ic('check-circle', 20, 'icon--brand') + '</span>' +
          '<div class="trip-route__text"><span class="t-caption c-tertiary">' + toLabel(l) + '</span>' +
            '<span class="t-h2">' + fromMin(l.arrival) + '</span><span class="t-body-sm c-secondary">' + esc(l.to.name) + '</span></div></li>' +
      '</ol>' +
      '<div class="trip-card__foot">' + ic('user', 16, 'icon--muted') + '<span class="t-body-sm c-secondary">' + esc(b.pax) + '</span>' +
        '<span class="t-label">' + money(l.total) + '</span></div>' +
    '</article>';
  }

  // What happens next — for the first ride; a round trip repeats the same steps before the return
  function timeline(b) {
    const l = b.legs[0];
    const day = fmtDay(dayOf(l, l.pickFrom));
    const steps = [
      { icon: 'check-circle', cls: 'icon--success', when: 'Now', title: 'Ticket and receipt sent', text: 'To ' + b.email + '. Not there? Check your spam folder.' },
    ];
    if (l.kind === 'flex') {
      steps.push({ icon: 'clock', when: fmtDay(addDays(dayOf(l, l.pickFrom), -1)) + ', the day before', title: 'Your exact pick-up time',
        text: 'By SMS to ' + b.phone + ' and by email. It will be between ' + fromMin(l.pickFrom) + ' and ' + fromMin(l.pickTo) + '.' });
    }
    steps.push({ icon: 'user', when: day + ', 1h before pick-up', title: 'Your driver’s phone number', text: 'By SMS and email, with an emergency contact.' });
    steps.push({ icon: 'map-pin', when: day + ', ' + pick(l), title: 'Pick-up at ' + l.from.name,
      text: l.kind === 'private' ? 'Your driver waits for you at the pick-up point.' : 'Be ready outside at your exact time. The ride may stop briefly for other travellers.' });
    steps.push({ icon: l.kind === 'private' ? 'car' : 'shuttle', when: fmtDur(l.dur) + ' ride time', title: 'Sit back and relax on the way' });
    steps.push({ icon: l.to.type === 'airport' ? 'plane' : 'map-pin', when: fmtDay(dayOf(l, l.arrival)) + ', by ' + fromMin(l.arrival), title: 'At ' + l.to.name });
    const r = b.legs[1];
    if (r) steps.push({ icon: r.from.type === 'airport' ? 'plane' : 'map-pin', when: fmtDay(dayOf(r, r.pickFrom)) + ', ' + pick(r), title: 'Return pick-up at ' + r.from.name });
    return '<ol class="timeline">' + steps.map((st, i) =>
      '<li class="timeline__step">' +
        '<span class="timeline__rail">' + ic(st.icon, 20, st.cls) + (i < steps.length - 1 ? '<span class="timeline__line"></span>' : '') + '</span>' +
        '<div class="timeline__text"><span class="t-caption c-tertiary">' + esc(st.when) + '</span><span class="t-label-lg">' + esc(st.title) + '</span>' +
        (st.text ? '<span class="t-body-sm c-secondary">' + esc(st.text) + '</span>' : '') + '</div>' +
      '</li>').join('') + '</ol>';
  }

  function linkRow(act, icon, title, text) {
    return '<li><button class="link-row" data-act="' + act + '">' +
      (icon ? '<span class="link-row__icon">' + ic(icon, 20) + '</span>' : '') +
      '<span class="link-row__text"><span class="t-body">' + title + '</span><span class="t-caption c-tertiary link-row__sub">' + text + '</span></span>' +
      ic('chevron-right', 20, 'icon--muted') + '</button></li>';
  }

  GO.screens.booked = {
    render(s) {
      const top = '<header class="topbar topbar--light"><a class="topbar__logo" href="#/" data-act="home" aria-label="GoOpti, book another ride">' + GO.LOGO + '</a>' +
        '<button class="icon-btn" data-act="account" aria-label="Your account">' + ic('user', 24) + '</button></header>';
      const b = s.booked;
      if (!b) return top + '<main class="stub"><p class="t-body c-secondary">No booking yet.</p><button class="btn btn--primary" data-act="home">Find your ride</button></main>';
      const round = b.legs.length > 1;
      return top +
        '<main class="booked">' +
          '<section class="booked__hero" aria-labelledby="booked-title">' +
            '<span class="booked__art"><img src="' + GO.IMG_VAN + '" alt="" width="124" height="95"><span class="booked__tick">' + ic('check', 16) + '</span></span>' +
            '<h1 id="booked-title" class="t-h1" tabindex="-1">You’re booked</h1>' +
            '<p class="t-body c-secondary">Your ticket is on its way to <b class="c-primary">' + esc(b.email) + '</b>.</p>' +
            '<p class="booked__ref"><span class="t-body-sm c-secondary">Booking</span><span class="t-label-lg c-brand">' + esc(b.ref) + '</span></p>' +
          '</section>' +
          '<section class="booked__block" aria-labelledby="trip-title"><h2 id="trip-title" class="t-h3">Your trip</h2>' +
            b.legs.map(l => tripCard(b, l, round)).join('') + '</section>' +
          '<section class="booked__block" aria-labelledby="next-title"><h2 id="next-title" class="t-h3">What happens next</h2>' + timeline(b) + '</section>' +
          '<section class="booked__block" aria-labelledby="pay-title"><h2 id="pay-title" class="t-h3">Payment</h2>' +
            '<ul class="link-rows"><li><button class="link-row" data-act="receipt">' +
              '<span class="link-row__text"><span class="t-body">Paid with ' + esc(b.paidWith) + '</span><span class="t-caption c-tertiary link-row__sub">' + esc(b.items) + '</span></span>' +
              '<span class="t-label nowrap">' + b.total.toFixed(2) + ' €</span>' + ic('chevron-right', 20, 'icon--muted') + '</button></li></ul></section>' +
          '<section class="booked__block" aria-labelledby="manage-title"><h2 id="manage-title" class="t-h3">Manage your booking</h2>' +
            '<ul class="link-rows">' +
              linkRow('manage', 'edit', 'Change or cancel', 'In myOpti. Cancelling gives you a discount code for a new booking.') +
              linkRow('manage', 'plus', 'Add luggage or a child seat', 'In myOpti, up to 2 days before travel') +
              linkRow('share', 'share', 'Share trip details', 'Send the pick-up time and address to whoever travels with you') +
              linkRow('calendar', 'calendar', 'Add to calendar', (b.legs[0].kind === 'flex' ? 'Pick-up window' : 'Pick-up time') + ' and ' + (b.legs[0].to.type === 'airport' ? 'airport time' : 'drop-off time')) +
            '</ul></section>' +
          '<section class="ex-card booked__account" aria-labelledby="acc-title">' +
            '<h2 id="acc-title" class="t-label-lg">Keep this booking in your account<br>&amp; save time next ride</h2>' +
            '<p class="t-body-sm c-secondary">Set a password to see your pick-up time and manage the booking in myOpti. Your details are already filled in.</p>' +
            '<button class="btn btn--primary" data-act="password">Set a password</button>' +
          '</section>' +
          '<p class="t-body-sm c-secondary booked__help">Questions? <button class="link link--inline" data-act="chat">Chat with us</button> or call <a class="link link--inline" href="tel:+38618889371">+386 1 888 93 71</a>.</p>' +
        '</main>';
    },
    mount(root) {
      // announce the result: focus moves to the heading once, right after payment
      const h = root.querySelector('#booked-title');
      if (h && GO.store.get().bookedFresh) { h.focus({ preventScroll: true }); GO.store.set({ bookedFresh: false }); }
    },
    actions: {
      home: () => GO.router.go('/', { replace: true }),
      account: () => u.toast('myOpti comes in a later build'),
      manage: () => u.toast('myOpti comes in a later build'),
      password: () => u.toast('Account setup comes in a later build'),
      chat: () => u.toast('Chat opens on the real site'),
      receipt: () => GO.router.go('/booked/receipt'),
      async share() {
        const b = GO.store.get().booked, l = b.legs[0];
        const text = 'GoOpti ' + b.ref + ': ' + fmtDay(dayOf(l, l.pickFrom)) + ', pick-up ' + pick(l) + ' at ' + l.from.name + ', to ' + l.to.name + ' by ' + fromMin(l.arrival) + '.';
        if (navigator.share) { try { await navigator.share({ title: 'GoOpti ' + b.ref, text }); } catch (e) {} return; }
        try { await navigator.clipboard.writeText(text); u.toast('Trip details copied'); } catch (e) { u.toast(text); }
      },
      calendar() { download(ics(GO.store.get().booked)); u.toast('Calendar file saved'); },
    },
  };

  // ---------- Add to calendar: a real .ics, one event per ride (from the start of the window to the drop-off) ----------
  function ics(b) {
    const stamp = (iso, min) => {
      const d = u.parseIso(iso); d.setMinutes(min);
      return d.getFullYear() + u.pad(d.getMonth() + 1) + u.pad(d.getDate()) + 'T' + u.pad(d.getHours()) + u.pad(d.getMinutes()) + '00';
    };
    const ev = b.legs.map((l, i) => [
      'BEGIN:VEVENT', 'UID:' + b.ref + '-' + i + '@goopti.com', 'DTSTAMP:' + stamp(u.today(), 0),
      'DTSTART;TZID=Europe/Ljubljana:' + stamp(l.date, l.pickFrom), 'DTEND;TZID=Europe/Ljubljana:' + stamp(l.date, l.arrival),
      'SUMMARY:GoOpti to ' + l.to.name, 'LOCATION:' + l.from.name.replace(/,/g, '\\,'),
      'DESCRIPTION:Booking ' + b.ref + '\\n' + (l.kind === 'flex' ? 'Pick-up between ' + fromMin(l.pickFrom) + ' and ' + fromMin(l.pickTo) + '. Exact time by SMS the day before.' : 'Pick-up at ' + fromMin(l.pickFrom) + '.'),
      'END:VEVENT'].join('\r\n'));
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//GoOpti//Booking prototype//EN'].concat(ev, 'END:VCALENDAR').join('\r\n');
  }
  function download(text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/calendar' }));
    a.download = 'goopti-booking.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---------- sheet: receipt ----------
  GO.screens['booked-receipt'] = {
    overlay: true, base: 'booked', sheetClass: 'sheet--bottom',
    render(s) {
      const b = s.booked;
      if (!b) return '<div class="sheet__body"><p class="t-body">No booking yet.</p></div>';
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Receipt</h2><p class="t-body-sm c-secondary">Booking ' + esc(b.ref) + '</p></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body sheet__body--gap16">' +
          '<dl class="price-lines">' + b.lines.map(l =>
            '<div class="price-line"><dt class="t-body">' + esc(l.label) + '</dt><dd class="t-body">' + (l.value < 0 ? '−' : '') + Math.abs(l.value).toFixed(2) + ' €</dd></div>').join('') +
            '<div class="price-line price-line--total"><dt class="t-label-lg">Total paid</dt><dd class="t-h3">€' + b.total.toFixed(2) + '</dd></div>' +
          '</dl>' +
          '<p class="t-caption c-tertiary">Paid with ' + esc(b.paidWith) + '. The receipt and invoice are in your email.</p>' +
        '</div>' +
        '<div class="cta-bar"><button class="btn btn--secondary" data-act="close">Got it</button></div>';
    },
    actions: { close: () => GO.router.back() },
  };
})();
</script>
<script>
// Boot. ?debug shows a small panel for testers: reset, demo data, pinned "today".
(function () {
  const params = new URLSearchParams(location.search);
  if (params.has('reset')) {
    GO.store.reset();
    params.delete('reset'); // a reload must not wipe the state again
    history.replaceState(history.state, '', location.pathname + (params.toString() ? '?' + params : '') + location.hash);
  }

  if (GO.frame === 'outer') return; // the app runs inside the phone frame

  // Offers-only export: a demo search, navigation kept to offers, their sheets and Edit search
  (function () {
    const st = GO.store.get();
    if (!st.from || !st.to || !st.date || !st.time) {
      GO.store.set({ from: GO.api.place('lj-slovenska'), to: GO.api.place('VCE'), date: GO.u.addDays(GO.api.bookingWindow().min, 7), time: '10:15', timeMode: 'dropoff', adults: 1, children: 0 });
    }
    const ok = p => p.startsWith('/offers') || p.startsWith('/edit');
    const cur = () => (location.hash.replace(/^#/, '') || '/').split('?')[0];
    if (!ok(cur())) history.replaceState({ depth: 0 }, '', '#/offers');
    const go = GO.router.go, back = GO.router.back;
    GO.router.go = function (p, o) {
      if (!ok(p.split('?')[0])) { if (GO.u.toast) GO.u.toast('This preview shows the offers only'); return; }
      return go.call(this, p, o);
    };
    GO.router.back = function () {
      if (((history.state && history.state.depth) || 0) > 0) return back.call(this);
      return go.call(this, '/offers', { replace: true });
    };
    window.addEventListener('popstate', () => { if (!ok(cur())) go('/offers', { replace: true }); });
  })();

  GO.router.start();

  let debug = params.has('debug');
  try { if (debug) sessionStorage.setItem('go.debug', '1'); debug = debug || sessionStorage.getItem('go.debug') === '1'; } catch (e) {}
  if (!debug) return;

  const fab = document.createElement('button');
  fab.className = 'debug-fab'; fab.setAttribute('aria-label', 'Prototype settings'); fab.textContent = '⚙';
  document.body.appendChild(fab);
  let panel = null;
  fab.addEventListener('click', () => {
    if (panel) { panel.remove(); panel = null; return; }
    panel = document.createElement('div');
    panel.className = 'debug-panel';
    panel.innerHTML =
      '<div class="t-label">Prototype</div>' +
      '<div class="t-caption c-tertiary">Today: ' + GO.u.today() + ' (pin with ?today=YYYY-MM-DD)</div>' +
      '<button class="btn btn--secondary" data-dbg="demo">Fill: Ljubljana → Venice, 1 adult</button>' +
      '<button class="btn btn--secondary" data-dbg="demo-rt">Fill: round trip, back on day 10, lands 14:05</button>' +
      '<button class="btn btn--secondary" data-dbg="reset">Start over</button>' +
      '<div class="t-caption c-tertiary">Test cards: 4242 4242 4242 4242 pays, 4000 0000 0000 0002 is declined</div>' +
      '<div class="t-caption c-tertiary">Email login: maja.novak@gmail.com has an account, any other email signs up; any 6-digit code works, 000000 is wrong</div>' +
      '<div class="t-label">Offers</div>' +
      '<div class="debug-panel__row">' +
        ['', 'normal', 'soldout', 'empty'].map(v => '<button class="btn btn--secondary" data-dbg="offers" data-v="' + v + '" aria-pressed="' + (GO.store.get().offersScenario === v) + '">' + (v || 'by date') + '</button>').join('') +
      '</div>';
    panel.addEventListener('click', ev => {
      const b = ev.target.closest('[data-dbg]');
      if (!b) return;
      if (b.dataset.dbg === 'offers') {
        GO.store.set({ offersScenario: b.dataset.v });
        panel.remove(); panel = null;
        return GO.router.refresh(); // the screen's mount fetches offers for the new scenario
      }
      if (b.dataset.dbg === 'reset') GO.store.reset();
      if (b.dataset.dbg === 'demo' || b.dataset.dbg === 'demo-rt') {
        const min = GO.api.bookingWindow().min;
        const date = GO.u.addDays(min, 7);
        const rt = b.dataset.dbg === 'demo-rt';
        GO.store.set({ from: GO.api.place('lj-slovenska'), to: GO.api.place('VCE'), date, time: '10:15', timeMode: 'dropoff', adults: 1, children: 0,
          retDate: rt ? GO.u.addDays(date, 10) : null, retTime: rt ? '14:05' : null, retLanding: rt });
      }
      panel.remove(); panel = null;
      GO.router.go('/', { replace: true });
    });
    document.body.appendChild(panel);
  });
})();
</script>


</body></html>
