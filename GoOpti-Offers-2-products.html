  GO.screens['about-private'] = {
    overlay: true, base: sheetBase, sheetClass: 'sheet--bottom',
    render() {
      const c = sheetCtx();
      const p = c.data && c.data.priv;
      const extra = p && p.length > 1 ? p[1].unit - p[0].unit : 24;
      return sheetHead('Private transfer') +
        '<div class="sheet__body sheet__body--gap16">' +
          '<p class="t-body c-secondary">Direct, door to door, just for your group. No other passengers join.</p>' +
          '<ul class="check-list">' +
            checkItem('check-circle', 'Meet and greet included') +
            checkItem('check-circle', 'A tried and trusted driver takes you right to your address') +
            checkItem('check-circle', 'Exact pick-up time and driver details by SMS, email and app the day before') +
            checkItem('check-circle', 'Free cancellation within 24h of booking') +
          '</ul>' +
          '<div class="note-box"><span class="t-label">Private refundable, +' + money(extra) + '</span>' +
          '<span class="t-caption c-secondary">Free cancellation and full refund up to 48 hours before the transfer.</span></div>' +
        '</div>' + sheetFoot('Got it');
    },
    actions: closeAct,
  };

  function offerDetails(q, o) {
    const to = placeLabel(q.to);
    const arrive = q.to.type === 'airport' ? 'Latest drop-off at ' + esc(to) + ' at ' + fromMin(o.arrival) + (o.kind === 'private' ? '.' : ', guaranteed.') : 'Arrival in ' + esc(to) + ' by ' + fromMin(o.arrival) + '.';
    const cancel = o.refundable ? 'Free cancellation and full refund up to 48 hours before the transfer' : 'Free cancellation within 24h of booking';
    const first = q.landing
      ? ['flight-land', o.kind === 'flex'
          ? 'Pick-up between ' + fromMin(o.pickFrom) + ' and ' + fromMin(o.pickTo) + ' after your flight lands. Flight late? We wait for you.'
          : 'Pick-up at ' + fromMin(o.pickFrom) + ' after your flight lands. Flight late? We wait for you.']
      : ['clock', o.kind === 'flex'
          ? 'Pick-up between ' + fromMin(o.pickFrom) + ' and ' + fromMin(o.pickTo) + '. Exact time by SMS, email and app the day before.'
          : 'Pick-up at ' + fromMin(o.pickFrom) + '. Driver details by SMS, email and app the day before.'];
    const items = o.kind === 'private'
      ? [['car', 'Direct, door to door, just for your group. No other passengers join.'],
         first,
         ['plane', arrive],
         ['map-pin', 'Meet and greet: a tried and trusted driver takes you right to your address.']]
      : [first,
         ['shuttle', 'You may share the ride with other passengers, with a few short stops on the way.'],
         ['map-pin', q.landing ? 'A tried and trusted driver takes you to your address.' : 'A tried and trusted driver picks you up at your address.'],
         ['plane', arrive]];
    items.push(['check-circle', cancel]);
    return '<ul class="check-list">' + items.map(i => checkItem(i[0], i[1])).join('') + '</ul>';
  }

  GO.screens['about-offer'] = {
    overlay: true, base: sheetBase, sheetClass: 'sheet--bottom',
    render() {
      const c = sheetCtx();
      const o = c.data && api.findOffer(c.q, c.s.infoOfferId);
      if (!o) return sheetHead('Ride details') + '<div class="sheet__body"><p class="t-body c-secondary">This ride is no longer available.</p></div>' + sheetFoot('Close');
      const isSel = c.sel.id === o.id;
      return sheetHead(offerTitle(o), routeLabel(c.q) + ', ' + fmtDay(c.q.date)) +
        '<div class="sheet__body sheet__body--gap16">' +
          '<div class="times-block">' +
            '<div class="times-block__row t-caption c-secondary"><span>' + (o.kind === 'flex' ? 'Pick-up time' : 'Pick-up') + '</span><span>' + (c.data.dropBy || c.round ? 'Latest drop-off' : 'Arrival') + '</span></div>' +
            '<div class="times-block__row times-block__row--times"><span class="t-h3 nowrap">' + pickLabel(o) + '</span><span class="t-caption c-secondary">' + fmtDur(rideDur(o)) + '</span><span class="t-h3">' + fromMin(o.arrival) + '</span></div>' +
            '<div class="times-block__row times-block__row--price">' + (badge(o, true) || '<span></span>') + '<span class="t-h2">' + money(o.total) + '</span></div>' +
          '</div>' +
          offerDetails(c.q, o) +
        '</div>' + sheetFoot(isSel ? 'Got it' : 'Choose this ride', isSel ? 'close' : 'choose');
    },
    actions: {
      close: () => GO.router.back(),
      choose() {
        const c = sheetCtx();
        const o = api.findOffer(c.q, c.s.infoOfferId);
        const f = c.sel.filter;
        const visible = f === 'all' || (f === 'private') === (o.kind === 'private');
        setSel(c.leg, { id: o.id, filter: visible ? f : 'all' });
        GO.router.back();
      },
    },
  };

  // ---------- sheet: Add your house number (2320:29071) ----------
  // The street with the number shows live in the chip; the place keeps its id, so the offers stay as they are.
  function withNumber(p, num) {
    return p.street + ' ' + num + (p.city ? ', ' + p.city : '');
  }
  function mapPlaceholder() {
    // streets as in the layout: Figma x, y, w, h, rotation (Figma turns counter-clockwise)
    const rect = (cls, r) => '<span class="' + cls + '" style="left:' + r[0] + 'px;top:' + r[1] + 'px;width:' + r[2] + 'px;height:' + r[3] + 'px;transform:rotate(' + (-r[4]) + 'deg)"></span>';
    return '<div class="house-map" aria-hidden="true">' +
      rect('house-map__park', [200, 110, 120, 80, 8]) +
      [[-20, 84, 420, 14, -12], [60, -20, 12, 260, -18], [230, -20, 10, 260, 10], [-20, 30, 420, 8, 6], [-20, 160, 420, 8, -4], [150, -20, 8, 260, -30]]
        .map(r => rect('house-map__street', r)).join('') +
      '<span class="house-map__pin">' + ic('map-pin', 40, 'icon--brand') + '</span>' +
    '</div>';
  }
  function showHouseErr(root, msg) {
    const input = root.querySelector('#f-house');
    input.closest('.field').classList.toggle('field--error', !!msg);
    root.querySelector('#house-err-slot').innerHTML = msg ? '<p id="house-err" class="t-body-sm field-error">' + ic('error-circle', 16) + esc(msg) + '</p>' : '';
    if (msg) { input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', 'house-err'); }
    else { input.removeAttribute('aria-invalid'); input.removeAttribute('aria-describedby'); }
  }

  GO.screens['offers-house'] = {
    overlay: true, base: sheetBase, sheetClass: 'sheet--bottom',
    render() {
      const side = houseSide(sheetCtx().q);
      if (!side) return sheetHead('Add your house number') + '<div class="sheet__body"><p class="t-body c-secondary">The address already has a house number.</p></div>' + sheetFoot('Close');
      return sheetHead('Add your house number') +
        '<div class="sheet__body sheet__body--gap16">' +
          '<p class="t-body c-secondary">So we can ' + (side.pickup ? 'pick you up' : 'drop you off') + ' at the right address. Your ride stays selected.</p>' +
          '<div class="house-row">' +
            '<div class="house-row__street">' +
              '<span class="t-label">' + (side.pickup ? 'Pick-up address' : 'Drop-off address') + '</span>' +
              '<span class="chip house-row__chip"><span class="t-body ellipsis" id="house-addr">' + esc(side.place.name) + '</span></span>' +
            '</div>' +
            '<div class="house-row__number">' +
              '<label class="t-label" for="f-house">House number</label>' +
              '<div class="field"><input id="f-house" name="house" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" enterkeyhint="done"></div>' +
            '</div>' +
          '</div>' +
          '<div id="house-err-slot" class="house-err"></div>' +
          mapPlaceholder() +
        '</div>' + sheetFoot('Save and continue', 'save');
    },
    mount(root) {
      const input = root.querySelector('#f-house');
      if (!input) return;
      const side = houseSide(sheetCtx().q);
      input.focus();
      input.addEventListener('input', () => {
        const v = input.value.trim();
        root.querySelector('#house-addr').textContent = v ? withNumber(side.place, v) : side.place.name;
        if (v && input.hasAttribute('aria-invalid')) showHouseErr(root, '');
      });
      input.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); GO.screens['offers-house'].actions.save(); } });
    },
    actions: {
      close: () => GO.router.back(),
      save() {
        const input = document.getElementById('f-house');
        const side = houseSide(sheetCtx().q);
        if (!input || !side) return GO.router.back();
        const root = input.closest('.sheet__body');
        const v = input.value.trim();
        if (!v) { showHouseErr(root, 'Enter your house number.'); input.focus(); return; }
        const p = Object.assign({}, side.place, { name: withNumber(side.place, v), noNumber: false });
        const s = GO.store.get();
        const patch = {};
        if (s.from && s.from.id === p.id) patch.from = p;
        if (s.to && s.to.id === p.id) patch.to = p;
        GO.store.set(patch);
        if (s.houseNext === 'continue') GO.router.go('/extras', { replace: true });
        else if (s.houseNext === 'to-return') GO.router.go('/offers/return', { replace: true });
        else GO.router.back();
      },
    },
  };

  GO.screens['offers-total'] = {
    overlay: true, base: sheetBase, sheetClass: 'sheet--bottom',
    render() {
      const c = sheetCtx();
      const legs = c.round ? ['out', 'ret'] : ['out'];
      const lines = legs.map(l => ({ l, q: api.legSearch(c.s, l), o: pickedOf(l) })).filter(x => x.o);
      if (!lines.length) return sheetHead('Price details') + '<div class="sheet__body"><p class="t-body c-secondary">Choose a ride first.</p></div>' + sheetFoot('Close');
      const fee = c.data ? c.data.fee : 2.4;
      const rides = lines.reduce((a, x) => a + x.o.total, 0);
      const refund = GO.store.get().refund ? Math.round(rides * 15) / 100 : 0;
      const sum = rides + refund + fee;
      const line = x => {
        const qty = x.o.kind === 'private' ? '1 vehicle' : paxLabel(c.s) + (x.o.pax > 1 ? ' × ' + money(x.o.unit) : '');
        const head = c.round ? (x.l === 'out' ? 'Departure' : 'Return') + ', ' + fmtDay(x.q.date) : '';
        return '<div class="price-line"><dt>' + (head ? '<span class="t-label">' + head + '</span>' : '') + '<span class="t-body">' + shortTitle(x.o) + '</span><span class="t-caption c-tertiary">' + esc(qty) + '</span></dt><dd class="t-body">' + money2(x.o.total) + '</dd></div>';
      };
      return sheetHead('Price details', c.round ? routeLabel(api.legSearch(c.s, 'out')) + ' and back' : routeLabel(c.q) + ', ' + fmtDay(c.q.date)) +
        '<div class="sheet__body sheet__body--gap16">' +
          '<dl class="price-lines">' + lines.map(line).join('') +
            (refund ? '<div class="price-line"><dt><span class="t-body">100% Money refund</span></dt><dd class="t-body">' + money2(refund) + '</dd></div>' : '') +
            '<div class="price-line"><dt class="t-body">Booking fee</dt><dd class="t-body">' + money2(fee) + '</dd></div>' +
            '<div class="price-line price-line--total"><dt class="t-label-lg">Total</dt><dd class="t-h3">' + money2(sum) + '</dd></div>' +
          '</dl>' +
          (c.round && lines.length < 2 ? '<p class="t-caption c-tertiary">The ' + (lines[0].l === 'out' ? 'return' : 'departure') + ' ride is added when you choose it.</p>' : '') +
          '<p class="t-caption c-tertiary">Luggage, child seats and extras come on the next step.</p>' +
        '</div>' + sheetFoot('Got it');
    },
    actions: closeAct,
  };
})();
</script>
<script>
// Extras — Streamline, New flow 06.10.2026: Flow 10 (1496:76165), Flow 12 filled (1496:77717), all luggage (1496:78050),
// voucher open / applied (1496:78726, 1496:79068); round trip 1504:3279. Flight sheet: Flow 11 (1496:76510, 1496:76878).
// One long page without a sticky button: the total with its breakdown sits at the end (decision 06.10.2026).
(function () {
  const u = GO.u;
  const { esc, fmtDay, fromMin } = u;
  const ic = GO.icon;
  const api = GO.api;

  const EMPTY_LUG = { trolley: 0, s20: 0, s32: 0, special: 0 };
  function ex() {
    const s = GO.store.get();
    return Object.assign({ lug: Object.assign({}, EMPTY_LUG), seats: null, nw: false, voucher: null, flights: { out: null, ret: null } }, s.ex);
  }
  function setEx(patch) { GO.store.set({ ex: Object.assign(ex(), patch) }); }

  function money2(n) { return n.toFixed(2) + ' €'; }
  function money(n) { return (Number.isInteger(n) ? n : n.toFixed(2)) + ' €'; }
  function paxLabel(s) {
    const a = s.adults + ' adult' + (s.adults > 1 ? 's' : '');
    return s.children ? a + ', ' + s.children + ' child' + (s.children > 1 ? 'ren' : '') : a;
  }
  function people(n) { return n + (n === 1 ? ' person' : ' people'); }
  function rides(n) { return n + (n === 1 ? ' ride' : ' rides'); }

  // ---------- booking: the picked offer of each leg ----------
  function legs(s) {
    const list = s.retDate && s.retTime ? ['out', 'ret'] : ['out'];
    return list.map(leg => {
      const q = api.legSearch(s, leg);
      if (!q.from || !q.to || !q.date || !q.time) return { leg, q, o: null };
      const data = api.offersNow(q);
      const sel = s.sel[leg];
      const all = data.shared.concat(data.priv, data.empty ? data.empty.alternatives : []);
      const o = sel.key === data.key ? all.find(x => x.id === sel.id && !x.soldOut) : null;
      return { leg, q, o: o || null };
    });
  }

  // ---------- price ----------
  function totals(s, e, L) {
    const pax = s.adults + s.children;
    const transfer = L.reduce((a, l) => a + l.o.total, 0);
    const lines = [{ label: (L.length > 1 ? 'Transfers, ' : 'Transfer, ') + rides(L.length) + ', ' + paxLabel(s), value: transfer }];
    if (GO.store.get().refund) lines.push({ label: '100% Money refund', value: Math.round(transfer * 15) / 100 });
    if (e.nw) lines.push({ label: 'No Worries package, ' + people(pax), value: api.NO_WORRIES * pax });
    const charged = L.filter(l => l.o.kind !== 'private').length; // private rides carry luggage for free
    api.LUGGAGE.forEach(item => {
      const n = e.lug[item.id];
      if (n && charged) lines.push({ label: (n > 1 ? n + ' × ' : '') + item.label + ', ' + rides(charged), value: n * item.price * charged });
    });
    if (e.voucher) {
      const v = e.voucher;
      const off = v.kind === 'percent' ? Math.round(transfer * v.value) / 100 : Math.min(v.value, transfer);
      lines.push({ label: 'Promo code ' + v.code + ', ' + voucherText(v), value: -off, voucher: true });
    }
    lines.push({ label: 'Transaction fee', value: api.FEE });
    return { lines, total: lines.reduce((a, l) => a + l.value, 0) };
  }
  function voucherText(v) { return v.kind === 'percent' ? v.value + '% off transfers' : money(v.value) + ' off'; }

  // ---------- pieces ----------
  function placeName(p) { return p.type === 'airport' ? api.shortName(p) : (p.city || p.name); }

  // Order as in Streamline 08.10.2026 (Trip header): labels, places with the rail, times in label-lg — the time is the accent, as in the offers feed
  function tripHeader(s, l, round) {
    const o = l.o, q = l.q;
    const fromName = placeName(q.from), toName = placeName(q.to);
    const pick = o.kind === 'flex' ? fromMin(o.pickFrom) + '–' + fromMin(o.pickTo) : fromMin(o.pickFrom);
    const drop = fromMin(o.arrival);
    return '<section class="trip" aria-label="' + (round ? (l.leg === 'out' ? 'Departure' : 'Return') : 'Your ride') + '">' +
      '<div class="trip__top">' +
        (round ? '<span class="trip__leg t-label-sm">' + (l.leg === 'out' ? 'Departure' : 'Return') + '</span>' : '') +
        '<span class="t-body-sm c-secondary trip__meta">' + esc(fmtDay(q.date) + ', ' + paxLabel(s)) + '</span>' +
        '<span class="badge badge--neutral">' + (o.kind === 'private' ? 'Private' : 'Shared') + '</span>' +
      '</div>' +
      '<p class="sr-only">' + esc('Pick-up ' + fromName + ', ' + pick + '. Drop-off ' + toName + ', by ' + drop + '.') + '</p>' +
      '<div class="trip__route" aria-hidden="true">' +
        '<div class="trip__row t-caption c-tertiary"><span>Pick-up</span><span>Drop-off</span></div>' +
        '<div class="trip__names t-body"><span class="trip__name ellipsis">' + esc(fromName) + '</span>' +
          '<span class="trip__rail"><span class="rail__dot"></span><span class="trip__line"></span><span class="rail__dot"></span></span>' +
          '<span class="trip__name trip__name--to ellipsis">' + esc(toName) + '</span></div>' +
        '<div class="trip__row t-label-lg"><span>' + pick + '</span><span>' + drop + '</span></div>' +
      '</div>' +
    '</section>';
  }

  function stepper(id, label, desc, value, icon) {
    return '<div class="lug-row">' + ic(icon, 20) +
      '<div class="lug-row__stepper" role="group" aria-labelledby="lug-' + id + '">' +
        '<div class="lug-row__text"><span id="lug-' + id + '" class="t-body">' + label + '</span><span class="t-body-sm c-tertiary">' + desc + '</span></div>' +
        '<span class="stepper stepper--tight">' +
          '<button class="stepper__btn" data-act="lug" data-id="' + id + '" data-d="-1" aria-label="Fewer: ' + esc(label) + '"' + (value <= 0 ? ' disabled' : '') + '>' + ic('minus', 20) + '</button>' +
          '<span class="stepper__value t-label-lg" aria-live="polite">' + value + '</span>' +
          '<button class="stepper__btn" data-act="lug" data-id="' + id + '" data-d="1" aria-label="More: ' + esc(label) + '"' + (value >= 9 ? ' disabled' : '') + '>' + ic('plus', 20) + '</button>' +
        '</span>' +
      '</div></div>';
  }

  // Luggage is always shown open (Flow 12 - Extras - filled - flight time check - 2 flights, 2490:32202; decision 20.10.2026)
  function luggage(e, L) {
    const free = L.every(l => l.o.kind === 'private');
    const price = item => free ? 'included' : '€' + item.price;
    return '<section class="ex-card lug" aria-labelledby="lug-title">' +
      '<div class="lug__head"><h2 id="lug-title" class="t-h3">Luggage</h2>' +
      '<p class="t-body-sm c-tertiary">' + (free ? 'Your private ride carries your luggage at no extra cost. Add it so the driver knows.' : 'Add luggage now to ensure there is enough space. One 5kg item included for free.') + '</p></div>' +
      '<div class="lug__list">' + api.LUGGAGE.map(item => stepper(item.id, item.label, item.size + ', ' + price(item), e.lug[item.id], item.icon)).join('<hr class="lug__divider">') + '</div>' +
    '</section>';
  }

  // Card/Child seats (2490:32525 / 2490:32018): only with children; "+ Add" opens the sheet, after saving "2 seats added"
  function seatCount(e) { return e.seats ? Object.values(e.seats.n).reduce((a, b) => a + b, 0) : 0; }
  function childSeats(s, e) {
    if (!s.children) return '';
    const n = seatCount(e);
    const note = !e.seats ? '<span class="seats-card__add t-label">+ Add</span>'
      : '<span class="seats-card__done t-label">' + (n ? n + (n === 1 ? ' seat added' : ' seats added') : 'No seat needed') + '</span>';
    return '<section aria-label="Child seat"><button class="ex-card seats-card" data-act="seats">' +
      '<span class="seats-card__title">' + ic('seat-card', 24) + '<span class="t-h3">Child seat</span></span>' + note +
    '</button></section>';
  }

  // Legs that touch an airport: the flight that leaves after the drop-off, or the one that lands before the pick-up
  function flightLegs(L) {
    return L.map(l => {
      if (l.q.to.type === 'airport') return { leg: l.leg, airport: l.q.to, kind: 'dep', date: l.q.date };
      if (l.q.from.type === 'airport') return { leg: l.leg, airport: l.q.from, kind: 'arr', date: l.q.date };
      return null;
    }).filter(Boolean);
  }

  // ---------- flight verdicts (Streamline 14.10, Flight verdicts - C 2567:10496) ----------
  // ok: green with a check, warn: amber triangle, error: red circle ("very little time"). Thresholds between the layout examples are ours.
  function verdict(f, fl, l) {
    const change = 'data-act="flight-time" data-leg="' + fl.leg + '"';
    const link = text => '<button class="link link--inline" ' + change + '>' + text + '</button>';
    if (fl.kind === 'dep') {
      const gap = f.dep - l.o.arrival;
      // the flight leaves before the drop-off: it can only be the next day's
      if (gap < 0) {
        const next = u.addDays(fl.date, 1);
        return { level: 'warn', date: next,
          html: 'Your flight is on <b>' + esc(fmtDay(next)) + '</b>. Double-check the selected date of your transport.',
          action: '<button class="link t-label verdict__action" ' + change + '>Change date</button>' };
      }
      if (gap >= 120) return { level: 'ok', html: 'Your drop-off time is ' + u.fmtDur(gap) + ' before the flight’s departure.' };
      return { level: gap >= 90 ? 'warn' : 'error', html: 'Your drop-off time is <b>' + u.fmtDur(gap) + '</b> before the flight’s departure, ' + link('consider changing it') + '.' };
    }
    // landing after midnight: the transport date is easy to get wrong
    if (f.arr < 240) {
      const a = fmtDay(u.addDays(fl.date, -1)).split(' '), b = fmtDay(fl.date);
      const first = a[2] === b.split(' ')[2] ? a.slice(0, 2).join(' ') : a.join(' ');
      return { level: 'warn', html: 'Night between <b>' + esc(first) + '</b> and <b>' + esc(b) + '</b>. Don’t forget to ' + link('double-check the selected date') + ' of your transport.' };
    }
    const gap = l.o.pickFrom - f.arr;
    if (gap >= 60) return { level: 'ok', html: 'Your pick-up time is ' + u.fmtDur(gap) + ' after the flight’s landing.' };
    if (gap >= 0) return { level: 'warn', html: 'Your pick-up time is <b>' + u.fmtDur(gap) + '</b> after the flight’s landing, ' + link('consider changing it') + '.' };
    return { level: 'error', html: 'Your pick-up time is <b>' + u.fmtDur(-gap) + '</b> before the flight’s landing, ' + link('consider changing it') + '.' };
  }
  const VERDICT_ICON = { ok: 'check', warn: 'alert', error: 'error-circle' };

  // Filled flight: "EZY5832, Thu 15 Oct 12:25" / "Venice → London Gatwick", Change on the right, the verdict below
  function flightRow(f, fl, l) {
    const v = verdict(f, fl, l);
    const here = fl.airport.city || api.shortName(fl.airport);
    const title = f.code + ', ' + fmtDay(v.date || fl.date) + ' ' + fromMin(fl.kind === 'dep' ? f.dep : f.arr);
    return '<div class="flight-row">' +
      // the flight itself with a chevron changes the flight; links in the verdict change the ride's date and time (Phil, 20.10.2026)
      '<button class="flight-add" data-act="flight" data-leg="' + fl.leg + '" aria-label="Change flight ' + esc(f.code) + ', ' + esc(title.slice(f.code.length + 2)) + '">' +
        '<span class="flight-row__text">' +
          '<span class="flight-row__title t-label-lg">' + ic(fl.kind === 'dep' ? 'flight-takeoff' : 'flight-land', 20) + '<span>' + esc(title) + '</span></span>' +
          '<span class="t-body-sm c-tertiary">' + esc(fl.kind === 'dep' ? here + ' → ' + f.city : f.city + ' → ' + here) + '</span>' +
        '</span>' + ic('chevron-right', 20) +
      '</button>' +
      '<div class="verdict verdict--' + v.level + ' t-body-sm">' + ic(VERDICT_ICON[v.level], 16) +
        '<div class="verdict__text"><p>' + v.html + '</p>' + (v.action || '') + '</div></div>' +
    '</div>';
  }

  // Empty row in the card: the whole row is a button
  function flightAdd(fl) {
    // the return invitation is a plain centred link, as in Anya's sketch (user, 20.10.2026)
    if (fl.leg === 'ret') return '<button class="link t-label flight-add-ret" data-act="flight" data-leg="ret">Add return flight</button>';
    return '<button class="flight-add" data-act="flight" data-leg="' + fl.leg + '">' +
      '<span class="flight-row__text">' +
        '<span class="flight-row__title t-label-lg">' + ic(fl.kind === 'dep' ? 'flight-takeoff' : 'flight-land', 20) + '<span>' + (fl.leg === 'ret' ? 'Add your return flight' : 'Add your flight') + '</span></span>' +
        '<span class="t-body-sm c-tertiary">We’ll check that your ' + (fl.kind === 'dep' ? 'drop-off' : 'pick-up') + ' time works with it.</span>' +
      '</span>' + ic('chevron-right', 20) + '</button>';
  }

  function flightBlock(e, L) {
    const F = flightLegs(L);
    if (!F.length) return '';
    // one empty "Add your flight" row at a time: the return row appears once the first flight is added (user, 20.10.2026)
    const shown = F.filter((fl, i) => e.flights[fl.leg] || F.slice(0, i).every(p => e.flights[p.leg]));
    return '<section class="ex-card flights" aria-label="Your flights">' + shown.map(fl => e.flights[fl.leg]
      ? flightRow(e.flights[fl.leg], fl, L.find(l => l.leg === fl.leg))
      : flightAdd(fl)
    ).join('<hr class="divider">') + '</section>';
  }

  const NW_FACTS = ['We send a new transfer', 'Free rebooking if the airline moves your flight', 'We buy you a new flight ticket if you’re late because of a traffic jam'];
  function noWorries(s, e) {
    const pax = s.adults + s.children;
    const price = money2(api.NO_WORRIES * pax);
    return '<section class="nw" aria-labelledby="nw-title">' +
      '<div class="nw__head"><div class="nw__text"><h2 id="nw-title" class="nw__title">Absolutely<br>No Worries package</h2>' +
        '<p class="t-body-sm c-secondary">If you miss your ride or your plane, we sort it out:</p></div>' +
        '<span class="nw__art" aria-hidden="true">' + GO.ART_NO_WORRIES + '</span></div>' +
      (e.nw
        ? '<div class="nw__added" role="status">' + ic('check', 24, 'icon--success') + '<span class="nw__added-label">Added, ' + price + '</span>' +
          '<button class="link t-label" data-act="nw" aria-label="Remove No Worries package">Remove</button></div>'
        : '<button class="btn btn--success" data-act="nw">Add for ' + price + '</button>') +
      '<ul class="check-list check-list--tight">' + NW_FACTS.map(t => '<li class="check-item">' + ic('check-circle', 20, 'icon--success') + '<span class="t-body-sm">' + t + '</span></li>').join('') + '</ul>' +
      '<button class="link t-label nw__more" data-act="nw-more">Find out more</button>' +
    '</section>';
  }

  // Promo code inside the total block, between Total and Continue (20.10.2026): a grey field "Enter promo code",
  // black Apply inside it once something is typed; applied — white card "HEY10 10% off your transfer" with Remove
  function promo(e, err, busy, offText) {
    if (e.voucher) {
      return '<div class="promo-applied" role="status" aria-label="Promo code">' +
        '<p class="promo-applied__text"><span class="t-label-lg">' + esc(e.voucher.code) + '</span> <span class="t-body c-success">' + esc(offText) + '</span></p>' +
        '<button class="link t-label" data-act="voucher-remove">Remove</button></div>';
    }
    return '<div class="promo-wrap">' +
      '<form class="promo' + (err ? ' promo--error' : '') + '" data-voucher-form novalidate>' +
        '<label for="voucher-code" class="sr-only">Promo code</label>' +
        '<input id="voucher-code" name="code" placeholder="Enter promo code" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go"' + (err ? ' aria-invalid="true" aria-describedby="voucher-err"' : '') + '>' +
        '<button class="promo__apply t-label" type="submit"' + (busy ? ' aria-busy="true"' : '') + '>Apply</button>' +
      '</form>' +
      (err ? '<p id="voucher-err" class="t-body-sm field-error" role="alert">' + ic('error-circle', 16) + esc(err) + '</p>' : '') +
    '</div>';
  }

  // Invoice (Streamline 14.10: 2237:16220, sheet 2253:124437 / 2253:124880, checked 2253:125323): a checkbox under the promo code.
  // Ticking it opens "Invoice details"; after Save it is checked with "Company, VAT" under the label. Unticking keeps the details.
  function invoiceRow(e) {
    const inv = e.invoice, on = !!(e.invoiceOn && inv);
    return '<label class="checkbox ex-invoice"><input type="checkbox" data-invoice' + (on ? ' checked' : '') + '>' +
      '<span class="checkbox__box" aria-hidden="true">' + ic('check', 16) + '</span>' +
      '<span class="checkbox__text"><span class="t-body">I need an invoice for a company</span>' +
      (on ? '<span class="t-body-sm c-tertiary">' + esc(inv.company + (inv.vat ? ', ' + inv.vat : '')) + '</span>' : '') +
      '</span></label>';
  }

  function totalBlock(T, promoHtml, invoiceHtml) {
    return '<section class="ex-total" aria-label="Total">' +
      '<dl class="ex-total__lines">' + T.lines.map(l =>
        '<div class="ex-total__line"><dt class="t-body-sm c-secondary">' + esc(l.label) + '</dt><dd class="t-body-sm">' + (l.value < 0 ? '−' : '') + money2(Math.abs(l.value)) + '</dd></div>').join('') +
      '</dl>' +
      '<div class="total-row"><div class="total-row__text"><span class="t-label-lg">Total</span><span class="t-caption c-tertiary">incl. transaction fee</span></div>' +
      '<div class="t-h2 nowrap" aria-live="polite">' + money2(T.total) + '</div></div>' +
      promoHtml + invoiceHtml +
      '<button class="btn btn--primary" data-act="continue">Continue</button>' +
    '</section>';
  }

  // ---------- screen ----------
  let voucherErr = '', voucherBusy = false;

  GO.screens.extras = {
    render(s) {
      const L = legs(s);
      const head = '<header class="page-header"><button class="icon-btn" data-act="back" aria-label="Back">' + ic('chevron-left', 24) + '</button><h1 class="t-h2">Finish booking</h1></header>';
      if (!L.length || L.some(l => !l.o)) {
        return head + GO.noRide(s);
      }
      const e = ex();
      const T = totals(s, e, L);
      const round = L.length > 1;
      const v = T.lines.find(l => l.voucher);
      return head +
        '<main class="extras">' +
          '<div class="trips">' + L.map(l => tripHeader(s, l, round)).join('') + '</div>' +
          // order as in 2490:32202: flight, No Worries, luggage, child seat; the promo code sits in the total
          flightBlock(e, L) +
          noWorries(s, e) +
          luggage(e, L) +
          childSeats(s, e) +
          totalBlock(T, promo(e, voucherErr, voucherBusy, v ? voucherText(e.voucher).replace('transfers', round ? 'your transfers' : 'your transfer') : ''), invoiceRow(e)) +
        '</main>';
    },
    mount(root) {
      const inv = root.querySelector('[data-invoice]');
      if (inv) inv.addEventListener('change', () => {
        if (inv.checked) { inv.checked = false; GO.router.go('/extras/invoice'); }
        else { setEx({ invoiceOn: false }); refreshKeep('[data-invoice]'); }
      });
      const form = root.querySelector('[data-voucher-form]');
      if (!form) return;
      const input = form.querySelector('input');
      if (voucherErr || voucherBusy) input.value = GO.store.get().voucherDraft || '';
      input.addEventListener('input', () => {
        if (!voucherErr) return;
        voucherErr = '';
        form.classList.remove('promo--error'); input.removeAttribute('aria-invalid'); input.removeAttribute('aria-describedby');
        const p = root.querySelector('#voucher-err'); if (p) p.remove();
      });
      form.addEventListener('submit', async ev => {
        ev.preventDefault();
        const code = input.value.trim();
        GO.store.set({ voucherDraft: code });
        if (!code) { voucherErr = 'Enter the code first.'; return refreshKeep('#voucher-code'); }
        voucherBusy = true; voucherErr = ''; refreshKeep('#voucher-code');
        const v = await api.checkVoucher(code);
        voucherBusy = false;
        if (!v) { voucherErr = 'We don’t know this code. Check it and try again.'; return refreshKeep('#voucher-code'); }
        GO.store.set({ voucherDraft: '' });
        setEx({ voucher: v });
        refreshKeep('[data-act=voucher-remove]');
      });
    },
    actions: {
      back: () => GO.router.back(),
      'to-offers': () => GO.router.go('/offers', { replace: true }),
      'see-booking': () => GO.router.go('/booked', { replace: true }),
      'new-ride': () => GO.router.go('/', { replace: true }),
      lug(el) {
        const e = ex();
        const lug = Object.assign({}, e.lug);
        lug[el.dataset.id] = Math.max(0, Math.min(9, lug[el.dataset.id] + +el.dataset.d));
        setEx({ lug });
        refreshKeep('[data-act=lug][data-id=' + el.dataset.id + '][data-d="' + el.dataset.d + '"]', '[data-act=lug][data-id=' + el.dataset.id + ']');
      },
      seats: () => GO.router.go('/extras/seats'),
      nw() { setEx({ nw: !ex().nw }); refreshKeep('[data-act=nw]'); },
      'nw-more': () => GO.router.go('/extras/no-worries'),
      flight(el) { GO.store.set({ flightLeg: el.dataset.leg }); GO.router.go('/extras/flight'); },
      // "consider changing it" / "Change date": back to the offers of that leg with its date and time sheet open,
      // since a new time needs a new offer; closing the sheet lands on those offers
      'flight-time'(el) {
        const ret = el.dataset.leg === 'ret';
        GO.router.go(ret ? '/offers/return' : '/offers');
        GO.router.go(ret ? '/offers/return/when' : '/offers/when');
      },
      'voucher-remove'() { setEx({ voucher: null }); refreshKeep('#voucher-code'); },
      continue: () => GO.router.go('/details'),
    },
  };

  // Re-render in place and keep the focus where the person was (steppers, voucher field)
  function refreshKeep(sel, fallback) {
    GO.router.refresh();
    const el = document.querySelector(sel);
    const target = el && !el.disabled ? el : fallback && document.querySelector(fallback);
    if (target) target.focus({ preventScroll: true });
  }

  // ---------- sheet: your flight ----------
  let fq = '', fTimer = null, fReq = 0;

  function flightCtx() {
    const s = GO.store.get();
    const F = flightLegs(legs(s).filter(l => l.o));
    return { s, fl: F.find(f => f.leg === s.flightLeg) || F[0] };
  }

  function flightResults(list, fl) {
    if (!fq.trim()) {
      return '<p class="t-body-sm c-secondary">Can’t find it, or flying charter?</p>' +
        '<button class="link t-label flight-manual" data-act="flight-manual">Enter flight details yourself</button>';
    }
    if (!list) return '<div class="place-list__status"><span class="spinner" aria-hidden="true"></span><span class="t-body-sm">Looking for flights…</span></div>';
    if (!list.length) {
      return '<p class="t-body-sm c-secondary">No flights like “' + esc(fq) + '” on ' + fmtDay(fl.date) + '.</p>' +
        '<button class="link t-label flight-manual" data-act="flight-manual">Enter flight details yourself</button>';
    }
    const manual = '<p class="t-body-sm c-secondary flight-manual-note">Not your flight? <button class="link link--inline" data-act="flight-manual">Enter flight details yourself</button></p>';
    return '<ul class="place-list" role="listbox" aria-label="Flights">' + list.map((f, i) =>
      '<li><button class="place-option" role="option" data-act="flight-pick" data-i="' + i + '">' +
        '<span class="place-option__icon">' + ic(fl.kind === 'dep' ? 'flight-takeoff' : 'flight-land', 20) + '</span>' +
        '<span class="place-option__text"><span class="place-option__name">' + esc(f.code + (f.airline ? ', ' + f.airline : '')) + '</span>' +
        '<span class="place-option__detail">' + esc(fl.kind === 'dep' ? 'To ' + f.city + ', departs ' + fromMin(f.dep) : 'From ' + f.city + ', lands ' + fromMin(f.arr)) + '</span></span>' +
      '</button></li>').join('') + '</ul>' + manual;
  }

  // demo flights fit the ride: out leaves 2h 30m after the drop-off (green), back lands 30m before the pick-up starts (amber)
  function pinFor(s, fl) {
    const l = legs(s).find(x => x.leg === fl.leg);
    if (!l || !l.o) return null;
    return fl.kind === 'dep'
      ? { code: 'EZY5832', at: Math.min(Math.round((l.o.arrival + 150) / 5) * 5, 1435) }
      : { code: 'EZY5833', at: l.o.pickFrom - 30 };
  }
  function saveFlight(f) {
    const { fl } = flightCtx();
    const flights = Object.assign({}, ex().flights);
    flights[fl.leg] = f;
    setEx({ flights });
    GO.router.back();
  }

  let lastList = null;
  GO.screens['extras-flight'] = {
    overlay: true, base: 'extras', sheetClass: 'sheet--bottom sheet--tall',
    render() {
      const { s, fl } = flightCtx();
      if (!fl) return '<div class="sheet__body"><p class="t-body">No airport on this trip.</p></div>';
      const cur = ex().flights[fl.leg];
      fq = cur ? cur.code : '';
      lastList = null;
      const intro = (fl.kind === 'dep' ? 'Flying from ' : 'Landing at ') + api.shortName(fl.airport) + ' on ' + fmtDay(fl.date) + '. We’ll check that your pick-up time works with it.';
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">' + (fl.leg === 'ret' ? 'Your return flight' : 'Add your flight') + '</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body sheet__body--gap16">' +
          '<p class="t-body-sm c-secondary">' + esc(intro) + '</p>' +
          '<div class="flight-field"><label for="flight-q" class="t-label">Flight number</label>' +
            '<div class="field">' + ic('search', 20, 'icon--muted') +
              '<input id="flight-q" type="search" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search" placeholder="e.g. EZY5832" value="' + esc(fq) + '" aria-describedby="flight-hint">' +
              '<button class="field__clear" data-act="flight-clear" aria-label="Clear"' + (fq ? '' : ' hidden') + '>' + ic('clear', 20) + '</button>' +
            '</div>' +
            '<p id="flight-hint" class="t-body-sm c-secondary">On your ticket or booking email, e.g. EZY5832</p></div>' +
          '<div id="flight-results">' + flightResults(null, fl) + '</div>' +
          (cur ? '<button class="link t-label flight-manual" data-act="flight-remove">Remove this flight</button>' : '') +
        '</div>';
    },
    mount(root) {
      const input = root.querySelector('#flight-q');
      if (!input) return;
      input.focus();
      const run = () => {
        const { s, fl } = flightCtx();
        const id = ++fReq;
        root.querySelector('[data-act=flight-clear]').hidden = !fq;
        root.querySelector('#flight-results').innerHTML = flightResults(fq.trim() ? null : [], fl);
        if (!fq.trim()) return;
        api.flights(fl.airport, fl.date, fl.kind, fq, pinFor(s, fl)).then(list => {
          if (id !== fReq) return;
          lastList = list;
          root.querySelector('#flight-results').innerHTML = flightResults(list, fl);
        });
      };
      input.addEventListener('input', () => { fq = input.value; clearTimeout(fTimer); fTimer = setTimeout(run, 150); });
      if (fq) run();
    },
    actions: {
      close: () => GO.router.back(),
      'flight-clear'() { const i = document.querySelector('#flight-q'); i.value = ''; i.dispatchEvent(new Event('input')); i.focus(); },
      'flight-pick'(el) {
        const f = lastList && lastList[+el.dataset.i];
        if (f) saveFlight(f);
      },
      'flight-remove'() {
        const { fl } = flightCtx();
        const flights = Object.assign({}, ex().flights);
        flights[fl.leg] = null;
        setEx({ flights });
        GO.router.back();
      },
      // its own sheet with the typed number carried over (2297:17803); replaces the search, so Save or the cross land on Extras
      'flight-manual'() { manualDraft = { code: fq.trim().toUpperCase(), city: '', h: '', m: '' }; GO.router.go('/extras/flight/manual', { replace: true }); },
    },
  };

  // Steps after Offers with no ride picked. After payment the trip is cleared, so going back says it is booked.
  GO.noRide = s => s.booked && !s.from
    ? '<main class="stub"><p class="t-body c-secondary">This ride is booked and paid.</p><button class="btn btn--primary" data-act="see-booking">See your booking</button><button class="btn btn--secondary" data-act="new-ride">Book another ride</button></main>'
    : '<main class="stub"><p class="t-body c-secondary">Choose your ride first.</p><button class="btn btn--primary" data-act="to-offers">Back to rides</button></main>';

  // Shared with Details and Payment: the booking, its price and the formats
  // ---------- sheet: enter the flight yourself (Flow 11 - Extras - add flight - manual entry 2297:17803, filled 2297:18197) ----------
  // No checks (user, 20.10.2026): whatever is typed is saved as the flight, the verdict is worked out from its time as usual.
  let manualDraft = null;
  const manualReady = () => manualDraft && manualDraft.code.trim() && manualDraft.city.trim() && manualDraft.h !== '' && manualDraft.m !== '';
  function manualSelect(id, value, options, label, placeholder) {
    return '<div class="select select--time"><label class="sr-only" for="' + id + '">' + label + '</label>' +
      '<select id="' + id + '" class="' + (value === '' ? 'is-empty' : '') + '">' +
        '<option value="" disabled' + (value === '' ? ' selected' : '') + ' hidden>' + placeholder + '</option>' +
        options.map(o => '<option' + (o === value ? ' selected' : '') + '>' + o + '</option>').join('') +
      '</select>' + ic('chevron-down', 20) + '</div>';
  }
  GO.screens['extras-flight-manual'] = {
    overlay: true, base: 'extras', sheetClass: 'sheet--bottom',
    render() {
      const { fl } = flightCtx();
      if (!fl) return '<div class="sheet__body"><p class="t-body">No airport on this trip.</p></div>';
      const cur = ex().flights[fl.leg];
      if (!manualDraft) manualDraft = { code: cur ? cur.code : '', city: cur ? cur.city : '', h: '', m: '' };
      const dep = fl.kind === 'dep';
      const intro = (dep ? 'Flying from ' : 'Landing at ') + api.shortName(fl.airport) + ' on ' + fmtDay(fl.date) + '.';
      const hours = Array.from({ length: 24 }, (_, i) => u.pad(i));
      const mins = Array.from({ length: 12 }, (_, i) => u.pad(i * 5));
      const timeLabel = dep ? 'Flight time departure' : 'Landing time';
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Your flight</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<form class="sheet__body invoice-sheet" data-manual-form novalidate>' +
          '<p class="t-body-sm c-secondary">' + esc(intro) + '</p>' +
          '<div class="form-field"><label class="t-label" for="mf-code">Flight number</label>' +
            '<div class="field"><input id="mf-code" name="code" value="' + esc(manualDraft.code) + '" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next" placeholder="e.g. EZY5832"></div></div>' +
          '<div class="form-field"><label class="t-label" for="mf-city">' + (dep ? 'Destination' : 'Departure from') + '</label>' +
            '<div class="field"><input id="mf-city" name="city" value="' + esc(manualDraft.city) + '" autocomplete="off" autocapitalize="words" enterkeyhint="next" aria-describedby="mf-city-help"></div>' +
            '<p id="mf-city-help" class="t-body-sm c-tertiary">City or airport your flight ' + (dep ? 'goes to' : 'comes from') + '</p></div>' +
          '<div class="time-field" role="group" aria-labelledby="mf-time">' +
            '<span id="mf-time" class="time-field__label t-label">' + timeLabel + '</span>' +
            manualSelect('mf-h', manualDraft.h, hours, timeLabel + ', hour', 'Hour') +
            '<span class="time-field__colon t-h3" aria-hidden="true">:</span>' +
            manualSelect('mf-m', manualDraft.m, mins, timeLabel + ', minutes', 'Min') +
          '</div>' +
        '</form>' +
        '<div class="cta-bar"><button class="btn btn--primary" data-act="manual-save"' + (manualReady() ? '' : ' disabled') + '>Save flight</button></div>';
    },
    mount(root) {
      const form = root.querySelector('[data-manual-form]');
      if (!form) return;
      const save = root.querySelector('[data-act=manual-save]');
      const sync = () => {
        manualDraft = { code: form.querySelector('#mf-code').value, city: form.querySelector('#mf-city').value, h: form.querySelector('#mf-h').value, m: form.querySelector('#mf-m').value };
        form.querySelectorAll('select').forEach(sel => sel.classList.toggle('is-empty', sel.value === ''));
        save.disabled = !manualReady();
      };
      form.addEventListener('input', sync);
      form.addEventListener('change', sync);
      form.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT') return;
        ev.preventDefault();
        const next = { 'mf-code': 'mf-city', 'mf-city': 'mf-h' }[ev.target.id];
        if (next) form.querySelector('#' + next).focus();
      });
      // the number is usually carried over from the search: start on the next empty field
      setTimeout(() => { const f = Array.from(form.querySelectorAll('input')).find(i => !i.value.trim()); if (f) f.focus({ preventScroll: true }); }, 300);
    },
    actions: {
      close() { manualDraft = null; GO.router.back(); },
      'manual-save'() {
        if (!manualReady()) return;
        const { fl } = flightCtx();
        const t = u.toMin(manualDraft.h + ':' + manualDraft.m);
        const f = { code: manualDraft.code.trim().toUpperCase().replace(/\s+/g, ''), airline: '', city: manualDraft.city.trim() };
        f[fl.kind] = t;
        manualDraft = null;
        saveFlight(f);
      },
    },
  };

  // ---------- sheet: invoice details (2253:124437 empty, 2253:124880 filled) ----------
  // Labels above the fields, Save once the company name and address are there; VAT is optional.
  const INV_FIELDS = [
    ['company', 'Company name', 'e.g. Alpe Tours d.o.o.', 'autocomplete="organization"'],
    ['address', 'Company address', 'Street, city, postcode', 'autocomplete="street-address"'],
    ['vat', 'VAT number', 'e.g. SI12345678', 'autocomplete="off" autocapitalize="characters" spellcheck="false"'],
  ];
  const invReady = form => ['company', 'address'].every(k => form.querySelector('[name=' + k + ']').value.trim());
  GO.screens['extras-invoice'] = {
    overlay: true, base: 'extras', sheetClass: 'sheet--bottom',
    render() {
      const inv = ex().invoice || {};
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Invoice details</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<form class="sheet__body invoice-sheet" data-invoice-form novalidate>' +
          '<p class="t-body-sm c-secondary">We’ll email the invoice with your booking confirmation.</p>' +
          INV_FIELDS.map(([k, label, ph, attrs], i) =>
            '<div class="form-field"><label class="t-label" for="inv-' + k + '">' + label + '</label>' +
            '<div class="field"><input id="inv-' + k + '" name="' + k + '" placeholder="' + ph + '" value="' + esc(inv[k] || '') + '" ' + attrs +
            ' enterkeyhint="' + (i < INV_FIELDS.length - 1 ? 'next' : 'done') + '"></div></div>').join('') +
        '</form>' +
        '<div class="cta-bar"><button class="btn btn--primary" data-act="invoice-save"' + (inv.company && inv.address ? '' : ' disabled') + '>Save</button></div>';
    },
    mount(root) {
      const form = root.querySelector('[data-invoice-form]');
      const save = root.querySelector('[data-act=invoice-save]');
      form.addEventListener('input', () => { save.disabled = !invReady(form); });
      form.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT') return;
        ev.preventDefault();
        const list = Array.from(form.querySelectorAll('input'));
        const next = list[list.indexOf(ev.target) + 1];
        if (next) next.focus(); else if (!save.disabled) save.click();
      });
      setTimeout(() => { const f = form.querySelector('input'); if (f && !f.value) f.focus({ preventScroll: true }); }, 300);
    },
    actions: {
      close: () => GO.router.back(),
      'invoice-save'() {
        const form = document.querySelector('[data-invoice-form]');
        if (!form || !invReady(form)) return;
        const v = k => form.querySelector('[name=' + k + ']').value.trim();
        setEx({ invoice: { company: v('company'), address: v('address'), vat: v('vat') }, invoiceOn: true });
        GO.router.back();
        setTimeout(() => { const c = document.querySelector('[data-invoice]'); if (c) c.focus({ preventScroll: true }); }, 50);
      },
    },
  };

  GO.booking = { ex, legs, totals, money2, paxLabel };

  // ---------- sheet: child seats (Flow 10 - Extras - children - sheet - Child seats - not chosen / no seat confirmed, 2287:16948 / 2287:17425) ----------
  // Up to one seat per child. A consent checkbox stands over Save: "I confirm that 1 child doesn't need a child seat"; disabled once every child has a seat.
  let seatDraft = null;
  function seatsLeft(s) { return s.children - Object.values(seatDraft.n).reduce((a, b) => a + b, 0); }
  function seatsFooter(s) {
    const left = seatsLeft(s);
    // the line stays when every child has a seat, only disabled: the sheet keeps its height (20.10.2026)
    const n = Math.max(left, 1);
    const who = n === 1 ? '1 child</b> doesn’t' : n + ' children</b> don’t';
    return '<label class="checkbox"><input type="checkbox" data-seat-ok' + (left > 0 && seatDraft.ok ? ' checked' : '') + (left > 0 ? '' : ' disabled') + '><span class="checkbox__box" aria-hidden="true">' + ic('check', 16) + '</span>' +
        '<span class="t-body">I confirm that <b>' + who + ' need a child seat</span></label>' +
      '<button class="btn btn--primary" data-act="seats-save"' + (left > 0 && !seatDraft.ok ? ' disabled' : '') + '>Save</button>';
  }
  function seatRow(item, s) {
    const v = seatDraft.n[item.id], full = seatsLeft(s) <= 0;
    return '<div class="seat-row" role="group" aria-labelledby="seat-' + item.id + '">' +
      '<span class="seat-row__icon">' + ic(item.icon, 40) + '</span>' +
      '<span class="seat-row__text"><span id="seat-' + item.id + '" class="t-body">' + item.label + '</span><span class="t-body-sm c-tertiary">' + item.desc + '</span></span>' +
      '<span class="stepper">' +
        '<button class="stepper__btn" data-act="seat" data-id="' + item.id + '" data-d="-1" aria-label="Fewer: ' + esc(item.label) + '"' + (v <= 0 ? ' disabled' : '') + '>' + ic('minus', 20) + '</button>' +
        '<span class="stepper__value t-label-lg" aria-live="polite">' + v + '</span>' +
        '<button class="stepper__btn" data-act="seat" data-id="' + item.id + '" data-d="1" aria-label="More: ' + esc(item.label) + '"' + (full ? ' disabled' : '') + '>' + ic('plus', 20) + '</button>' +
      '</span></div>';
  }
  GO.screens['extras-seats'] = {
    overlay: true, base: 'extras', sheetClass: 'sheet--bottom',
    render(s) {
      const e = ex();
      seatDraft = { n: Object.assign({ infant: 0, baby: 0, child: 0, booster: 0 }, e.seats && e.seats.n), ok: !!(e.seats && e.seats.ok) };

        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Child seats</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body sheet__body--gap16">' +
          '<p class="t-body c-secondary">Free for every child.<br>Choose by your child’s weight.</p>' +
          '<div class="seat-list">' + api.SEATS.map(i => seatRow(i, s)).join('') + '</div>' +
        '</div>' +
        '<div class="cta-bar seats-footer">' + seatsFooter(s) + '</div>';
    },
    mount(root) {
      root.addEventListener('change', ev => {
        if (!ev.target.hasAttribute('data-seat-ok')) return;
        seatDraft.ok = ev.target.checked;
        root.querySelector('[data-act=seats-save]').disabled = !seatDraft.ok;
      });
    },
    actions: {
      close: () => GO.router.back(),
      seat(el) {
        const s = GO.store.get();
        const id = el.dataset.id, d = +el.dataset.d;
        if (d > 0 && seatsLeft(s) <= 0) return;
        seatDraft.n[id] = Math.max(0, seatDraft.n[id] + d);
        seatDraft.ok = false; // the consent names a number of children, a new count needs a new tick
        const sheet = document.querySelector('.sheet');
        sheet.querySelector('.seat-list').innerHTML = api.SEATS.map(i => seatRow(i, s)).join('');
        sheet.querySelector('.seats-footer').innerHTML = seatsFooter(s);
        // keep the focus on the pressed button, or on its pair when it got disabled
        const same = sheet.querySelector('[data-act=seat][data-id=' + id + '][data-d="' + d + '"]');
        (same && !same.disabled ? same : sheet.querySelector('[data-act=seat][data-id=' + id + '][data-d="' + (-d) + '"]')).focus();
      },
      'seats-save'() {
        const s = GO.store.get();
        setEx({ seats: { n: Object.assign({}, seatDraft.n), ok: seatsLeft(s) > 0 && seatDraft.ok } });
        GO.router.back();
        setTimeout(() => { const b = document.querySelector('[data-act=seats]'); if (b) b.focus({ preventScroll: true }); }, 50);
      },
    },
  };

  // ---------- sheet: No Worries, find out more (Flow 10 - Extras - sheet - No Worries details, 2264:126988) ----------
  const NW_COVER = [
    ['What if you miss your flight because of traffic jams, extreme weather or bad road conditions?', 'We provide a new flight ticket and, if needed, a hotel room at our cost.'],
    ['What if the airline reschedules your flight?', 'We arrange a new GoOpti transfer for free.'],
    ['What about delayed or rerouted flights?', 'We find a free replacement transfer.'],
    ['How do you let us know you missed your flight or need a new transfer?', 'Your confirmation email has our contact details. In any of these cases, call us as soon as possible.'],
  ];
  GO.screens['extras-no-worries'] = {
    overlay: true, base: 'extras', sheetClass: 'sheet--bottom',
    render(s) {
      const e = ex();
      const price = money2(api.NO_WORRIES * (s.adults + s.children));
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Absolutely No Worries package</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body sheet__body--gap16">' +
          '<h3 class="t-h3">What does the package cover?</h3>' +
          '<ul class="nw-cover">' + NW_COVER.map(([q, a]) => '<li class="nw-cover__item">' + ic('check-circle', 20, 'icon--success') +
            '<span class="nw-cover__text"><span class="t-body-sm c-secondary">' + q + '</span><span class="t-label">' + a + '</span></span></li>').join('') + '</ul>' +
          '<button class="link t-label nw-terms" data-act="nw-terms">Terms and conditions of service</button>' +
        '</div>' +
        // Add: primary, as in the frame; once added the sheet only closes
        '<div class="cta-bar"><button class="btn ' + (e.nw ? 'btn--secondary' : 'btn--primary') + '" data-act="nw-sheet">' + (e.nw ? 'Got it' : 'Add for ' + price) + '</button></div>';
    },
    actions: {
      close: () => GO.router.back(),
      'nw-sheet'() { if (!ex().nw) setEx({ nw: true }); GO.router.back(); },
      'nw-terms': () => u.toast('Terms and conditions come in a later build'),
    },
  };
})();
