    return '<button class="place-option" data-act="pick" data-i="' + i + '">' +
      '<span class="place-option__icon">' + ic(iconName, 20) + '</span>' +
      '<span class="place-option__text">' +
        '<span class="place-option__name ellipsis' + (opts && opts.strong ? ' t-label-lg' : '') + '">' + highlight(name, q) + '</span>' +
        (detail ? '<span class="place-option__detail ellipsis">' + highlight(detail, q) + '</span>' : '') +
      '</span></button>';
  }

  function initialList(kind, s) {
    if (kind === 'from') {
      items = [{ locate: true }].concat(GO.DATA.popularFrom.map(api.place));
      return option({}, 0, '', { icon: 'locate', name: 'Use my current location', detail: 'We’ll pick you up at your door', strong: true }) +
        '<hr class="divider">' +
        '<div class="list-heading" role="presentation">Popular pick-up points</div>' +
        items.slice(1).map((p, i) => option(p, i + 1, '')).join('');
    }
    const fromAir = api.isAirport(s.from);
    const ids = fromAir ? GO.DATA.popularCities : GO.DATA.popularAirports;
    items = ids.map(api.place).filter(p => !s.from || p.id !== s.from.id);
    const city = (s.from && s.from.city) || 'Ljubljana';
    return '<div class="list-heading" role="presentation">' + (fromAir ? 'Popular destinations from ' : 'Popular airports from ') + esc(city) + '</div>' +
      items.map((p, i) => option(p, i, '')).join('');
  }

  // edit: the same sheet opened from Edit search, over the offers; picking a place goes back to the form
  function screen(kind, edit) {
    return {
      overlay: true,
      base: edit ? () => GO.editBase() : null,
      render(s) {
        const title = kind === 'from' ? 'Where from?' : 'Where to?';
        // Streamline 14.10.2026: From above the title on Where to (2237:13129), an empty slot of the same height on Where from (2237:12967)
        const context = '<div class="place-context">' + (kind === 'to' && s.from
          ? '<span class="t-label c-secondary">From</span><span class="chip t-body">' + esc(s.from.name) + '</span>'
          : '') + '</div>';
        return '' +
          '<header class="sheet-header">' +
            '<div class="sheet-header__titles sheet-header__titles--context">' +
              context +
              '<h2 id="sheet-title" class="t-h1">' + title + '</h2>' +
            '</div>' +
            '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button>' +
          '</header>' +
          '<div class="sheet__body">' +
            '<label class="field">' +
              '<span class="sr-only">' + (kind === 'from' ? 'Pick-up address' : 'Drop-off address') + '</span>' +
              '<input id="place-q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Address, hotel or airport">' +
              '<button class="field__clear" data-act="clear" aria-label="Clear" hidden>' + ic('clear', 20, 'icon--muted') + '</button>' +
            '</label>' +
            '<div id="place-list" class="place-list" aria-live="polite">' + initialList(kind, s) + '</div>' +
          '</div>';
      },

      mount(root) {
        const input = root.querySelector('#place-q');
        const clear = root.querySelector('[data-act=clear]');
        input.addEventListener('input', () => { clear.hidden = !input.value; search(kind, input.value); });
        input.addEventListener('keydown', ev => {
          if (ev.key === 'Enter') { ev.preventDefault(); if (items[0] && !items[0].locate && input.value) pick(kind, items[0]); }
        });
        input.focus();
      },

      actions: {
        close: () => GO.router.back(),
        clear(el) {
          const input = document.getElementById('place-q');
          input.value = ''; el.hidden = true; input.focus();
          search(kind, '');
        },
        pick(el) {
          const p = items[+el.getAttribute('data-i')];
          if (!p) return;
          if (p.locate) return locate(kind, el);
          pick(kind, p);
        },
      },
    };
  }

  async function search(kind, q) {
    const list = document.getElementById('place-list');
    const my = ++seq;
    clearTimeout(remoteTimer);
    if (remoteCtl) remoteCtl.abort();
    q = q.trim();
    if (!q) { list.innerHTML = initialList(kind, GO.store.get()); return; }

    const local = await api.searchLocal(q);
    if (my !== seq) return;
    items = local;
    draw(list, q, true);

    // Addresses from the geocoder, after a pause in typing
    remoteTimer = setTimeout(async () => {
      remoteCtl = new AbortController();
      try {
        const remote = await api.searchRemote(q, remoteCtl.signal);
        if (my !== seq) return;
        const seen = new Set(items.map(p => p.name.toLowerCase()));
        items = items.concat(remote.filter(p => !seen.has(p.name.toLowerCase()))).slice(0, 12);
      } catch (e) { if (e.name === 'AbortError') return; }
      if (my === seq) draw(list, q, false);
    }, 350);
  }

  function draw(list, q, pending) {
    const rows = items.map((p, i) => option(p, i, q)).join('');
    const status = pending && q.length >= 3 && navigator.onLine
      ? '<div class="place-list__status t-body-sm"><span class="spinner" aria-hidden="true"></span>Looking for addresses…</div>'
      : (!items.length ? '<div class="place-list__status t-body-sm">Nothing found. Try a street, hotel or airport.</div>' : '');
    list.innerHTML = rows + status;
  }

  async function locate(kind, el) {
    el.querySelector('.place-option__detail').textContent = 'Finding where you are…';
    el.setAttribute('aria-busy', 'true');
    const p = await api.locate();
    if (p) pick(kind, p);
  }

  function pick(kind, p) {
    const s = GO.store.get();
    const edit = GO.router.path().startsWith('/edit');
    if (kind === 'from') {
      GO.store.set({ from: p });
      if (!s.to && !edit) return GO.router.go('/to', { replace: true });
    } else {
      GO.store.set({ to: p });
      if ((!s.date || !s.time) && !edit) return GO.router.go('/when', { replace: true });
    }
    GO.router.back();
  }

  GO.screens.from = screen('from');
  GO.screens.to = screen('to');
  GO.screens['edit-from'] = screen('from', true);
  GO.screens['edit-to'] = screen('to', true);
})();
</script>
<script>
// Date & time — Streamline 14.10.2026: Flow 05 (2237:13459), Flow 06 selected (2237:13474), flight time (2237:13497),
// night 00:00 (2238:13028). The same sheet serves the return leg: Flow 05 return, pick-up time (2237:13718),
// Flow 07 - Return date & time - selected, flight time (2237:13750).
(function () {
  const u = GO.u;
  const ic = GO.icon;
  const api = GO.api;

  // Slider stops, minutes before the flight: 3h … 1h (10.10.2026). Default 2h.
  const BUFFERS = [180, 150, 120, 90, 60];
  const BUF_DEFAULT = 2;
  const BUF_LAST = BUFFERS.length - 1;
  // Message under the slider for each stop (Flight time - slider messages, 1982:3928): emoji, text
  const BUFFER_NOTES = [
    ['😴', 'Enough time to check in, find a quiet spot and even take a nap.'],
    ['☕️', '2h 30m before your flight, no need to rush, enjoy a coffee at the airport.'],
    ['😌', '2h before your flight, the ideal drop-off time.'],
    ['😑', '1h 30m before your flight. It can get tight if you check in a bag.'],
    ['🏃🏻', 'Only 1h before your flight. Check-in may already be closed, choose an earlier time.'],
  ];
  const MINUTES = ['00', '15', '30', '45'];
  // flights depart and land at any minute, pick-up after a flight too: steps of 5
  const MINUTES_5 = Array.from({ length: 12 }, (_, i) => u.pad(i * 5));
  const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  // pick-up after the flight lands: the hint suggests an hour (Return flight time, 2237:13750)
  const SAFE_AFTER_LANDING = 60;

  let d = null; // draft, committed on Confirm

  // State keys of a leg: date / retDate, timeMode / retTimeMode…
  function key(leg, name) { return leg === 'ret' ? 'ret' + name[0].toUpperCase() + name.slice(1) : name; }

  function initDraft(s, leg) {
    const k = name => s[key(leg, name)];
    const win = api.bookingWindow();
    const [h, m] = k('time') ? k('time').split(':') : ['', ''];
    const [fh, fm] = k('flightTime') ? k('flightTime').split(':') : ['', ''];
    const date = k('timeMode') === 'flight' && k('flightDate') ? k('flightDate') : k('date');
    const view = u.parseIso(date || (leg === 'ret' && s.date) || win.min);
    d = {
      leg, mode: k('timeMode') || 'dropoff', date: date || null,
      h, m, fh, fm, buf: k('bufferIdx') == null ? BUF_DEFAULT : Math.min(k('bufferIdx'), BUF_LAST),
      vy: view.getFullYear(), vm: view.getMonth(),
    };
    // return from the airport, flight time tab: the stored time is the landing
    if (leg === 'ret' && s.retLanding && s.retTime) { d.mode = 'flight'; [d.fh, d.fm] = s.retTime.split(':'); }
  }

  // The leg's route: the return goes the other way
  function route() {
    const s = GO.store.get();
    return d.leg === 'ret' ? { from: s.to, to: s.from } : { from: s.from, to: s.to };
  }
  function airportMode() { return api.isAirport(route().to); }
  // City to city (Flow 05 / 06 to Maribor, 1686:10844 / 1703:10849): drop-off time, no flight switch, no note
  function cityMode() { return !airportMode() && !api.isAirport(route().from); }
  // Return from the airport: the person types the pick-up time or the landing of the flight
  function landingMode() { return d.leg === 'ret' && api.isAirport(route().from); }
  function landingFlight() { return landingMode() && d.mode === 'flight'; }
  function flightMode() { return d.mode === 'flight' && airportMode() && !landingMode(); }
  // the selects hold the flight time (departure or landing), not the ride time
  function flightSelects() { return flightMode() || landingFlight(); }
  // what the ride's time means: drop-off at the destination or pick-up at the start
  function isPickup() { return landingMode() || (!airportMode() && !cityMode()); }

  // Result for the current draft: { date, time } or null
  function result() {
    if (!d.date) return null;
    if (flightMode()) {
      if (d.fh === '' || d.fm === '') return null;
      let min = u.toMin(d.fh + ':' + d.fm) - BUFFERS[d.buf];
      let date = d.date;
      if (min < 0) { min += 1440; date = u.addDays(date, -1); }
      return { date, time: u.fromMin(min) };
    }
    if (landingFlight()) {
      if (d.fh === '' || d.fm === '') return null;
      return { date: d.date, time: d.fh + ':' + d.fm };
    }
    if (d.h === '' || d.m === '') return null;
    return { date: d.date, time: d.h + ':' + d.m };
  }

  // Return before the first ride arrives (same day): '' or the arrival "HH:MM" of the first ride
  function clash() {
    const r = result();
    if (!r) return '';
    const s = GO.store.get();
    if (d.leg !== 'ret') return '';
    return api.returnClash(s, { date: s.date, time: s.time }, r);
  }

  function title() {
    const r = route();
    if (landingMode()) return 'Return ride from ' + api.shortName(r.from);
    if (cityMode()) return (d.leg === 'ret' ? 'Return drop-off at ' : 'Drop-off at ') + api.shortName(r.to);
    if (!airportMode()) return d.leg === 'ret' ? 'When do you need the return ride?' : 'When do you need the ride?';
    if (d.mode === 'flight') return 'When is your flight at ' + api.shortName(r.to) + '?';
    return (d.leg === 'ret' ? 'Return drop-off at ' : 'Drop-off at ') + api.shortName(r.to);
  }

  // Selects show only numbers: "10 : 15" (10.10.2026); empty ones read "Hour" / "Min", not dashes (Flow 05 2237:13459, 20.10.2026)
  // hint: the day is picked, the hour is next — pink border (as in Anya's desktop, 20.10.2026)
  function select(id, value, options, label, placeholder, hint) {
    return '<div class="select select--time"><label class="sr-only" for="' + id + '">' + label + '</label>' +
      '<select id="' + id + '" class="' + (value === '' ? 'is-empty' : '') + (hint ? ' is-next' : '') + '">' +
        '<option value="" disabled' + (value === '' ? ' selected' : '') + ' hidden>' + placeholder + '</option>' +
        options.map(o => '<option' + (o === value ? ' selected' : '') + '>' + o + '</option>').join('') +
      '</select>' + ic('chevron-down', 20) + '</div>';
  }

  // The return can't be before the departure day
  function minDate() {
    const win = api.bookingWindow();
    const s = GO.store.get();
    return d.leg === 'ret' && s.date && s.date > win.min ? s.date : win.min;
  }

  function calendar() {
    const win = api.bookingWindow();
    const lo = minDate();
    const first = new Date(d.vy, d.vm, 1);
    const lead = (first.getDay() + 6) % 7; // Monday first
    const days = new Date(d.vy, d.vm + 1, 0).getDate();
    const minD = u.parseIso(lo), maxD = u.parseIso(win.max);
    const today = u.today();
    // return: the departure day stays visible, pale pink (as in Anya's desktop, 20.10.2026)
    const dep = d.leg === 'ret' ? GO.store.get().date : null;
    const prevOff = d.vy < minD.getFullYear() || (d.vy === minD.getFullYear() && d.vm <= minD.getMonth());
    const nextOff = d.vy > maxD.getFullYear() || (d.vy === maxD.getFullYear() && d.vm >= maxD.getMonth());
    let cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(x => '<div class="calendar__dow" aria-hidden="true">' + x + '</div>').join('');
    for (let i = 0; i < lead; i++) cells += '<div></div>';
    for (let day = 1; day <= days; day++) {
      const iso = u.iso(new Date(d.vy, d.vm, day));
      const off = iso < lo || iso > win.max;
      const sel = iso === d.date;
      const dt = new Date(d.vy, d.vm, day);
      const cls = (iso === today ? ' is-today' : '') + (iso === dep && !sel ? ' is-departure' : '');
      cells += '<button class="calendar__day t-body' + cls + '" data-act="day" data-date="' + iso + '"' + (off ? ' disabled' : '') +
        ' aria-pressed="' + sel + '" aria-label="' + DOW_LONG[dt.getDay()] + ' ' + day + ' ' + u.MONTH[d.vm] + '"><span>' + day + '</span></button>';
    }
    return '<div class="calendar">' +
      '<div class="calendar__header">' +
        '<button class="icon-btn" data-act="month" data-dir="-1" aria-label="Previous month"' + (prevOff ? ' disabled' : '') + '>' + ic('chevron-left', 24) + '</button>' +
        '<div class="calendar__month t-label-lg" aria-live="polite">' + u.monthTitle(d.vy, d.vm) + '</div>' +
        '<button class="icon-btn" data-act="month" data-dir="1" aria-label="Next month"' + (nextOff ? ' disabled' : '') + '>' + ic('chevron-right', 24) + '</button>' +
      '</div>' +
      '<div class="calendar__grid">' + cells + '</div>' +
    '</div>';
  }

  function fieldLabel() {
    if (landingMode()) return d.mode === 'flight' ? 'Return flight time' : 'Pick-up time';
    if (flightMode()) return 'Flight time departure';
    return isPickup() ? 'Pick-up time' : 'Drop-off time';
  }

  // Label on the left, hour : minutes on the right (label row, 2237:13474)
  function timeField() {
    const hours = Array.from({ length: 24 }, (_, i) => u.pad(i));
    const fl = flightSelects();
    const label = fieldLabel();
    const hv = fl ? d.fh : d.h, mv = fl ? d.fm : d.m;
    const fine = fl || landingMode();
    return '<div class="time-field" role="group" aria-labelledby="t-label">' +
      '<span id="t-label" class="time-field__label t-label">' + label + '</span>' +
      select('t-hour', hv, hours, label + ', hour', 'Hour', !!d.date && hv === '') +
      '<span class="time-field__colon t-h3" aria-hidden="true">:</span>' +
      select('t-min', mv, fine ? MINUTES_5 : MINUTES, label + ', minutes', 'Min') +
    '</div>';
  }

  // zone of the slider (Anya's colours, 20.10.2026): green 3h…2h, yellow 1h 30m, red 1h; the message under it takes the zone colour too
  function bufferTone(i) { return i <= BUF_DEFAULT ? 'green' : i < BUF_LAST ? 'yellow' : 'red'; }
  // position of a stop on the track, as a fraction
  function stopAt(i) { return i / BUF_LAST; }

  function slider() {
    const ticks = BUFFERS.map((b, i) => {
      const pos = i === 0 ? '0' : i === BUF_LAST ? '100%' : 'calc(14px + (100% - 28px) * ' + stopAt(i) + ')';
      return '<span class="buffer__tick' + (i === d.buf ? ' is-on' : '') + '" style="left:' + pos + '">' + u.fmtDur(b) + '</span>';
    }).join('');
    return '<div class="buffer" style="' + bufferStyle() + '">' +
      '<div class="buffer__slider"><div class="buffer__track"></div>' +
        '<input id="t-buffer" type="range" min="0" max="' + BUF_LAST + '" step="1" value="' + d.buf + '" aria-label="Time at the airport before your flight" aria-valuetext="' + u.fmtDur(BUFFERS[d.buf]) + ' before the flight">' +
      '</div>' +
      '<div class="buffer__ticks" aria-hidden="true">' + ticks + '</div>' +
    '</div>';
  }
  function bufferStyle() {
    const tone = bufferTone(d.buf);
    return '--tone:var(--gauge-' + tone + ');--tick-color:var(--gauge-' + tone + '-text)';
  }

  // Grey hint (14.10.2026), without the pointer since 20.10.2026 (as in Anya's desktop).
  // inline: emoji inside the title — every hint now, the slider message too (same type as the grey ones, user 20.10.2026);
  // without it the emoji has its own column and the title is h3
  function hint(emoji, titleText, text, opts) {
    opts = opts || {};
    const head = opts.inline
      ? '<p class="hint__title t-label-lg"><span aria-hidden="true">' + emoji + '</span>  ' + u.esc(titleText) + '</p>'
      : '<p class="hint__title t-label-lg">' + u.esc(titleText) + '</p>';
    const style = opts.tone ? '--hint-bg:var(--gauge-' + opts.tone + '-bg);' : '';
    return '<div class="hint' + (opts.inline ? '' : ' hint--icon') + '" role="status"' + (style ? ' style="' + style + '"' : '') + '>' +
      (opts.inline ? '' : '<span class="hint__emoji" aria-hidden="true">' + emoji + '</span>') +
      '<div class="hint__body">' + head + '<p class="hint__text t-body-sm">' + text + '</p></div>' +
    '</div>';
  }

  // hint under the time selects
  function timeHint() {
    const r = result();
    if (landingMode()) {
      // editing the landing from the offers: no note (1719:13909)
      if (d.fromOffers) return '';
      if (d.mode !== 'flight') return hint('💡', 'How to choose pick-up time', 'Ideally 1 hour after your flight landing', { inline: true });
      if (!r) return '';
      return hint('😌', 'Pick-up time is around ' + u.fromMin(u.toMin(r.time) + SAFE_AFTER_LANDING), 'Safe time is 1 hour after your flight landing', { inline: true });
    }
    if (!r || cityMode() || flightMode()) return '';
    if (!airportMode()) return hint('😌', 'Pick-up at ' + r.time, 'We’ll confirm the exact pick-up time the day before.', { inline: true });
    return hint('😌', 'Drop-off at ' + (route().to.city || route().to.name) + ' at ' + r.time, 'Your flight should depart at ' + u.fromMin(u.toMin(r.time) + 120) + ' or later.', { inline: true });
  }

  // flight early in the morning: the drop-off falls on the day before (2238:13028)
  function nightNote() {
    const r = result();
    if (!flightMode() || !r || r.date === d.date) return '';
    const prev = u.fmtDay(r.date), next = u.fmtDay(d.date);
    const sameMonth = prev.slice(-3) === next.slice(-3);
    return '<p class="night-note t-body-sm c-secondary" role="status">Night between <b>' + u.esc(sameMonth ? prev.slice(0, -4) : prev) + '</b> and <b>' + u.esc(next) + '</b><br>Double-check the selected date of your transport.</p>';
  }

  // yellow plate: the return would start before the first ride arrives — the person has to change the time or the day
  function clashNote() {
    const at = clash();
    if (!at) return '';
    return hint('⚠️', 'Your first ride arrives at ' + at, 'Choose a later time for the return, or another day.', { inline: true, tone: 'warn' });
  }

  // message under the slider: where and when we drop off, and how the time feels
  function bufferNote() {
    const r = result();
    if (!flightMode() || !r) return '';
    const [emoji, text] = BUFFER_NOTES[d.buf];
    const place = route().to;
    return hint(emoji, 'Drop-off at ' + (place.city || api.shortName(place)) + ' at ' + r.time, text, { inline: true, tone: bufferTone(d.buf) });
  }

  function footer() {
    const r = result();
    // the button names the time we book, not its value (15.10.2026, 19.10.2026)
    return '<button class="btn btn--primary" data-act="confirm"' + (r && !clash() ? '' : ' disabled') + '>' +
      (isPickup() ? 'Confirm pick-up time' : 'Confirm drop-off time') + '</button>';
  }

  function body() {
    const seg = airportMode() || landingMode()
      ? '<div class="segmented" role="radiogroup" aria-label="What time do you know?">' +
          '<button class="segment" role="radio" data-act="mode" data-mode="dropoff" aria-checked="' + (d.mode !== 'flight') + '">' + ic('car', 16) + '<span>' + (landingMode() ? 'Pick-up time' : 'Drop-off time') + '</span></button>' +
          '<button class="segment" role="radio" data-act="mode" data-mode="flight" aria-checked="' + (d.mode === 'flight') + '">' + ic('plane', 16) + '<span>Flight time</span></button>' +
        '</div>'
      : '';
    const s = GO.store.get();
    const remove = d.leg === 'ret' && !d.fromOffers && s.retDate && s.retTime
      ? '<button class="link t-label when-remove" data-act="remove-return">Remove return ride</button>' : '';
    // right under the title, not after the hint where it got lost (user, 20.10.2026)
    return remove + seg + calendar() + timeField() +
      '<div id="when-night">' + nightNote() + '</div>' +
      // the slider only makes sense once the flight time is picked (decision 20.10.2026)
      (flightMode() && result() ? slider() : '') +
      '<div id="when-alert">' + (clashNote() || (flightMode() ? bufferNote() : timeHint())) + '</div>';
  }

  function update(focusId) {
    const sheet = document.querySelector('.sheet');
    const b = sheet.querySelector('.sheet__body');
    const top = b.scrollTop;
    sheet.querySelector('#sheet-title').textContent = title();
    b.innerHTML = body();
    b.scrollTop = top;
    sheet.querySelector('.cta-bar').innerHTML = footer();
    bind(sheet);
    if (focusId) { const el = sheet.querySelector(focusId); if (el) el.focus(); }
  }

  // Only the parts that depend on the slider, so dragging is not interrupted
  function updateBuffer() {
    const sheet = document.querySelector('.sheet');
    const box = sheet.querySelector('.buffer');
    box.setAttribute('style', bufferStyle());
    box.querySelectorAll('.buffer__tick').forEach((t, i) => t.classList.toggle('is-on', i === d.buf));
    sheet.querySelector('#t-buffer').setAttribute('aria-valuetext', u.fmtDur(BUFFERS[d.buf]) + ' before the flight');
    sheet.querySelector('#when-night').innerHTML = nightNote();
    sheet.querySelector('#when-alert').innerHTML = bufferNote();
    sheet.querySelector('.cta-bar').innerHTML = footer();
  }

  function bind(root) {
    const fl = flightSelects();
    const hour = root.querySelector('#t-hour'), min = root.querySelector('#t-min');
    hour.addEventListener('change', () => {
      if (fl) d.fh = hour.value; else d.h = hour.value;
      // picking the hour first: preselect :00 so the button becomes active
      if (fl && d.fm === '') d.fm = '00'; else if (!fl && d.m === '') d.m = '00';
      update('#t-hour');
    });
    min.addEventListener('change', () => { if (fl) d.fm = min.value; else d.m = min.value; update('#t-min'); });
    const range = root.querySelector('#t-buffer');
    if (range) range.addEventListener('input', () => { d.buf = +range.value; updateBuffer(); });
  }

  // fromOffers: the same sheet as a bottom sheet over the offers (Flow 08 - Offers - Return - sheet - Change date & time, 1719:13909)
  // edit: full-height sheet from Edit search (2303:6137), over the offers, back to the form on confirm
  function sheet(leg, fromOffers, edit) {
    return {
      overlay: true,
      base: edit ? () => GO.editBase() : fromOffers ? (leg === 'ret' ? 'offers-return' : 'offers') : null,
      sheetClass: fromOffers ? 'sheet--bottom' : '',
      render(s) {
        initDraft(s, leg);
        d.fromOffers = !!fromOffers;
        return '' +
          '<header class="sheet-header">' +
            '<div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">' + u.esc(title()) + '</h2></div>' +
            '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button>' +
          '</header>' +
          '<div class="sheet__body sheet__body--gap16 when-body">' + body() + '</div>' +
          '<div class="cta-bar">' + footer() + '</div>';
      },
      mount(root) { bind(root); },
      actions: {
        close: () => GO.router.back(),
        mode(el) { d.mode = el.getAttribute('data-mode'); update('[data-mode=' + d.mode + ']'); },
        month(el) {
          d.vm += +el.getAttribute('data-dir');
          if (d.vm < 0) { d.vm = 11; d.vy--; } else if (d.vm > 11) { d.vm = 0; d.vy++; }
          update();
        },
        day(el) { d.date = el.getAttribute('data-date'); update('[data-date="' + d.date + '"]'); },
        'remove-return'() {
          GO.store.set({ retDate: null, retTime: null, retFlightDate: null, retFlightTime: null, retLanding: false });
          GO.router.back();
        },
        confirm() {
          const r = result();
          if (!r) return;
          const flight = flightMode();
          const k = name => key(d.leg, name);
          const patch = {};
          patch[k('date')] = r.date;
          patch[k('time')] = r.time;
          patch[k('timeMode')] = flight || landingFlight() ? 'flight' : 'dropoff';
          patch[k('flightDate')] = flight ? d.date : null;
          patch[k('flightTime')] = flight ? d.fh + ':' + d.fm : null;
          patch[k('bufferIdx')] = d.buf;
          // return from the airport: retLanding = the time is the landing, offers count the pick-up from it (as on the site)
          if (d.leg === 'ret') patch.retLanding = landingFlight();
          // a new departure day after the return makes the return invalid
          const s = GO.store.get();
          if (d.leg === 'out' && s.retDate && (s.retDate < r.date || api.returnClash(s, r, { date: s.retDate, time: s.retTime })))
            Object.assign(patch, { retDate: null, retTime: null });
          if (d.leg === 'ret' && clash()) return;
          if (d.leg === 'out' && s.retDate && patch.retDate === null) u.toast('Your return was before this ride, so we removed it. Add it again.');
          GO.store.set(patch);
          GO.router.back();
        },
      },
    };
  }

  GO.screens.when = sheet('out');
  GO.screens['when-return'] = sheet('ret');
  GO.screens['offers-when'] = sheet('out', true);
  GO.screens['offers-when-return'] = sheet('ret', true);
  GO.screens['edit-when'] = sheet('out', false, true);
  GO.screens['edit-when-return'] = sheet('ret', false, true);
})();
</script>
<script>
// Edit search — Streamline 14.10.2026, section Edit search 2303:5283: the pencil on Offers opens the whole search
// as a full-height sheet over the offers (2303:5617, outlined form), its fields open full-height sheets of their own
// (Where from 2303:5815, Where to, Date & time 2303:6137) and come back to it (2306:6259, 2306:6823, 2303:6166).
// Changes stay in the state while editing; closing without "Update search" puts the old search back.
(function () {
  const { esc, fmtDay } = GO.u;
  const ic = GO.icon;
  const MAX_PAX = 8;
  const KEYS = ['from', 'to', 'date', 'time', 'timeMode', 'flightDate', 'flightTime', 'bufferIdx', 'adults', 'children',
    'retDate', 'retTime', 'retTimeMode', 'retFlightDate', 'retFlightTime', 'retBufferIdx', 'retLanding'];

  // Called by the pencil: remember the search and the offers screen underneath
  GO.editSearch = function (base) {
    const s = GO.store.get();
    const snap = {};
    KEYS.forEach(k => { snap[k] = s[k]; });
    GO.store.set({ editSnap: snap, editBase: base });
    GO.router.go('/edit');
  };
  // Back on the offers without "Update search": the old search returns
  GO.editRestore = function () {
    const s = GO.store.get();
    if (s.editSnap) GO.store.set(Object.assign({}, s.editSnap, { editSnap: null }));
  };
  const base = () => GO.store.get().editBase || 'offers';
  GO.editBase = base;

  function cell(act, label, value, iconName, cls) {
    return '<button class="edit-cell' + (cls ? ' ' + cls : '') + '" data-act="' + act + '">' + (iconName ? ic(iconName, 24) : '') +
      '<span class="booking__text"><span class="booking__label">' + label + '</span>' +
      '<span class="booking__value ellipsis' + (value ? '' : ' is-empty') + '">' + esc(value || 'Address, hotel or airport') + '</span></span></button>';
  }

  function stepper(kind, label, value, min, canAdd) {
    const id = 'edit-' + kind;
    return '<div class="pax-stepper" role="group" aria-labelledby="' + id + '">' +
      '<span id="' + id + '" class="booking__label">' + label + '</span>' +
      '<span class="stepper">' +
        '<button class="stepper__btn" data-act="pax" data-kind="' + kind + '" data-d="-1" aria-label="Fewer ' + label.toLowerCase() + '"' + (value <= min ? ' disabled' : '') + '>' + ic('minus', 20) + '</button>' +
        '<span class="stepper__value t-label-lg" aria-live="polite">' + value + '</span>' +
        '<button class="stepper__btn" data-act="pax" data-kind="' + kind + '" data-d="1" aria-label="More ' + label.toLowerCase() + '"' + (canAdd ? '' : ' disabled') + '>' + ic('plus', 20) + '</button>' +
      '</span></div>';
  }

  function form(s) {
    const room = s.adults + s.children < MAX_PAX;
    const ret = s.retDate && s.retTime;
    return '<div class="edit-form">' +
      '<div class="edit-box edit-route">' +
        cell('pick-from', 'From', s.from && s.from.name, 'waving', 'edit-cell--from') +
        '<span class="edit-divider" aria-hidden="true"></span>' +
        cell('pick-to', 'To', s.to && s.to.name, 'map-pin') +
        '<button class="booking__swap edit-swap" data-act="swap" aria-label="Swap From and To">' + ic('swap', 16) + '</button>' +
      '</div>' +
      '<div class="edit-box edit-dates">' +
        '<button class="edit-cell edit-cell--date" data-act="pick-when"><span class="booking__text"><span class="booking__label">Date</span>' +
          '<span class="booking__value ellipsis">' + esc(s.date && s.time ? fmtDay(s.date) + ', ' + s.time : 'Choose a date') + '</span></span></button>' +
        '<span class="edit-divider edit-divider--v" aria-hidden="true"></span>' +
        (ret
          ? '<button class="edit-cell" data-act="return"><span class="booking__text"><span class="booking__label">Return</span><span class="booking__value ellipsis">' + esc(fmtDay(s.retDate) + ', ' + s.retTime) + '</span></span></button>'
          : '<button class="edit-cell" data-act="return"><span class="booking__text"><span class="booking__value is-empty">Return</span></span></button>') +
      '</div>' +
      '<div class="edit-box edit-pax">' +
        '<div class="edit-pax__row">' +
          stepper('adults', 'Adults', s.adults, 1, room) +
          '<span class="edit-divider edit-divider--v edit-divider--short" aria-hidden="true"></span>' +
          stepper('children', 'Children', s.children, 0, room) +
        '</div>' +
        // inside the passengers box, under the steppers (as in Anya's desktop, 20.10.2026)
        (s.children ? '<p class="pax-note t-body-sm">Child seats included for free</p>' : '') +
      '</div>' +
    '</div>';
  }

  GO.screens.edit = {
    overlay: true, base,
    render(s) {
      return '' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Edit search</h2></div>' +
          '<button class="icon-btn" data-act="close" aria-label="Close without changes">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body edit-body">' + form(s) + '</div>' +
        '<div class="cta-bar"><button class="btn btn--primary" data-act="update"' + (s.from && s.to && s.date && s.time ? '' : ' disabled') + '>Update search</button></div>';
    },
    actions: {
      close() { GO.editRestore(); GO.router.back(); },
      'pick-from': () => GO.router.go('/edit/from'),
      'pick-to': () => GO.router.go('/edit/to'),
      'pick-when': () => GO.router.go('/edit/when'),
      return: () => GO.router.go('/edit/return'),
      swap() {
        const s = GO.store.get();
        GO.store.set({ from: s.to, to: s.from });
        redraw('[data-act=swap]');
      },
      pax(el) {
        const s = GO.store.get();
        const k = el.dataset.kind, dlt = +el.dataset.d;
        const next = s[k] + dlt;
        if (next < (k === 'adults' ? 1 : 0) || (dlt > 0 && s.adults + s.children >= MAX_PAX)) return;
        GO.store.set({ [k]: next });
        redraw();
        const same = document.querySelector('.edit-pax [data-kind=' + k + '][data-d="' + dlt + '"]');
        (same && !same.disabled ? same : document.querySelector('.edit-pax [data-kind=' + k + '][data-d="' + -dlt + '"]')).focus();
      },
      // the offers underneath load the new search (the selection resets with the new search key)
      update() {
        GO.store.set({ editSnap: null });
        GO.router.back();
      },
    },
  };

  // Redraw the sheet in place: the base offers stay as they are until the search is updated
  function redraw(focusSel) {
    const sheet = document.querySelector('.sheet');
    if (!sheet) return;
    sheet.innerHTML = GO.screens.edit.render(GO.store.get());
    if (focusSel) { const el = sheet.querySelector(focusSel); if (el) el.focus(); }
  }
})();
</script>
<script>
// Offers — Streamline, section Offers 1529:82164.
// One-way: variant A (All 1529:80883, Private 1529:81232).
// Round trip: the same variant A with Departure / Return tabs (Streamline 14.10: 2237:13957, 2237:14290, 2237:14636; 20.10.2026).
// The card shows the price per person for shared rides and per vehicle for private, as in those frames; the bar sums the group.
// Sheets: about the ride type (1573:10890 shared, 1573:11312 private), about this offer (1579:10601, 1579:11106),
// Add your house number for a street picked without one (2320:29071).
(function () {
  const u = GO.u;
  const { esc, fmtDay, fromMin, fmtDur } = u;
  const ic = GO.icon;
  const api = GO.api;

  // ---------- formatting ----------
  // "Ljubljana", "Venice Airport": addresses go by city, airports without the code
  function placeLabel(p) {
    if (!p) return '';
    if (p.type === 'airport') return api.shortName(p).replace(/\s*\([A-Z]{3}\)$/, '');
    return p.city || p.name;
  }
  // header only: a street without a house number goes by the street, so the reason for the house number sheet shows (2258:12892)
  function headLabel(p) { return p && p.noNumber && p.street ? p.street : placeLabel(p); }
  function routeLabel(q) { return headLabel(q.from) + ' → ' + headLabel(q.to); }
  function whenLabel(q, data) {
    if (q.landing) return fmtDay(q.date) + ', flight lands ' + q.time;
    return fmtDay(q.date) + (data && !data.dropBy ? ', pick-up at ' : ', latest drop-off by ') + q.time;
  }
  function paxLabel(s) {
    const a = s.adults + ' adult' + (s.adults > 1 ? 's' : '');
    return s.children ? a + ', ' + s.children + ' child' + (s.children > 1 ? 'ren' : '') : a;
  }
  function money(n) { return (Number.isInteger(n) ? n : n.toFixed(2)) + ' €'; }
  function money2(n) { return n.toFixed(2) + ' €'; }
  function pickLabel(o) { return o.kind === 'flex' ? fromMin(o.pickFrom) + '–' + fromMin(o.pickTo) : fromMin(o.pickFrom); }
  function typeLabel(o) {
    if (o.kind === 'private') return 'No other passengers in the car'; // every private card (decision 20.10.2026)
    return o.kind === 'flex' ? 'Flexible pick-up time' : 'Exact pick-up time';
  }
  function offerTitle(o) {
    if (o.kind === 'private') return o.refundable ? 'Private, refundable' : 'Private';
    return o.kind === 'flex' ? 'Shared, flexible pick-up time' : 'Shared, exact pick-up time';
  }
  function shortTitle(o) {
    if (o.kind === 'private') return o.refundable ? 'Private, refundable' : 'Private';
    return o.kind === 'flex' ? 'Shared, flexible ' + fmtDur(o.window) : 'Shared, exact time';
  }
  function badgeTone(o) {
    if (o.soldOut) return 'error';
    if (o.badge === 'Cheapest') return 'success';
    return o.tone || 'neutral';
  }
  function badge(o, isSel) {
    return o.badge ? '<span class="badge badge--' + badgeTone(o) + (isSel && o.badge === 'Cheapest' ? ' badge--solid' : '') + '">' + esc(o.badge) + '</span>' : '';
  }

  // ---------- context of a leg ----------
  function isRound(s) { return !!(s.retDate && s.retTime); }
  function ctx(leg) {
    const s = GO.store.get();
    const q = api.legSearch(s, leg);
    const data = q.from && q.to && q.date && q.time ? api.offersCached(q) : null;
    return { leg, s, q, data, round: isRound(s), sel: s.sel[leg] };
  }
  function setSel(leg, patch) {
    const sel = Object.assign({}, GO.store.get().sel);
    sel[leg] = Object.assign({}, sel[leg], patch);
    GO.store.set({ sel });
  }

  // ---------- selection ----------
  function allOffers(data) { return data.shared.concat(data.priv, data.empty ? data.empty.alternatives : []); }
  function defaultOffer(data) {
    if (data.empty) return null;
    const cheapest = data.shared.find(o => o.cheapest);
    return (cheapest || data.priv[0] || {}).id || null;
  }
  // A new search starts with the cheapest ride picked and the filter on All
  function syncSelection(c) {
    if (!c.data || c.sel.key === c.data.key) return;
    setSel(c.leg, { key: c.data.key, id: defaultOffer(c.data), filter: 'all' });
    Object.assign(c, ctx(c.leg));
  }
  function selected(c) {
    if (!c.data || !c.sel.id || c.sel.key !== c.data.key) return null;
    return allOffers(c.data).find(o => o.id === c.sel.id && !o.soldOut) || null;
  }
  // Picked offer of the other leg (for round-trip totals); its offers may not be loaded yet
  function pickedOf(leg) {
    const c = ctx(leg);
    return c.data ? (syncSelection(c), selected(c)) : null;
  }

  // ---------- pieces ----------
  // No check mark on Departure once it is chosen (2237:14290)
  function legTabs(c) {
    const tab = (leg, label) =>
      '<button class="leg-tab" role="tab" data-act="leg" data-leg="' + leg + '" aria-selected="' + (c.leg === leg) + '">' +
        '<span class="leg-tab__title">' + label + '</span></button>';
    return '<div class="leg-tabs" role="tablist" aria-label="Legs">' + tab('out', 'Departure') + tab('ret', 'Return') + '</div>';
  }

  function header(c) {
    return '<div class="offers-top">' +
      (c.round ? legTabs(c) : '') +
      '<header class="offers-header">' +
        '<button class="icon-btn" data-act="back" aria-label="Back">' + ic('chevron-left', 24) + '</button>' +
        '<div class="search-summary">' +
          '<div class="search-summary__text">' +
            '<h1 class="t-label-lg ellipsis">' + esc(routeLabel(c.q)) + '</h1>' +
            '<div class="search-summary__meta t-body-sm c-secondary"><span>' + esc(c.q.date ? whenLabel(c.q, c.data) : '') + '</span><span>' + esc(paxLabel(c.s)) + '</span></div>' +
          '</div>' +
          '<button class="icon-btn" data-act="edit" aria-label="Change date and time">' + ic('edit', 24) + '</button>' +
        '</div>' +
      '</header>' +
    '</div>';
  }

  function filterTabs(c) {
    const data = c.data;
    const fromPrice = list => {
      const ok = list.filter(o => !o.soldOut);
      return ok.length ? 'from ' + money(Math.min.apply(null, ok.map(cardPrice))) : 'none';
    };
    const count = data.shared.concat(data.priv).filter(o => !o.soldOut).length;
    const tab = (id, label, note) =>
      '<button class="filter-tab" data-act="filter" data-filter="' + id + '" aria-pressed="' + (c.sel.filter === id) + '">' +
        '<span class="t-label">' + label + '</span><span class="t-caption c-secondary">' + note + '</span></button>';
    return '<div class="filter-tabs" role="group" aria-label="Ride type">' +
      tab('all', 'All', count + ' ride' + (count === 1 ? '' : 's')) +
      tab('shared', 'Shared', fromPrice(data.shared)) +
      tab('private', 'Private', fromPrice(data.priv)) +
    '</div>';
  }

  function stops(q, o) {
    return '<div class="offer__route">' +
      '<div class="rail" aria-hidden="true"><span class="rail__dot"></span><span class="rail__line"></span><span class="rail__dot"></span></div>' +
      '<div class="offer__stops">' +
        '<div class="offer__stop">' + '<span class="t-label-lg nowrap">' + pickLabel(o) + '</span>' + '<span class="t-body">' + esc(placeLabel(q.from)) + '</span></div>' +
        '<div class="offer__stop"><span class="t-label-lg nowrap">' + fromMin(o.arrival) + '</span><span class="t-body">' + esc(placeLabel(q.to)) + '</span></div>' +
      '</div>' +
    '</div>';
  }

  // The cheapest shared ride shows a 3h ride time
  function rideDur(o) { return o.cheapest ? 180 : o.dur; }

  // Pick-up window length: 1h / 2h / 3h from the same start, each with its own price
  function winSelect(o) {
    // closed: only the window; the prices show in the open list (the select is an invisible layer over the label)
    return '<span class="offer__win"><span class="offer__win-label t-label-lg" aria-hidden="true">' + fromMin(o.pickFrom) + '–' + fromMin(o.pickTo) + '</span><select class="t-label-lg" data-win data-id="' + o.id + '" aria-label="Pick-up window">' +
      o.wins.map(x => '<option value="' + x.w + '"' + (x.w === o.window ? ' selected' : '') + '>' + fromMin(o.pickFrom) + '–' + fromMin(o.pickFrom + x.w) + ' · ' + money(x.unit) + '</option>').join('') +
    '</select>' + ic('chevron-down', 16) + '</span>';
  }

  // Shared: price per person, private: per vehicle (2237:13957)
  function cardPrice(o) { return o.kind === 'private' ? o.total : o.unit; }
  function unitLabel(o) { return o.kind === 'private' ? 'per vehicle' : 'per person'; }

  function price(o) {
    const n = cardPrice(o);
    return '<div class="offer__price">' +
      '<div class="offer__amount"><span class="offer__num">' + (Number.isInteger(n) ? n : n.toFixed(2)) + '</span><span class="offer__cur" style="margin-left: 2px">€</span>' +
        '<span class="offer__per" aria-label="' + unitLabel(o) + '">/' + ic('user', 16, 'icon--disabled') + '</span></div>' +
    '</div>';
  }

  function hit(o, isSel) {
    const aria = [shortTitle(o), 'pick-up ' + pickLabel(o), 'arrives ' + fromMin(o.arrival), money(cardPrice(o)) + ' ' + unitLabel(o), o.badge || ''].filter(Boolean).join(', ');
    return '<button class="offer__hit" role="radio" aria-checked="' + isSel + '" data-act="pick" data-id="' + o.id + '" aria-label="' + esc(aria) + '"' + (o.soldOut ? ' disabled' : '') + '></button>';
  }
  function infoBtn(o) {
    return o.soldOut ? '' : '<button class="icon-btn offer__info" data-act="info" data-id="' + o.id + '" aria-label="About this ride: ' + esc(shortTitle(o)) + '">' + ic('info-outline', 24, 'icon--muted') + '</button>';
  }

  // Variant A: route rail with places, price on the right, ride type and (i) below
  function cardA(c, o, isSel, extra) {
    return '<div class="offer' + (isSel ? ' is-selected' : '') + (o.soldOut ? ' is-off' : '') + '">' + hit(o, isSel) +
      badge(o, isSel) +
      // content (gap 8): body, then footer with captions (body-sm, one style) and (i) on the first line
      '<div class="offer__content">' +
        // selected: no type line, the (i) sits under the price so the card keeps its height
        '<div class="offer__body">' + stops(c.q, o) + (isSel ? price(o).replace(/<\/div>$/, infoBtn(o) + '</div>') : price(o)) + '</div>' +
        (o.soldOut ? '<div class="offer__type t-body-sm c-secondary"><span>No seats left for this window.</span></div>' : '') +
        (extra || '') +
        (isSel && !o.soldOut ? refundIn(c, o) : '') +
      '</div>' +
    '</div>';
  }

  function card(c, o, isSel) { return cardA(c, o, isSel); }

  // v2: one Shared card. Exact time and the 1h / 2h / 3h windows are variants of it, picked on a segmented scale
  function sharedOpts(list) {
    const opts = [];
    const fx = list.find(o => o.kind === 'fixed');
    if (fx) opts.push({ id: fx.id, w: 0, label: 'Exact', unit: fx.unit, soldOut: fx.soldOut });
    list.filter(o => o.wins).forEach(o => o.wins.forEach(x => opts.push({ id: o.id, w: x.w, label: (x.w / 60) + 'h', unit: x.unit, soldOut: o.soldOut })));
    return opts;
  }
  function sharedShown(c, list, selId) {
    const ok = list.filter(o => !o.soldOut);
    return ok.find(o => o.id === selId) || ok.find(o => o.id === GO.store.get().sharedVar) || ok.find(o => o.wins) || ok[0] || list[0];
  }
  function sharedCard(c, list, selId) {
    const o = sharedShown(c, list, selId);
    const opts = sharedOpts(list);
    const isOn = x => x.id === o.id && (o.wins ? x.w === o.window : true);
    const seg = opts.length > 1 ? '<div class="shv">' +
        '<div class="shv__head t-caption c-secondary"><span>Exact time</span><span>More flexible, lower price</span></div>' +
        '<div class="shv__opts" role="radiogroup" aria-label="Pick-up time">' + opts.map(x =>
          '<button class="shv__opt" role="radio" aria-checked="' + isOn(x) + '" data-act="shvar" data-id="' + x.id + '" data-w="' + x.w + '"' + (x.soldOut ? ' disabled' : '') +
            ' aria-label="' + (x.w ? 'Pick-up window ' + x.label : 'Exact pick-up time') + ', ' + (x.soldOut ? 'sold out' : money(x.unit) + ' per person') + '">' +
            '<span class="t-label">' + x.label + '</span><span class="t-caption">' + (x.soldOut ? 'Sold out' : money(x.unit)) + '</span></button>').join('') +
        '</div></div>' : '';
    return cardA(c, o, o.id === selId, seg);
  }

  // 100% Money refund, attached to the selected card: it covers the ride(s) picked
  function refundIn(c, o) {
    let base = o.total;
    if (c.round) { const other = pickedOf(c.leg === 'out' ? 'ret' : 'out'); if (other) base += other.total; }
    const on = !!GO.store.get().refund;
    return '<div class="offer__refund"><button class="refund-row" role="switch" aria-checked="' + on + '" data-act="refund">' +
      '<span class="refund-row__text"><span class="t-label">100% Money refund</span><span class="t-caption c-secondary">Cancel up to 48h before the transfer</span></span>' +
      '<span class="t-label nowrap">+' + money2(Math.round(base * 15) / 100) + '</span>' +
      '<span class="toggle" aria-hidden="true"><span class="toggle__knob"></span></span>' +
    '</button></div>';
  }

  // "from €23": the lowest price in the group, window options included
  function groupFrom(list) {
    const p = [];
    list.filter(o => !o.soldOut).forEach(o => { if (o.wins) o.wins.forEach(x => p.push(x.unit)); else p.push(cardPrice(o)); });
    return p.length ? '<span class="c-secondary nowrap t-body-sm" style="font-weight: var(--font-weight-regular); flex-shrink: 0; position: relative; top: 2px">from ' + money(Math.min.apply(null, p)) + '</span>' : '';
  }

  function group(c, kind, list, selId) {
    if (!list.length) return '';
    const shared = kind === 'shared';
    return '<section class="offer-group" aria-labelledby="g-' + kind + '">' +
      '<div class="offer-group__head">' +
        '<h2 id="g-' + kind + '" class="offer-group__title t-h3">' + (shared ? ic('shuttle', 24) : ic('car', 22.8).replace('<svg', '<svg style="position: relative; top: -1px"')) + (shared ? 'Shared transfer' + groupFrom(list) : 'Private transfer') + '</h2>' +
        '<button class="link t-label" style="color: var(--color-text-tertiary); font-weight: var(--font-weight-regular)" data-act="about" data-kind="' + kind + '">' + (shared ? 'How it works' : 'What’s included') + '</button>' +
      '</div>' +
      '<div class="offer-group__list" role="radiogroup" aria-labelledby="g-' + kind + '">' + (shared ? sharedCard(c, list, selId) : list.map(o => card(c, o, o.id === selId)).join('')) + '</div>' +
    '</section>';
  }

  function checkItem(icon, text) {
    return '<li class="check-item">' + ic(icon, 20, 'icon--success') + '<span class="t-body-sm">' + text + '</span></li>';
  }

  function trust(filter) {
    if (filter === 'private') {
      return '<section class="trust-card" aria-labelledby="trust-title"><h2 id="trust-title" class="t-label-lg">Every private ride</h2><ul class="check-list">' +
        checkItem('water', 'Bottled water for every passenger') +
        checkItem('child-seat', 'Child seats at no extra cost') +
        checkItem('suitcase', 'No luggage fees — the vehicle is all yours') +
        checkItem('store', 'One short stop on the way is included') +
      '</ul></section>';
    }
    return '<section class="trust-card" aria-label="Every GoOpti ride" style="padding-block: var(--space-16)"><ul class="check-list">' +
      checkItem('check-circle', 'Free cancellation within 24h of booking') +
      checkItem('check-circle', 'Exact pick-up time by SMS &amp; mail the day before transfer') +
    '</ul></section>';
  }

  // 100% Money refund package, after Private transfer: a quiet toggle row, priced at 15% of the picked ride(s)
  function refundPkg(c, o) {
    let base = o ? o.total : 0;
    if (o && c.round) { const other = pickedOf(c.leg === 'out' ? 'ret' : 'out'); if (other) base += other.total; }
    const on = !!GO.store.get().refund;
    return '<button class="refund-row" role="switch" aria-checked="' + on + '" data-act="refund"' + (o ? '' : ' disabled') + '>' +
      '<span class="refund-row__text"><span class="t-label">100% Money refund</span><span class="t-caption c-tertiary">Cancel up to 48h before the transfer</span></span>' +
      (o ? '<span class="t-label nowrap">+' + money2(Math.round(base * 15) / 100) + '</span>' : '') +
      '<span class="toggle" aria-hidden="true"><span class="toggle__knob"></span></span>' +
    '</button>';
  }

  function emptyState(c) {
    const q = c.q, e = c.data.empty;
    const text = e.reason === 'early'
      ? 'To reach ' + esc(placeLabel(q.to)) + ' by ' + q.time + ', the ride would have to leave before 03:00. We don’t pick up that early.'
      : 'All rides from ' + esc(placeLabel(q.from)) + ' that reach ' + esc(placeLabel(q.to)) + ' by ' + q.time + ' on ' + fmtDay(q.date) + ' are booked.';
    return '<div class="empty-state">' +
        '<span class="empty-state__icon">' + ic('clock', 24, 'icon--muted') + '</span>' +
        '<h2 class="t-h3">No rides at this time</h2>' +
        '<p class="t-body c-secondary">' + text + '</p>' +
      '</div>' +
      '<section class="offer-group" aria-labelledby="g-alt">' +
        '<div><h2 id="g-alt" class="t-h3">But you can get these rides on ' + fmtDay(q.date) + '</h2>' +
        '<p class="t-body-sm c-secondary">Check that it still works for your flight.</p></div>' +
        '<div class="offer-group__list" role="radiogroup" aria-labelledby="g-alt">' + e.alternatives.map(o => card(c, o, o.id === c.sel.id)).join('') + '</div>' +
      '</section>' +
      '<div class="empty-actions">' +
        '<p class="t-body c-secondary">Or try another time or date:</p>' +
        '<button class="btn btn--primary" data-act="change-when">Change time</button>' +
        '<button class="btn btn--secondary" data-act="change-when">Change date</button>' +
      '</div>';
  }

  // Bottom bar. One-way: total + Continue. Round trip, Departure: departure total + "Choose return ride";
  // Return: both rides + one fee, Continue (Flow 08 - Offers - Departure / Return).
  function ctaBar(c, o) {
    if (c.data.empty && !o) return '';
    if (!o) return '<div class="cta-bar"><button class="btn btn--primary" disabled>Choose a ride</button></div>';
    let sum = o.total, note = paxLabel(c.s) + ', incl. ' + money2(c.data.fee) + ' transaction fee';
    let label = 'Continue', act = 'continue';
    if (c.round) {
      const other = pickedOf(c.leg === 'out' ? 'ret' : 'out');
      if (c.leg === 'out') {
        note = 'Departure, ' + note;
        label = 'Choose return ride'; act = 'to-return';
      } else if (other) {
        sum += other.total;
        note = '2 rides, ' + note;
      } else {
        note = 'Return, ' + note;
        label = 'Choose departure ride'; act = 'to-departure';
      }
    }
    if (GO.store.get().refund) { sum += Math.round(sum * 15) / 100; note += ', 100% Money refund'; }
    return '<div class="cta-bar cta-bar--total">' +
      '<div class="total-row">' +
        '<div class="total-row__text">' +
          '<div class="total-row__label"><span class="t-label-lg">Total</span><button class="link t-caption" data-act="total">Show details</button></div>' +
          '<div class="t-caption c-tertiary">' + esc(note) + '</div>' +
        '</div>' +
        '<div class="t-h2 nowrap" aria-live="polite">' + money2(sum + c.data.fee) + '</div>' +
      '</div>' +
      '<button class="btn btn--primary" data-act="' + act + '">' + label + '</button>' +
    '</div>';
  }

  function skeleton() {
    const card = '<div class="offer offer--skeleton" aria-hidden="true"><span class="sk sk--w60"></span><span class="sk sk--w40"></span><span class="sk sk--w70"></span></div>';
    return '<div class="filter-tabs" aria-hidden="true"><span class="sk sk--tab"></span><span class="sk sk--tab"></span><span class="sk sk--tab"></span></div>' +
      '<div class="offer-group" role="status"><span class="sr-only">Looking for rides…</span>' + card + card + card + '</div>';
  }

  // ---------- screens: offers (departure / one-way) and offers-return ----------
  function offersScreen(leg) {
    return {
      render() {
        // back on the offers from Edit search without "Update search": the old search returns
        if (GO.store.get().editSnap && !GO.router.path().startsWith('/edit')) GO.editRestore();
        const c = ctx(leg);
        if (!c.q.from || !c.q.to || !c.q.date || !c.q.time) {
          return header(c) + '<main class="stub"><p class="t-body c-secondary">Fill in the search first.</p><button class="btn btn--primary" data-act="search">Go to search</button></main>';
        }
        if (!c.data) return header(c) + '<main class="offers-main">' + skeleton() + '</main>';
        syncSelection(c);
        const o = selected(c);
        const f = c.sel.filter;
        const body = c.data.empty
          ? emptyState(c)
          : group(c, 'private', c.data.priv, o && o.id) +
            group(c, 'shared', c.data.shared, o && o.id) +
            trust('all');
        return header(c) + '<main class="offers-main">' + body + '</main>' + ctaBar(c, o);
      },

      // Fetch this leg (and the other one of a round trip, for the total) when not cached yet
      mount(root) {
        if (root && !root.__win) {
          root.__win = true;
          root.addEventListener('change', ev => {
            const t = ev.target;
            if (!t.matches || !t.matches('[data-win]')) return;
            const w = +t.value, c = ctx(leg);
            const o = c.data && allOffers(c.data).find(x => x.id === t.dataset.id);
            if (!o || !o.wins) return;
            const x = o.wins.find(v => v.w === w);
            o.window = w; o.pickTo = o.pickFrom + w; o.unit = x.unit; o.total = x.unit * o.pax;
            // "Cheapest" follows the new price
            const ok = c.data.shared.filter(v => !v.soldOut && v.id !== 'earlier' && v.id !== 'later');
            ok.forEach(v => { v.cheapest = false; });
            if (ok.length) ok.reduce((a, v) => (v.unit < a.unit ? v : a)).cheapest = true;
            GO.store.set({ flexWin: w });
            setSel(leg, { id: o.id });
            GO.router.refresh();
          });
        }
        const s = GO.store.get();
        const legs = isRound(s) ? ['out', 'ret'] : ['out'];
        const missing = legs.map(l => api.legSearch(s, l)).filter(q => q.from && q.to && q.date && q.time && !api.offersCached(q));
        if (!missing.length) return;
        const keys = missing.map(api.searchKey);
        Promise.all(missing.map(q => api.offers(q))).then(() => {
          const now = GO.store.get();
          const still = keys.every(k => legs.some(l => api.searchKey(api.legSearch(now, l)) === k));
          if (GO.router.path().startsWith('/offers') && still) GO.router.refresh();
        });
      },

      actions: {
        back: () => GO.router.back(),
        search: () => GO.router.go('/'),
        // pencil: the whole search in Edit search (2303:5283); Change time / date in the empty state: date and time sheet (1719:13909)
        edit: () => GO.editSearch(leg === 'ret' ? 'offers-return' : 'offers'),
        'change-when': () => GO.router.go(leg === 'ret' ? '/offers/return/when' : '/offers/when'),
        leg(el) {
          if (el.dataset.leg === leg) return;
          GO.router.go(el.dataset.leg === 'ret' ? '/offers/return' : '/offers', { replace: true });
        },
        'to-return': () => askHouse(leg, 'to-return') || GO.router.go('/offers/return'),
        'to-departure': () => GO.router.go('/offers', { replace: true }),
        // a street without a house number: the first pick asks for it, the ride stays selected underneath
        pick(el) {
          setSel(leg, { id: el.dataset.id });
          const p = houseSide(api.legSearch(GO.store.get(), leg));
          if (p && GO.store.get().houseAsked !== p.place.id) {
            GO.store.set({ houseAsked: p.place.id });
            askHouse(leg, 'close');
          } else GO.router.refresh();
        },
        filter(el) {
          const c = ctx(leg);
          const f = el.dataset.filter;
          const o = selected(c);
          // every filter opens with its own pick visible at the top (decision 20.10.2026): All the cheapest ride (as on a new search),
          // Shared and Private the cheapest of their type; tapping the tab already on keeps the pick. The price in the bar follows.
          if (f === c.sel.filter && o) return;
          const cheapest = list => list.filter(x => !x.soldOut).sort((a, b) => a.total - b.total)[0];
          const pick = f === 'shared' ? cheapest(c.data.shared) : f === 'private' ? cheapest(c.data.priv) : null;
          setSel(leg, { filter: f, id: pick ? pick.id : defaultOffer(c.data) });
          GO.router.refresh();
        },
        info(el) {
          GO.store.set({ infoOfferId: el.dataset.id, sheetLeg: leg });
          GO.router.go('/offers/offer');
        },
        about(el) {
          GO.store.set({ sheetLeg: leg });
          GO.router.go(el.dataset.kind === 'shared' ? '/offers/shared' : '/offers/private');
        },
        total() {
          GO.store.set({ sheetLeg: leg });
          GO.router.go('/offers/total');
        },
        continue: () => askHouse(leg, 'continue') || GO.router.go('/extras'),
        refund() { GO.store.set({ refund: !GO.store.get().refund }); GO.router.refresh(); },
        shvar(el) {
          const c = ctx(leg), id = el.dataset.id, w = +el.dataset.w;
          const o = c.data && c.data.shared.find(x => x.id === id);
          if (!o || o.soldOut) return;
          if (o.wins && w) {
            const x = o.wins.find(v => v.w === w);
            o.window = w; o.pickTo = o.pickFrom + w; o.unit = x.unit; o.total = x.unit * o.pax;
            GO.store.set({ flexWin: w });
          }
          GO.store.set({ sharedVar: id });
          setSel(leg, { id });
          GO.router.refresh();
        },
      },
    };
  }

  // The address of the leg that still lacks a house number, and its role (pick-up or drop-off)
  function houseSide(q) {
    if (q.from && q.from.noNumber) return { place: q.from, pickup: true };
    if (q.to && q.to.noNumber) return { place: q.to, pickup: false };
    return null;
  }
  // Opens the house number sheet when it is needed; next is what Save does after saving
  function askHouse(leg, next) {
    if (!houseSide(api.legSearch(GO.store.get(), leg))) return false;
    GO.store.set({ sheetLeg: leg, houseNext: next });
    GO.router.go('/offers/house');
    return true;
  }

  GO.screens.offers = offersScreen('out');
  GO.screens['offers-return'] = offersScreen('ret');

  // ---------- sheets ----------
  function sheetHead(title, subtitle) {
    return '<div class="sheet-handle" aria-hidden="true"></div>' +
      '<header class="sheet-header">' +
        '<div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">' + esc(title) + '</h2>' +
        (subtitle ? '<div class="t-body-sm c-secondary">' + esc(subtitle) + '</div>' : '') + '</div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button>' +
      '</header>';
  }
  function sheetFoot(label, act) {
    return '<div class="cta-bar"><button class="btn btn--primary" data-act="' + (act || 'close') + '">' + label + '</button></div>';
  }
  const closeAct = { close: () => GO.router.back() };
  // the offer sheets open over the leg they were opened from
  function sheetBase() { return GO.store.get().sheetLeg === 'ret' ? 'offers-return' : 'offers'; }
  function sheetCtx() { return ctx(GO.store.get().sheetLeg || 'out'); }

  // Pick-up windows on one time axis (Shared transfer sheet)
  function windowChart(c) {
    const list = ['flex3', 'flex2', 'flex1', 'fixed'].map(id => c.data.shared.find(o => o.id === id && !o.soldOut)).filter(Boolean)
      .filter((o, i, a) => !(o.id === 'flex1' && a.length > 3)); // the layout shows 3h, 2h and exact
    if (!list.length) return '';
    const lo = Math.floor(Math.min.apply(null, list.map(o => o.pickFrom)) / 120) * 120;
    let hi = lo + 240;
    while (hi < Math.max.apply(null, list.map(o => o.pickTo)) + 15) hi += 120;
    const pct = m => ((m - lo) / (hi - lo) * 100).toFixed(2) + '%';
    const n = ['', 'one', 'two', 'three', 'four'][list.length] || list.length;
    const rows = list.map(o =>
      '<li class="window-row">' +
        '<div class="window-row__label"><span class="t-label">' + (o.kind === 'flex' ? 'Flexible, ' + fmtDur(o.window) : 'Exact time') + '</span>' +
        '<span class="t-caption c-tertiary">' + pickLabel(o) + '</span><span class="t-label window-row__price">' + money(o.unit) + '</span></div>' +
        '<div class="window-row__track"><span class="window-row__bar' + (o.kind === 'flex' ? '' : ' window-row__bar--dot') + '" style="left:' + pct(o.pickFrom) + ';' + (o.kind === 'flex' ? 'width:' + pct(lo + o.window) : '') + '"></span></div>' +
      '</li>').join('');
    const ticks = [lo, (lo + hi) / 2, hi].map(m => '<span>' + fromMin(m) + '</span>').join('');
    const cases = list.length === 1 ? 'In this case' : list.length === 2 ? 'In both cases' : 'In all ' + n + ' cases';
    const note = c.data.toAirport ? cases + ' arrival at the airport at ' + c.q.time + '. Prices per person.' : 'Prices per person.';
    return '<div class="window-chart">' +
      '<div class="window-chart__title">' + ic('shuttle', 20) + '<span class="t-label">You will have ' + n + ' pick-up time option' + (list.length > 1 ? 's' : '') + ':</span></div>' +
      '<div class="window-chart__ticks t-caption c-secondary" aria-hidden="true">' + ticks + '</div>' +
      '<ul class="window-chart__rows">' + rows + '</ul>' +
      '<p class="t-caption c-secondary">' + note + '</p>' +
    '</div>';
  }

  function point(icon, title, text) {
    return '<li class="point"><span class="point__icon">' + ic(icon, 20, 'icon--brand') + '</span>' +
      '<span class="point__text"><span class="t-label">' + title + '</span><span class="t-body-sm c-secondary">' + text + '</span></span></li>';
  }

  GO.screens['about-shared'] = {
    overlay: true, base: sheetBase, sheetClass: 'sheet--bottom',
    render() {
      const c = sheetCtx();
      return sheetHead('Shared transfer') +
        '<div class="sheet__body sheet__body--gap16">' +
          '<p class="t-body c-secondary">You may share the ride with others going the same way, with a few short stops. A wider pick-up window costs less:</p>' +
          (c.data ? windowChart(c) : '') +
          '<ul class="points">' +
            point('clock', 'Exact time the day before', 'Comes by SMS, email and app the day before, always inside your window.') +
            point('map-pin', 'Door to door, a few short stops', 'A tried and trusted driver picks you up at your address.') +
            point('plane', 'At the airport on time', 'Your latest drop-off time is guaranteed. We plan every stop around it.') +
          '</ul>' +
        '</div>' + sheetFoot('Got it');
