:root {
  /* Primitives */
  --primary-50: #fef4f6;  --primary-100: #ffe3e8; --primary-200: #f9d2db; --primary-300: #ee87a9; --primary-400: #e85289;
  --primary-500: #ee2b74; --primary-600: #da0364; --primary-700: #a8024c; --primary-800: #820039; --primary-900: #5e0027;
  --secondary-50: #edfaf8; --secondary-100: #d8f0ee; --secondary-200: #9cd9d3; --secondary-300: #61c3b9; --secondary-400: #3dbab1;
  --secondary-500: #00b4aa; --secondary-600: #088079; --secondary-700: #056963; --secondary-800: #04504b; --secondary-900: #003935;
  --neutral-0: #ffffff; --neutral-50: #f5f5f5; --neutral-100: #ededed; --neutral-200: #dedede; --neutral-300: #c4c4c4;
  --neutral-400: #a8a8a8; --neutral-500: #858585; --neutral-600: #6b6b6b; --neutral-700: #575757; --neutral-800: #3e3e3e;
  --neutral-900: #1f1f1f; --neutral-1000: #000000;
  --error-50: #fff4f2; --error-100: #ffe5df; --error-600: #d1320f; --error-700: #a61f00;
  --warning-50: #fff7ef; --warning-100: #ffedda; --warning-600: #a26402; --warning-700: #804e00;
  --neutral-alpha-50: #00000080;
  --sand-50: #fcfaf3; --sand-100: #f9f5e6; --sand-200: #eae7d8;

  /* Semantic colors */
  --color-text-primary: var(--neutral-1000);
  --color-text-secondary: var(--neutral-800);
  --color-text-tertiary: var(--neutral-600);
  --color-text-disabled: var(--neutral-400);
  --color-text-inverse: var(--neutral-0);
  --color-text-brand: #ed3180;
  --color-text-success: var(--secondary-700);
  --color-text-error: var(--error-700);
  --color-text-warning: var(--warning-700);
  --color-bg-page: var(--neutral-0);
  --color-bg-subtle: var(--neutral-50);
  --color-bg-muted: var(--neutral-100);
  --color-bg-inverse: var(--neutral-900);
  --color-bg-overlay: var(--neutral-alpha-50);
  --color-bg-brand-subtle: var(--primary-50);
  --color-bg-success-subtle: var(--secondary-100);
  --color-bg-error-subtle: var(--error-100);
  --color-bg-warning-subtle: var(--warning-100);
  --color-bg-sand: var(--sand-50);
  --color-bg-sand-muted: var(--sand-100);
  --color-bg-sand-strong: var(--sand-200);
  --color-action-primary: #ed3180;
  --color-action-primary-hover: var(--primary-600);
  --color-action-primary-pressed: var(--primary-700);
  --color-action-disabled: var(--neutral-200);
  --color-action-success: var(--secondary-600);
  --color-border-subtle: var(--neutral-200);
  --color-border-input: var(--neutral-500);
  --color-border-strong: var(--neutral-1000);
  --color-border-selected: #ed3180;
  --color-border-error: var(--error-600);
  --color-border-success: var(--secondary-600);
  --color-focus-ring: var(--neutral-1000);
  --color-icon-default: var(--neutral-1000);
  --color-icon-muted: var(--neutral-600);
  --color-icon-inverse: var(--neutral-0);
  --color-icon-brand: #ed3180;
  --color-icon-success: var(--secondary-600);
  --color-icon-warning: var(--warning-600);
  --color-icon-error: var(--error-600);
  --color-icon-disabled: var(--neutral-400);
  --color-control-off: var(--neutral-500);

  /* Type */
  --font-family: 'Rethink Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* Responsive collection, mode "mobile" */
  --font-size-display: 32px;  --line-height-display: 40px;
  --font-size-h1: 28px;       --line-height-h1: 36px;
  --font-size-h2: 22px;       --line-height-h2: 28px;
  --font-size-h3: 18px;       --line-height-h3: 24px;
  --font-size-label-lg: 16px; --line-height-label-lg: 24px;
  --font-size-body: 16px;     --line-height-body: 24px;
  --font-size-body-sm: 14px;  --line-height-body-sm: 20px;
  --font-size-label: 14px;    --line-height-label: 20px;
  --font-size-label-sm: 12px; --line-height-label-sm: 16px;
  --font-size-caption: 12px;  --line-height-caption: 16px;

  /* Space, radius */
  --space-0: 0; --space-4: 4px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-20: 20px;
  --space-24: 24px; --space-32: 32px; --space-40: 40px; --space-48: 48px; --space-64: 64px;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 16px; --radius-full: 9999px;

  --layout-page-margin: var(--space-16);
  --layout-section-gap: var(--space-32);
  --layout-block-gap: var(--space-24);
  --layout-card-padding: var(--space-16);

  /* Effect styles */
  --shadow-raised: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.08);
  --shadow-overlay: 0 4px 12px rgba(0,0,0,.08), 0 16px 40px rgba(0,0,0,.16);
  --shadow-sticky-top: 0 -1px 2px rgba(0,0,0,.06), 0 -2px 8px rgba(0,0,0,.08);

  /* Prototype only: width of the app column on wide screens */
  --app-max-width: 480px;
}

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

/* Device insets. Inside the desktop phone frame (js/frame.js) they are faked: status bar on top, home indicator below. */
:root { --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); }
/* no home indicator in the frame: the bottom inset only brings the bar's bottom padding to 22, as in the client prototype (user, 20.10.2026) */
html.is-framed { --safe-top: 47px; --safe-bottom: 6px; scrollbar-width: none; }
html.is-framed ::-webkit-scrollbar { display: none; }
html.is-framed * { scrollbar-width: none; }

body {
  font-family: var(--font-family);
  font-size: var(--font-size-body);
  line-height: var(--line-height-body);
  color: var(--color-text-primary);
  background: var(--color-bg-muted);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100dvh;
}
body.is-locked { overflow: hidden; }

button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; text-align: inherit; }
img, svg { display: block; }

[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* The app column: full width on phones, centred column on wide screens (no device frame). */
#app {
  max-width: var(--app-max-width);
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--color-bg-page);
  position: relative;
}
@media (min-width: 481px) {
  #app { box-shadow: 0 0 0 1px var(--color-border-subtle); }
}

/* Desktop phone frame: the page shows a 390×844 phone like the client prototype, the prototype runs inside it in an iframe */
.stage {
  height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: var(--color-bg-muted);
}
.stage__phone {
  width: 390px; height: 844px; flex-shrink: 0;
  border-radius: 54px; overflow: hidden; /* as in the client prototype: iPhone 12–14, 390×844 */
  background: var(--color-bg-page);
  box-shadow: 0 0 0 1px var(--neutral-300);
  transform-origin: center;
}
.stage__phone iframe { display: block; width: 100%; height: 100%; border: 0; }

/* Drawn inside the iframe, over the app */
.device-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 47px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 30px 0 34px;
  font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--color-text-primary); pointer-events: none;
}
.device-bar.is-light { color: var(--color-text-inverse); }
.device-bar__icons { display: flex; align-items: center; gap: 6px; }
.device-bar svg { fill: currentColor; }
.device-bar__island {
  position: absolute; top: 11px; left: 50%; width: 122px; height: 35px; margin-left: -61px;
  border-radius: 18px; background: var(--neutral-1000);
}

/* Text styles */
.t-display  { font-size: var(--font-size-display); line-height: var(--line-height-display); font-weight: 700; letter-spacing: -0.01em; }
.t-h1       { font-size: var(--font-size-h1); line-height: var(--line-height-h1); font-weight: 700; letter-spacing: -0.01em; }
.t-h2       { font-size: var(--font-size-h2); line-height: var(--line-height-h2); font-weight: 700; }
.t-h3       { font-size: var(--font-size-h3); line-height: var(--line-height-h3); font-weight: 600; }
.t-label-lg { font-size: var(--font-size-label-lg); line-height: var(--line-height-label-lg); font-weight: 600; }
.t-body     { font-size: var(--font-size-body); line-height: var(--line-height-body); font-weight: 400; }
.t-body-sm  { font-size: var(--font-size-body-sm); line-height: var(--line-height-body-sm); font-weight: 400; }
.t-label    { font-size: var(--font-size-label); line-height: var(--line-height-label); font-weight: 600; }
.t-label-sm { font-size: var(--font-size-label-sm); line-height: var(--line-height-label-sm); font-weight: 600; }
.t-caption  { font-size: var(--font-size-caption); line-height: var(--line-height-caption); font-weight: 400; }

.c-secondary { color: var(--color-text-secondary); }
.c-tertiary  { color: var(--color-text-tertiary); }
.c-primary   { color: var(--color-text-primary); }
.c-brand     { color: var(--color-text-brand); }
.c-success   { color: var(--color-text-success); }

.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Icons are inline SVG with currentColor */
.icon { flex-shrink: 0; color: var(--color-icon-default); }
.icon--muted { color: var(--color-icon-muted); }
.icon--brand { color: var(--color-icon-brand); }
.icon--inverse { color: var(--color-icon-inverse); }
.icon--success { color: var(--color-icon-success); }
.icon--error { color: var(--color-icon-error); }
.icon--disabled { color: var(--color-icon-disabled); }
.nowrap { white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

}

.offer__content { display: flex; flex-direction: column; gap: var(--space-8); width: 100%; }

.offer__select { margin-top: var(--space-8); min-height: 32px; min-width: 84px; justify-content: center; box-sizing: border-box; padding: 0 var(--space-16); display: inline-flex; align-items: center; border: 1px solid var(--color-border-strong); border-radius: var(--radius-md); background: var(--color-bg-page); }

<script>
// Phone frame for desktop viewing. On a computer the page draws a 390×844 phone (the size of the client prototype) and loads itself inside it
// in an iframe, so the app keeps its own scroll, fixed bars, sheets and history. Phones get the bare page.
// ?frame=0 opens the bare page on a computer too.
window.GO = window.GO || {};
(function () {
  const NAME = 'go-phone';
  const params = new URLSearchParams(location.search);

  // Outer page: the phone on a plain background
  const wantsFrame = window.top === window && params.get('frame') !== '0' &&
    matchMedia('(hover: hover) and (pointer: fine) and (min-width: 600px)').matches;
  if (wantsFrame) {
    GO.frame = 'outer';
    document.body.innerHTML = '<div class="stage"><div class="stage__phone"><iframe name="' + NAME + '" title="GoOpti booking prototype"></iframe></div></div>';
    const phone = document.querySelector('.stage__phone');
    const iframe = phone.querySelector('iframe');
    iframe.src = location.href;
    // Shrink the phone on short windows instead of cropping it
    const fit = () => {
      const s = Math.min(1, (innerHeight - 48) / 844, (innerWidth - 32) / 390);

    addEventListener('message', ev => {

<script>
window.GO = window.GO || {};

GO.u = (function () {
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Dates are kept as 'YYYY-MM-DD' strings in state, times as 'HH:MM'.
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseIso(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function addDays(isoStr, n) { const d = parseIso(isoStr); d.setDate(d.getDate() + n); return iso(d); }

  // "Thu 15 Oct" — no comma inside the date (copy rule)
  function fmtDay(isoStr) { const d = parseIso(isoStr); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
  function monthTitle(y, m) { return MONTH[m] + ' ' + y; }

  function toMin(hhmm) { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; }
  function fromMin(min) { min = ((min % 1440) + 1440) % 1440; return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }

  // "2h 45m", "3h", "45m" (copy rule: no space after the number)
  function fmtDur(min) {
    const h = Math.floor(min / 60), m = min % 60;
    return (h ? h + 'h' : '') + (h && m ? ' ' : '') + (m ? m + 'm' : '') || '0m';
  }

  // "Today" for the prototype: ?today=2026-10-14 pins the date for screenshots; kept for the session.
  function today() {
    const p = new URLSearchParams(location.search).get('today');
    if (p && /^\d{4}-\d{2}-\d{2}$/.test(p)) { try { sessionStorage.setItem('go.today', p); } catch (e) {} return p; }
    try { const s = sessionStorage.getItem('go.today'); if (s) return s; } catch (e) {}
    return iso(new Date());
  }

  let toastTimer = null;
  function toast(msg) {
    let el = document.querySelector('.toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast'; el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('is-on'), 2200);
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // Bold the matched part of a string (search suggestions)
  function highlight(text, q) {
    if (!q) return esc(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<b>' + esc(text.slice(i, i + q.length)) + '</b>' + esc(text.slice(i + q.length));
  }

  return { esc, iso, parseIso, pad, addDays, fmtDay, monthTitle, toMin, fromMin, fmtDur, today, toast, sleep, highlight, MONTH };
})();

<script>
// Fake backend. Every call is async with a small latency so loading states are real.
// Local reference data first; free OSM geocoder Photon (no key) for arbitrary addresses when online.
window.GO = window.GO || {};

GO.api = (function () {
  const { sleep } = GO.u;
  const byId = Object.fromEntries(GO.DATA.places.map(p => [p.id, p]));
  const PHOTON = 'https://photon.komoot.io/api/';
  // Search area: where GoOpti drives (Slovenia, Italy, Croatia, Austria and neighbours)
  const BBOX = '5.5,40.5,24,50.5';

  function latency() { return 120 + Math.random() * 180; }
  function place(id) { return byId[id] || null; }
  function isAirport(p) { return !!p && p.type === 'airport'; }
  // Short label for titles: "Venice Airport (VCE)"
  function shortName(p) { return p ? (p.short || p.name) : ''; }

  function norm(s) { return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }

  async function popular(kind, from) {
    await sleep(latency() / 2);
    if (kind === 'from') return GO.DATA.popularFrom.map(place);
    const list = isAirport(from) ? GO.DATA.popularCities : GO.DATA.popularAirports;
    return list.map(place).filter(p => !from || p.id !== from.id);
  }

  async function searchLocal(q) {
    await sleep(latency());
    const n = norm(q).trim();
    if (!n) return [];
    const scored = [];
    for (const p of GO.DATA.places) {
      const hay = norm(p.name + ' ' + p.detail + ' ' + p.city + ' ' + (p.id.length === 3 ? p.id : ''));
      const i = hay.indexOf(n);
      if (i < 0) continue;
      // airports and prefix matches first
      scored.push({ p, s: (p.type === 'airport' ? 0 : 10) + (norm(p.name).startsWith(n) ? 0 : 5) + i / 100 });
    }
    return scored.sort((a, b) => a.s - b.s).slice(0, 8).map(x => x.p);
  }

  function fromPhoton(f) {
    const pr = f.properties || {};
    const street = pr.street ? pr.street + (pr.housenumber ? ' ' + pr.housenumber : '') : '';
    const name = pr.name || street || pr.city;
    const detail = [pr.name && street ? street : '', pr.city || pr.county, pr.country].filter(Boolean)
      .filter((v, i, a) => a.indexOf(v) === i).join(', ');
    const air = pr.osm_key === 'aeroway' || pr.osm_value === 'aerodrome';
    const [lon, lat] = (f.geometry && f.geometry.coordinates) || [];
    const place = { id: 'osm-' + pr.osm_type + pr.osm_id, type: air ? 'airport' : 'address', name, detail, city: pr.city || pr.county || '', lat, lon };
    // a whole street, no house number: Offers asks for the number before going on
    if (pr.osm_key === 'highway' && !pr.housenumber) Object.assign(place, { street: pr.name || pr.street, noNumber: true });
    return place;
  }

  // Remote addresses (hotels, streets). Resolves to [] when offline.
  async function searchRemote(q, signal) {
    if (q.trim().length < 3 || !navigator.onLine) return [];
    try {
      const url = PHOTON + '?q=' + encodeURIComponent(q) + '&limit=8&lang=en&lat=46.05&lon=14.5&bbox=' + BBOX;
      const r = await fetch(url, { signal });
      const j = await r.json();
      return (j.features || []).map(fromPhoton).filter(p => p.name);
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      return [];
    }
  }

  async function reverse(lat, lon) {
    try {
      const r = await fetch('https://photon.komoot.io/reverse?lat=' + lat + '&lon=' + lon + '&lang=en');
      const j = await r.json();
      const f = (j.features || [])[0];
      if (f) return Object.assign(fromPhoton(f), { lat, lon });
    } catch (e) { /* fall through */ }
    return null;
  }

  // Real geolocation needs https; on plain http (Wi-Fi testing) we fall back to a demo address.
  async function locate() {
    if (window.isSecureContext && navigator.geolocation) {
      try {
        const pos = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { timeout: 8000, maximumAge: 60000 }));
        const p = await reverse(pos.coords.latitude, pos.coords.longitude);
        if (p) return p;
      } catch (e) { /* denied or timed out */ }
    }
    await sleep(600);
    return place(GO.DATA.fallbackLocation);
  }

  // Booking window: from tomorrow up to a year ahead.
  function bookingWindow() {
    const today = GO.u.today();
    return { today, min: GO.u.addDays(today, 1), max: GO.u.addDays(today, 365) };
  }


  // ---------- Offers ----------
  // Real prices from goopti.com for Ljubljana → Venice Airport (and back), as in the layouts.
  // Every other route: duration and price from the distance, a little dearer at weekends and close to the date.
  const FEE = 2.4;
  const REAL = {
    'lj>VCE': { dur: 165, shared: { flex3: 26, flex2: 34, flex1: 27, fixed: 51, earlier: 31 }, priv: 224, privRef: 248 },
    'VCE>lj': { dur: 165, shared: { flex3: 25, flex2: 31, flex1: 36, fixed: 42, earlier: 31, later: 29 }, priv: 210, privRef: 234 },
  };
  const EARLIEST_PICKUP = 180; // no pick-ups before 03:00
  const EARLIER_BY = 75;       // the scheduled fixed ride that arrives earlier
  const LATER_BY = 120;        // from the airport: the scheduled fixed ride that leaves later
  const AFTER_LANDING = 20;    // first pick-up after landing, rounded up to :15
  const offersCache = {};

  function km(a, b) {
    const R = 6371, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function round5(n) { return Math.round(n / 5) * 5; }
  function hash(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
  function inLjubljana(p) { return p.type !== 'airport' && p.city === 'Ljubljana'; }
  function realKey(from, to) {
    if (inLjubljana(from) && to.id === 'VCE') return 'lj>VCE';
    if (from.id === 'VCE' && inLjubljana(to)) return 'VCE>lj';
    return null;
  }

  // Route base: travel minutes and prices for one passenger (shared) or one vehicle (private).
  // The real route keeps the site prices on any date, so it always matches the layouts.
  function routeBase(from, to, date) {
    const real = REAL[realKey(from, to)];
    if (real) return real;
    const days = (GO.u.parseIso(date) - GO.u.parseIso(GO.u.today())) / 864e5;
    const dow = GO.u.parseIso(date).getDay();
    const k = (dow === 5 || dow === 0 ? 1.08 : 1) * (days <= 3 ? 1.1 : 1);
    const road = km(from, to) * 1.35;
    const dur = Math.max(20, round5(15 + road * 0.63));
    const fixed = Math.max(15, Math.round(road * 0.21));
    const base = { flex3: fixed * 0.51, flex2: fixed * 0.67, flex1: fixed * 0.84, fixed, earlier: fixed * 0.61, later: fixed * 0.69 };
    const priv = Math.max(60, road * 0.93);
    const privRef = priv * 1.107;
    const shared = {};
    for (const key in base) shared[key] = Math.round(base[key] * k);
    return { dur, shared, priv: Math.round(priv * k), privRef: Math.round(privRef * k) };
  }

  // When a ride starts and ends, in minutes from the start of its date. From an airport the time is the pick-up,
  // otherwise it is the latest drop-off (the same rule the offers use). Used to keep the return after the first ride.
  function span(from, to, date, time) {
    const dur = routeBase(from, to, date).dur;
    const t = GO.u.toMin(time);
    return isAirport(from) ? { start: t, end: t + dur } : { start: t - dur, end: t };
  }
  // The return must start after the first ride ends. Returns the first ride's arrival "HH:MM" when it does not, else ''.
  function returnClash(s, out, ret) {
    if (!out.date || !out.time || !ret.date || !ret.time) return '';
    const days = Math.round((GO.u.parseIso(ret.date) - GO.u.parseIso(out.date)) / 864e5);
    const a = span(s.from, s.to, out.date, out.time), b = span(s.to, s.from, ret.date, ret.time);
    if (b.start + days * 1440 >= a.end) return '';
    return GO.u.fromMin(((a.end % 1440) + 1440) % 1440);
  }

  function searchKey(s) {
    return [s.from && s.from.id, s.to && s.to.id, s.date, s.time, s.landing ? 'L' : '', s.adults, s.children, s.offersScenario || ''].join('|');
  }

  // Search of one leg; the return goes the other way on its own date and time
  function legSearch(s, leg) {
    const q = { adults: s.adults, children: s.children, offersScenario: s.offersScenario };
    if (leg === 'ret') return Object.assign(q, { from: s.to, to: s.from, date: s.retDate, time: s.retTime, landing: !!s.retLanding });
    return Object.assign(q, { from: s.from, to: s.to, date: s.date, time: s.time, landing: false });
  }

  // One-way offers for the search. Times are minutes from midnight.
  // { key, fee, pax, toAirport, shared: [...], priv: [...], empty: null | { reason, alternatives } }
  function buildOffers(s) {
    const from = s.from, to = s.to;
    const pax = s.adults + s.children;
    const b = routeBase(from, to, s.date);
    const real = !!REAL[realKey(from, to)];
    const t = GO.u.toMin(s.time);
    const toAirport = isAirport(to);
    // To the airport and city to city (Drop-off at Maribor, 1686:10844) the time is the latest drop-off;
    // from the airport it is the pick-up time.
    const dropBy = toAirport || !isAirport(from);
    const latest = dropBy ? t - b.dur : t;
    const h = hash((from.twin || from.id) + (to.twin || to.id) + s.date); // twin: the same spot under another id (a street without a number)
    const scenario = s.offersScenario || (h % 13 === 0 ? 'empty' : h % 4 === 0 ? 'soldout' : 'normal');
    const mk = (id, o) => Object.assign({ id, pax, dur: b.dur, soldOut: false, badge: null }, o, {
      arrival: o.pickTo + b.dur,
      total: o.kind === 'private' ? o.unit : o.unit * pax,
    });

    const shared = [];
    const priv = [];
    let latestPrivate = latest;
    if (dropBy) {
      [['flex1', 60]].forEach(([id, w]) => { // 3 offers: shared with window pulldown, shared fixed, private
        if (latest - w < EARLIEST_PICKUP) return;
        // 1h window runs an hour past the latest pick-up (03:15–05:15 in the layouts); drop-off stays the same
        // The 1h-earlier start offers three window lengths; the person picks how flexible they are (default 2h)
        if (id === 'flex1') {
          const wins = real ? [[60, 35], [120, 27], [180, 23]] : [[60, 35 / 27], [120, 1], [180, 23 / 27]].map(([m, r]) => [m, Math.round(b.shared.flex1 * r)]);
          const ww = wins.some(x => x[0] === s.flexWin) ? s.flexWin : 120;
          const o = mk(id, { kind: 'flex', window: ww, pickFrom: latest - w, pickTo: latest - w + ww, unit: wins.find(x => x[0] === ww)[1] });
          o.wins = wins.map(([m, u]) => ({ w: m, unit: u }));
          o.arrival = latest + b.dur; shared.push(o); return;
        }
        shared.push(mk(id, { kind: 'flex', window: w, pickFrom: latest - w, pickTo: latest, unit: b.shared[id] }));
      });
      if (latest >= EARLIEST_PICKUP) shared.push(mk('fixed', { kind: 'fixed', pickFrom: latest, pickTo: latest, unit: b.shared.fixed }));
    } else {
      // From the airport: windows start at the pick-up time (after landing, a little later)
      const p = s.landing ? Math.ceil((t + AFTER_LANDING) / 15) * 15 : t;
      const wins = [[60, b.shared.flex1], [120, b.shared.flex2], [180, b.shared.flex3]];
      const ww = wins.some(x => x[0] === s.flexWin) ? s.flexWin : 120;
      const fo = mk('flex1', { kind: 'flex', window: ww, pickFrom: p, pickTo: p + ww, unit: wins.find(x => x[0] === ww)[1] });
      fo.wins = wins.map(([m, u]) => ({ w: m, unit: u }));
      shared.push(fo);
      shared.push(mk('fixed', { kind: 'fixed', pickFrom: p, pickTo: p, unit: b.shared.fixed }));
      latestPrivate = p;
    }
    if (!dropBy || latest >= EARLIEST_PICKUP) {
      const van = pax > 3 ? 1.35 : 1; // bigger vehicle for 4+
      priv.push(mk('private', { kind: 'private', pickFrom: latestPrivate, pickTo: latestPrivate, unit: Math.round(b.priv * van) }));
    }

    if (scenario === 'soldout' && shared.length > 1) {
      // the cheapest window is gone; it drops to the end of the group
      const first = shared.shift();
      first.soldOut = true; first.badge = 'Sold out';
      shared.push(first);
    }
    // "Cheapest" goes to the cheapest ride that can still be booked and arrives on time
    // (the earlier scheduled ride keeps its own badge)
    const bookable = shared.filter(o => !o.soldOut && o.id !== 'earlier' && o.id !== 'later');
    if (bookable.length) bookable.reduce((a, o) => (o.unit < a.unit ? o : a)).cheapest = true; // no badge (removed 21.10.2026)

    let empty = null;
    if (dropBy && (scenario === 'empty' || latest < EARLIEST_PICKUP)) {
      // Nothing reaches the airport in time: show the nearest rides that day instead
      const reason = latest < EARLIEST_PICKUP ? 'early' : 'booked';
      const alternatives = [];
      if (reason === 'booked' && latest - EARLIER_BY >= EARLIEST_PICKUP) {
        alternatives.push(mk('alt-earlier', { kind: 'fixed', pickFrom: latest - EARLIER_BY, pickTo: latest - EARLIER_BY, unit: b.shared.earlier, badge: GO.u.fmtDur(EARLIER_BY) + ' earlier' }));
      }
      const laterTo = Math.max(latest, EARLIEST_PICKUP) + EARLIER_BY;
      const later = mk('alt-later', { kind: 'flex', window: 120, pickFrom: laterTo - 120, pickTo: laterTo, unit: b.shared.flex2 });
      later.badge = GO.u.fmtDur(later.arrival - t) + ' later';
      later.tone = 'warning';
      alternatives.push(later);
      empty = { reason, alternatives };
      shared.length = 0; priv.length = 0;
    }
    return { key: searchKey(s), fee: FEE, pax, toAirport, dropBy, landing: !!s.landing, shared, priv, empty };
  }

  async function offers(s) {
    const key = searchKey(s);
    if (!offersCache[key]) {
      await sleep(350 + Math.random() * 350);
      offersCache[key] = buildOffers(s);
    }
    return offersCache[key];
  }

// Hash router. Every screen and every full-screen sheet has its own URL (#/offers, #/from),

//
// A screen: GO.screens[name] = { overlay?, base?, render(state) -> html, mount(el), actions: {name(el, ev)} }
// Overlays (sheets) are drawn on top of their base screen.
window.GO = window.GO || {};
GO.screens = {};

GO.router = (function () {
  const routes = {
    '/': 'home',
    '/from': 'from',
    '/to': 'to',
    '/when': 'when',
    '/return': 'when-return',
    '/offers': 'offers',
    '/offers/return': 'offers-return',
    '/offers/shared': 'about-shared',
    '/offers/private': 'about-private',
    '/offers/offer': 'about-offer',
    '/offers/total': 'offers-total',
    '/offers/house': 'offers-house',
    '/offers/when': 'offers-when',
    '/offers/return/when': 'offers-when-return',
    '/edit': 'edit',
    '/edit/from': 'edit-from',
    '/edit/to': 'edit-to',
    '/edit/when': 'edit-when',
    '/edit/return': 'edit-when-return',
    '/extras': 'extras',
    '/extras/flight': 'extras-flight',
    '/extras/flight/manual': 'extras-flight-manual',
    '/extras/no-worries': 'extras-no-worries',
    '/extras/seats': 'extras-seats',
    '/extras/invoice': 'extras-invoice',
    '/details': 'details',
    '/details/total': 'details-total',
    '/details/google': 'details-google',
    '/details/email': 'details-email',
    '/details/code': 'details-code',
    '/login': 'login-email',
    '/login/code': 'login-code',
    '/details/passengers': 'details-passengers',
    '/payment': 'payment',
    '/booked': 'booked',
    '/booked/receipt': 'booked-receipt',
  };

  let overlayName = null;

  function path() { return (location.hash.replace(/^#/, '') || '/').split('?')[0]; }

  function go(p, opts) {

    const layer = document.getElementById('layer');
    if (scr.overlay) {

      overlayName = name;

      document.getElementById('app').setAttribute('aria-hidden', 'true');

    } else {
      overlayName = null;

  function fitSheet() {
    const sheet = document.querySelector('.sheet--bottom');

    const layer = sheet.parentElement;

    const need = sheet.offsetHeight;
    sheet.style.maxHeight = '';

  const scrollMemo = {};

    const goingBack = depth() < lastDepth;
    const y = window.scrollY;
    if (baseName) scrollMemo[baseName] = y;
    baseName = name;
    app.innerHTML = GO.screens[name].render(state);
    if (GO.screens[name].mount) GO.screens[name].mount(app);
    window.scrollTo(0, !isNew ? y : goingBack ? (scrollMemo[name] || 0) : 0);

  document.addEventListener('click', function (ev) {

    if (!el) return;
    const act = el.getAttribute('data-act');
    const scrs = [overlayName, baseName].map(n => n && GO.screens[n]).filter(Boolean);
    for (const s of scrs) {

    }

  if (window.visualViewport) {
    const vv = window.visualViewport;
    const fit = () => {
      document.documentElement.style.setProperty('--vvh', vv.height + 'px');
      document.documentElement.style.setProperty('--vvt', vv.offsetTop + 'px');

    if (!history.state) history.replaceState({ depth: 0 }, '', location.hash || '#/');
    render();
  }

  return { go, back, start, refresh, path };
})();
